      html = `
        <span class="live-strip-mini-dot"></span>
        <span class="phase-pill ${ph.id}">${ph.label}</span>
        <span class="live-strip-mini-value t-mono">${(ph.remMs/1000).toFixed(1)}s</span>
        <span style="width: 1px; height: 20px; background: var(--mist);"></span>

/* ====================================================================
   8. TAFEL SVG — visual representation of 1 table with 4 zones
==================================================================== */
function tafelSVG(tableId, options = {}) {
  /* Returns an SVG of the tafel with its zones drawn as colored rectangles.
     options:
       selectedZone: zone name to highlight
       activeZone:   zone currently being watered (animated pulse)
       interactive:  attach data-tafel-zone attrs so user can click
       size:         'normal' | 'large' | 'small'
  */
  const zones = state.zones.filter(z => z.table === tableId && z.active);
  if (!zones.length) return `<div class="empty"><div class="empty-title">Tafel ${tableId} heeft geen actieve zones</div><div class="empty-desc">Ga naar Instellingen → Zones om zones te activeren.</div></div>`;

  const size = options.size || 'normal';
  /* 2x2 layout */
  const w = size === 'large' ? 560 : size === 'small' ? 280 : 440;
  const h = size === 'large' ? 380 : size === 'small' ? 190 : 300;
  const pad = 24;
  const zw = (w - pad * 3) / 2;
  const zh = (h - pad * 3) / 2;

  /* Position the up-to-4 zones in 2 rows of 2 */
  const positions = [
    { x: pad, y: pad },
    { x: pad * 2 + zw, y: pad },
    { x: pad, y: pad * 2 + zh },
    { x: pad * 2 + zw, y: pad * 2 + zh },
  ];

  let svg = `<svg class="tafel-svg" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <!-- Outer frame -->
    <rect x="6" y="6" width="${w-12}" height="${h-12}" rx="14" fill="#fdfaf0" stroke="#d8d2bc" stroke-width="2"/>
    <!-- Tafel label -->
    <text x="${w/2}" y="${h-10}" text-anchor="middle" font-family="Inter" font-size="11" font-weight="700" fill="#9a9482" letter-spacing="2">TAFEL ${tableId}</text>
  `;

  zones.slice(0, 4).forEach((z, i) => {
    const pos = positions[i];
    const isSelected = options.selectedZone === z.name;
    const isActive   = options.activeZone === z.name;
    /* multiZones: array van zone-namen met klik-volgorde. Toont volgorde-nummer
       en groene rand op alle gekozen zones (Handmatige Beurt - multi-zone modus). */
    const mzList = Array.isArray(options.multiZones) ? options.multiZones : [];
    const mzIdx  = mzList.indexOf(z.name);
    const inMulti = mzIdx >= 0;
    const lastEvent = (state.batchEvents || []).find(e => e.zone === z.name);
    const lastTank  = lastEvent ? state.tanks.find(t => t.id === lastEvent.tank) : null;
    const lastDev   = lastEvent ? Math.abs(lastEvent.deviationPct) : null;
    let fillColor = '#f5f1e6';
    let strokeColor = '#d8d2bc';
    let strokeWidth = 1.5;
    if (lastTank) {
      /* Use a faint tank-color tint when zone has recent activity */
      fillColor = lastTank.color + '14';  /* 14 = 8% opacity hex */
      strokeColor = lastTank.color + '60';
    }
    if (isSelected || inMulti) { strokeColor = '#5e9c3a'; strokeWidth = 3; }
    if (inMulti) { fillColor = '#dcfce7'; }
    if (isActive) { strokeColor = '#5e9c3a'; strokeWidth = 3; fillColor = '#dcfce7'; }

    /* Zone rectangle */
    svg += `<g>`;
    svg += `<rect x="${pos.x}" y="${pos.y}" width="${zw}" height="${zh}" rx="10" fill="${fillColor}" stroke="${strokeColor}" stroke-width="${strokeWidth}"/>`;
    /* Plant icons inside */
    const cols = 5, rows = 5;
    const px = zw / (cols + 1);
    const py = zh / (rows + 1);
    for (let r = 1; r <= rows; r++) {
      for (let c = 1; c <= cols; c++) {
        const cx = pos.x + c * px;
        const cy = pos.y + r * py;
        svg += `<g transform="translate(${cx},${cy})">`;
        svg += `<circle r="3.5" fill="${lastTank ? lastTank.color : '#5e9c3a'}" opacity="0.7"/>`;
        svg += `<path d="M0,-4 C-2,-7 -5,-7 -5,-4 C-5,-1 -2,-2 0,-4 M0,-4 C2,-7 5,-7 5,-4 C5,-1 2,-2 0,-4" fill="${lastTank ? lastTank.color : '#5e9c3a'}" opacity="0.85"/>`;
        svg += `</g>`;
      }
    }
    /* Zone label */
    svg += `<text x="${pos.x + 14}" y="${pos.y + 22}" font-family="Inter" font-size="13" font-weight="700" fill="#1a1815" pointer-events="none">${z.name}</text>`;
    svg += `<text x="${pos.x + 14}" y="${pos.y + 37}" font-family="Inter" font-size="11" fill="#6b6859" pointer-events="none">${z.plants} planten</text>`;
    /* Deviation indicator if recent */
    if (lastDev != null) {
      const devColor = devClass(lastDev) === 'ok' ? '#16a34a' :
                       devClass(lastDev) === 'near' ? '#84cc16' :
                       devClass(lastDev) === 'warn' ? '#d97706' : '#c2410c';
      svg += `<g transform="translate(${pos.x + zw - 14}, ${pos.y + 14})" pointer-events="none">`;
      svg += `<circle r="6" fill="${devColor}"/>`;
      svg += `</g>`;
    }
    /* Multi-zone volgorde-nummer (Handmatige Beurt) */
    if (inMulti) {
      svg += `<g transform="translate(${pos.x + zw - 18}, ${pos.y + zh - 18})" pointer-events="none">`;
      svg += `<circle r="14" fill="#5e9c3a"/>`;
      svg += `<text x="0" y="5" text-anchor="middle" font-family="Inter" font-size="14" font-weight="800" fill="white">${mzIdx + 1}</text>`;
      svg += `</g>`;
    }
    /* Active pulse */
    if (isActive) {
      svg += `<rect x="${pos.x}" y="${pos.y}" width="${zw}" height="${zh}" rx="10" fill="none" stroke="#5e9c3a" stroke-width="2" opacity="0.6" pointer-events="none">
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-width" values="2;5;2" dur="1.4s" repeatCount="indefinite"/>
      </rect>`;
    }
    /* Transparent click-overlay on top — guarantees clicks register on all browsers */
    if (options.interactive) {
      svg += `<rect x="${pos.x}" y="${pos.y}" width="${zw}" height="${zh}" rx="10" fill="white" fill-opacity="0" style="cursor: pointer;" pointer-events="all" data-tafel-zone="${z.name}"/>`;
    }
    svg += `</g>`;
  });

  svg += `</svg>`;
  return svg;
}

          <div class="stat-block">
            <div class="stat-block-label">Volgende beurt</div>
            <div class="stat-block-value" style="font-size: 18px;">~ 5s</div>
            <div class="stat-block-trend">— automatisch geplanned</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Recente beurten -->
    <div class="section-heading">Recente beurten</div>
    <div class="card" style="padding: 0;">
      ${recent.length === 0 ? `
        <div style="padding: 40px 24px; text-align: center; color: var(--ash);">
          Nog geen beurten gedraaid. Start een handmatige beurt om de machine te testen.
        </div>
      ` : `
        <table class="t">
          <thead><tr>
            <th>Tijd</th><th>Tank</th><th>Zone</th><th>mL/plant</th><th>Totaal</th><th>Afwijking</th>
          </tr></thead>
          <tbody>
            ${recent.slice(0, 12).map(e => {
              const t = state.tanks.find(tt => tt.id === e.tank);
              const dv = devClass(e.deviationPct);
              const devColor = dv === 'ok' ? 'var(--plant-600)' : dv === 'near' ? '#84cc16' : dv === 'warn' ? 'var(--amber-700)' : 'var(--rust-600)';
              return `<tr>
                <td class="cell-mono muted">${fmtTime(e.ts)}</td>
                <td><span class="tank-chip t${e.tank}"><span class="tank-chip-dot"></span>${t ? t.smaak : 'Tank ' + e.tank}</span></td>
                <td><strong>${e.zone}</strong></td>
                <td class="cell-mono">${e.mlPerPlant} mL</td>
                <td class="cell-mono">${e.targetMl} mL</td>
                <td class="cell-mono" style="color: ${devColor}; font-weight: 700;">${e.deviationPct > 0 ? '+' : ''}${e.deviationPct.toFixed(1)}%</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      `}
    </div>
  `;
}

/* ====================================================================
   10. PAGE: HANDMATIGE BEURT (super simple — 3 inputs)
==================================================================== */
/* manualState voor de Handmatige-Beurt pagina.
   - `zones` is een array van zone-namen IN VOLGORDE. Eerst gekozen = eerst aan
     de beurt. Bij meerdere zones queue't de backend ze sequentieel.
   - `tank` (smaak) geldt voor alle gekozen zones — operator kan voor elke
     zone-set één smaak kiezen. Voor verschillende smaken per zone: meerdere
     keren handmatige beurt achter elkaar.
   - Legacy `zone` (enkelvoud) wordt bij init automatisch omgezet naar zones-array. */
/* manualState voor de Handmatige-Beurt pagina.
   - `zones` is een array van zone-namen IN VOLGORDE. Eerst gekozen = eerst aan
     de beurt. Bij meerdere zones queue't de backend ze sequentieel.
   - `tank` is de DEFAULT smaak (wordt gebruikt voor alle zones tenzij
     `perZoneSmaak` aan staat).
   - `zoneTanks` is een map { zoneName → tankId } voor wanneer operator per
     zone een aparte smaak wil. Pas relevant als `perZoneSmaak` true is.
   - `perZoneSmaak` toggle: aan = elke zone heeft eigen tank; uit = één tank voor alle.
   - Legacy `zone` (enkelvoud) wordt bij init automatisch omgezet naar zones-array. */
var manualState = { tank: 1, zones: [], zoneTanks: {}, perZoneSmaak: false, mlPerPlant: 30, _inited: false };

function renderManual() {
  const activeZones = state.zones.filter(z => z.active);
  /* Init vanuit state.lastManual, met legacy-conversie van `zone` → `zones`. */
  if (state.lastManual && !manualState._inited) {
    manualState = { ...manualState, ...state.lastManual };
    if (state.lastManual.zone && !Array.isArray(manualState.zones)) {
      manualState.zones = [state.lastManual.zone];
    }
    manualState._inited = true;
  }
  if (!Array.isArray(manualState.zones)) manualState.zones = [];
  if (!manualState.zoneTanks || typeof manualState.zoneTanks !== 'object') manualState.zoneTanks = {};
  if (typeof manualState.perZoneSmaak !== 'boolean') manualState.perZoneSmaak = false;
  /* Filter zones-lijst: alleen actieve, en behoud volgorde. */
  manualState.zones = manualState.zones.filter(zn => activeZones.find(z => z.name === zn));
  /* zoneTanks: ontdoen van zones die niet meer geselecteerd zijn (opruimen). */
  Object.keys(manualState.zoneTanks).forEach(zn => {
    if (!manualState.zones.includes(zn)) delete manualState.zoneTanks[zn];
  });
  manualState.mlPerPlant = clamp(manualState.mlPerPlant || 30, 10, 50);

  const activeTable = state.tables.find(t => t.active);
  if (!activeTable || !activeZones.length) {
    $app().innerHTML = `<div class="empty"><div class="empty-title">Activeer eerst een tafel en zones</div><div class="empty-desc">Ga naar Instellingen om de machine in te richten.</div></div>`;
    return;
  }

  const tank = state.tanks.find(t => t.id === manualState.tank);
  const ml   = manualState.mlPerPlant;

  /* Helper: welke tank krijgt deze zone? Bij perZoneSmaak gebruikt zoneTanks-map;
     anders default-tank. Fallback altijd op manualState.tank zodat er nooit
     undefined wordt gestuurd. */
  function tankForZone(zoneName) {
    if (manualState.perZoneSmaak && manualState.zoneTanks && manualState.zoneTanks[zoneName]) {
      return manualState.zoneTanks[zoneName];
    }
    return manualState.tank;
  }

  /* Per zone een mini-cyclus berekenen met de juiste tank per zone. */
  const perZoneCycles = manualState.zones.map(zn => computeCycle(tankForZone(zn), zn, ml));
  const totalMl  = perZoneCycles.reduce((s, c) => s + (c?.totalMl  || 0), 0);
  const totalSec = perZoneCycles.reduce((s, c) => s + (c?.totalSec || 0), 0);

  /* Hint based on range positioning */
  let hint = '', hintClass = '';
  if (ml <= 15) { hint = 'Weinig water — geschikt voor jonge planten of lichte droogtebijslag.'; hintClass = 'ok'; }
  else if (ml <= 30) { hint = 'Standaard hoeveelheid voor onderhoudsbeurten.'; hintClass = 'ok'; }
  else if (ml <= 40) { hint = 'Ruime beurt — geschikt na droge periode.'; hintClass = 'ok'; }
  else { hint = 'Maximum beurt — vol substraat na deze beurt.'; hintClass = 'warn'; }

  const hasZones = manualState.zones.length > 0;
  const anyBadRegion = perZoneCycles.some(c => c && (c.region === 'dead' || c.region === 'sparse'));
  const canStart = hasZones && totalMl > 0 && state.systemMode !== 'paused' && !anyBadRegion;

  /* Zone-card render: één per actieve zone, met klik-toggle en volgorde-nummer. */
  const zoneCard = (z) => {

    const selected = idx >= 0;
    return `

  };

  $app().innerHTML = `

            </div>

          </div>

          <div class="mz-grid">
            ${activeZones.map(zoneCard).join('')}
          </div>

          ${hasZones ? `
          <div class="mz-summary mt-md">
            <div class="t-meta-strong">Geselecteerde volgorde:</div>
            <div class="mz-chips">
              ${manualState.zones.map((zn, i) => `
                <span class="mz-chip">
                  <span class="mz-chip-num">${i+1}</span>
                  <span>${zn}</span>
                  <button data-mz-remove="${zn}" class="mz-chip-x" title="Verwijderen">×</button>
                </span>
              `).join('')}
            </div>
          </div>
          ` : ''}

          <div class="tafel-svg-wrap mt-md" style="padding: 16px 0; background: var(--cream); border-radius: 12px;">
            ${tafelSVG(activeTable.id, { selectedZone: manualState.zones[0] || null, interactive: true, multiZones: manualState.zones })}
          </div>
          <div class="t-meta mt-md" style="text-align: center;">Klik op een zone in een blok of in het plaatje om toe te voegen of te verwijderen.</div>
        </div>

        <!-- Stap 2: kies smaak -->
        <div class="card-lg">
          <div class="row-between mb-md">
            <div>
              <div class="t-meta-strong" style="color: var(--plant-700);">Stap 2</div>
              <h2 class="t-h2" style="margin: 4px 0 0;">Welke smaak?</h2>
              <div class="t-meta mt-sm">${manualState.perZoneSmaak && manualState.zones.length > 1 ? 'Aparte smaak per zone — selecteer hieronder per zone.' : 'Geldt voor alle gekozen zones in deze serie.'}</div>
            </div>
            ${manualState.zones.length > 1 ? `
              <label class="row gap-md" style="align-items: center; cursor: pointer; user-select: none;">
                <input type="checkbox" id="mz-per-zone-toggle" ${manualState.perZoneSmaak ? 'checked' : ''} style="width: 16px; height: 16px; cursor: pointer;" />
                <span class="t-meta-strong">Aparte smaak per zone</span>
              </label>
            ` : `<span class="pill pill-plant">Tank gekozen: ${tank.smaak}</span>`}
          </div>

          ${(!manualState.perZoneSmaak || manualState.zones.length <= 1) ? `
            <!-- Eén smaak voor alle zones (default) -->
            <div class="tank-choices">
              ${state.tanks.map(t => `
                <button class="tank-choice t${t.id} ${manualState.tank === t.id ? 'selected' : ''}" data-pick-tank="${t.id}">
                  <div class="tank-choice-head">${t.name}</div>
                  <div class="tank-choice-recept">${t.smaak}</div>
                  <div class="tank-choice-meta">EC ${t.ec.toFixed(1)} · pH ${t.ph.toFixed(1)}</div>
                </button>
              `).join('')}
            </div>
          ` : `
            <!-- Per-zone smaak: één rij per zone met compacte pomp-pillen -->
            <div class="mz-zonetank-list">
              ${manualState.zones.map((zn, i) => {
                const zt = tankForZone(zn);
                return `
                <div class="mz-zonetank-row">
                  <span class="mz-chip-num">${i+1}</span>
                  <span class="mz-zonetank-name">${zn}</span>
                  <div class="mz-zonetank-pills">
                    ${state.tanks.map(t => `
                      <button class="mz-zonetank-pill t${t.id} ${zt === t.id ? 'selected' : ''}"
                              data-pick-zone-tank="${zn}" data-tank-id="${t.id}"
                              title="${t.smaak}">
                        <span class="mz-zonetank-pill-dot"></span>
                        ${t.smaak}
                      </button>
                    `).join('')}
                  </div>
                </div>
              `}).join('')}
            </div>
            <div class="t-meta mt-md" style="font-size: 12px;">Tip: zet de toggle uit voor één smaak voor alle zones.</div>
          `}
        </div>

        <!-- Stap 3: hoeveelheid -->
        <div class="card-lg">
          <div class="row-between mb-md">
            <div>
              <div class="t-meta-strong" style="color: var(--plant-700);">Stap 3</div>
              <h2 class="t-h2" style="margin: 4px 0 0;">Hoeveel water per plant?</h2>
            </div>

          </div>
          ${hint ? `<div class="field-hint ${hintClass} mt-md" style="text-align:center;">${hint}</div>` : ''}
          <div class="t-meta mt-md" style="text-align: center; font-size: 11px;">Bereik beperkt tot 10 – 50 mL per plant. Voor andere hoeveelheden: weekplanner.</div>
        </div>

      </div>

      <!-- Rechter kolom: preview + START -->
      <div class="stack" style="gap: 20px; position: sticky; top: 88px;">

        <!-- Big preview card -->
        <div class="card-lg" style="background: var(--cream);">
          <div class="t-meta-strong">Wat je gaat sturen</div>

                 <span class="t-meta">naar</span>
                 <strong style="font-size: 16px;">${manualState.zones.length === 1 ? manualState.zones[0] : `${manualState.zones.length} zones`}</strong>`

            ${totalMl}<span style="font-size: 18px; color: var(--ash); margin-left: 6px;">mL</span>
          </div>
          <div class="t-meta">${manualState.mlPerPlant} mL × ${perZoneCycles.reduce((s,c)=>s+(c?.plants||0),0)} planten totaal · ${totalSec.toFixed(0)}s draaitijd</div>
          ${manualState.zones.length > 1 ? `
            <div class="mz-preview-list mt-md">
              ${perZoneCycles.map((c, i) => {
                const zTank = state.tanks.find(t => t.id === tankForZone(manualState.zones[i]));
                return `
                <div class="mz-preview-row">
                  <span class="mz-preview-num">${i+1}</span>
                  <span class="mz-preview-name">${manualState.zones[i]}</span>
                  <span class="tank-chip t${zTank?.id || 1}" style="padding: 2px 8px; font-size: 11px;"><span class="tank-chip-dot"></span>${zTank?.smaak || '?'}</span>
                  <span class="mz-preview-ml">${c?.totalMl ?? 0} mL</span>
                </div>
              `}).join('')}
            </div>
          ` : ''}
          ` : `
            <div class="t-meta mt-md" style="text-align: center; padding: 20px 0; opacity: 0.7;">
              Kies eerst één of meer zones bij Stap 1.
            </div>
          `}
        </div>

        ${anyBadRegion ? `
          <div class="card" style="background: var(--rust-50); border-color: var(--rust-100); color: var(--rust-700);">
            <div class="row-tight" style="gap: 10px;"><span style="font-size: 20px;">⚠</span><strong>Niet alle gekozen zones zijn klaar.</strong></div>
            <div class="t-meta mt-sm" style="color: var(--rust-700);">Eén of meer zones hebben te weinig water of een onbetrouwbare kalibratie. Kies een andere mL/plant of kalibreer de pomp eerst.</div>
          </div>
        ` : ''}

        <button class="btn-hero ${canStart ? '' : 'disabled'}" id="manual-start">
          ${svgEl('<polygon points="5 3 19 12 5 21 5 3"/>', 24)}
          ${manualState.zones.length > 1 ? `Start ${manualState.zones.length} beurten` : 'Start beurt'}
        </button>
      </div>
    </div>
  `;

  /* === Bindings === */
  document.querySelectorAll('[data-pick-tank]').forEach(b => b.addEventListener('click', () => {
    manualState.tank = parseInt(b.getAttribute('data-pick-tank'));
    persistManual();
    renderManual();
  }));
  /* Zone-card toggle (multi-select in klik-volgorde) */
  function toggleZone(name) {
    const idx = manualState.zones.indexOf(name);
    if (idx >= 0) manualState.zones.splice(idx, 1);
    else manualState.zones.push(name);
    persistManual();
    renderManual();
  }
  document.querySelectorAll('[data-mz-toggle]').forEach(b => b.addEventListener('click', () => {
    toggleZone(b.getAttribute('data-mz-toggle'));
  }));
  document.querySelectorAll('[data-mz-remove]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const name = b.getAttribute('data-mz-remove');
    const idx = manualState.zones.indexOf(name);
    if (idx >= 0) { manualState.zones.splice(idx, 1); persistManual(); renderManual(); }
  }));
  /* SVG-klik op zone: zelfde toggle-gedrag */
  document.querySelectorAll('[data-tafel-zone]').forEach(g => g.addEventListener('click', () => {
    toggleZone(g.getAttribute('data-tafel-zone'));
  }));
  const clearBtn = document.getElementById('mz-clear');
  if (clearBtn) clearBtn.addEventListener('click', () => {
    manualState.zones = [];
    persistManual();
    renderManual();
  });
  /* Hoeveelheid-bindings (onveranderd) */
  document.querySelectorAll('[data-ml-delta]').forEach(b => b.addEventListener('click', () => {
    const d = parseInt(b.getAttribute('data-ml-delta'));
    manualState.mlPerPlant = clamp(manualState.mlPerPlant + d, 10, 50);
    persistManual();
    renderManual();
  }));
  document.querySelectorAll('[data-ml-quick]').forEach(b => b.addEventListener('click', () => {
    manualState.mlPerPlant = clamp(parseInt(b.getAttribute('data-ml-quick')), 10, 50);
    persistManual();
    renderManual();
  }));
  const slider = document.getElementById('ml-slider');
  if (slider) slider.addEventListener('input', () => {
    manualState.mlPerPlant = clamp(parseInt(slider.value), 10, 50);
    persistManual();
    renderManual();
  });
  document.getElementById('manual-start').addEventListener('click', () => {
    if (!canStart) return;
    if (manualState.mlPerPlant >= 45) {
      if (!confirm(`Je gaat ${totalMl} mL (${(totalMl/1000).toFixed(2)} L) naar ${manualState.zones.length} zone(s) sturen.\n\nGrote beurt — doorgaan?`)) return;
    }
    /* De backend krijgt deze beurt(en) via het integration-script onderaan. */
    if (state.systemMode === 'dryrun') {
      toast(`Test-modus: ${totalMl} mL → ${manualState.zones.length} zones (geen hardware-actie)`, 'success');
    }
  });

  /* Per-zone smaak toggle */
  const ptToggle = document.getElementById('mz-per-zone-toggle');
  if (ptToggle) ptToggle.addEventListener('change', () => {
    manualState.perZoneSmaak = ptToggle.checked;
    /* Bij aanzetten: vul zoneTanks met default-tank voor elke geselecteerde zone
       die nog geen toewijzing heeft. Zo ziet operator meteen iets gevuld. */
    if (manualState.perZoneSmaak) {
      manualState.zones.forEach(zn => {
        if (!manualState.zoneTanks[zn]) manualState.zoneTanks[zn] = manualState.tank;
      });
    }
    persistManual();
    renderManual();
  });
  /* Per-zone tank kiezer: pill knoppen */
  document.querySelectorAll('[data-pick-zone-tank]').forEach(b => b.addEventListener('click', () => {
    const zn   = b.getAttribute('data-pick-zone-tank');
    const tkId = parseInt(b.getAttribute('data-tank-id'));
    manualState.zoneTanks[zn] = tkId;
    persistManual();
    renderManual();
  }));

  /* Helper: persist en saveState in één */
  function persistManual() {
    state.lastManual = {
      tank: manualState.tank,
      zones: manualState.zones.slice(),
      zoneTanks: { ...manualState.zoneTanks },
      perZoneSmaak: !!manualState.perZoneSmaak,
      mlPerPlant: manualState.mlPerPlant,
    };
    saveState();
  }
}

/* ====================================================================
   11. WATERFALL PREVIEW — actor timeline
==================================================================== */
function renderWaterfall(cycle) {
  /* Total seconds incl. all phases */
  const total = cycle.totalSec;
  const pct = sec => (sec / total) * 100;
  /* Phase start offsets:
     pump warm-up: 0 → pumpWarmupSec
     water:        pumpWarmupSec → +waterSec   (pump valve open)
     compression:  immediately after water → +compressionSec
     valve close:  right at end of compression (the marker)
     after-blow:   right after valve close → +afterBlowSec
     compressor air valve: from start of compression through after-blow
     router valve: from start of water through end of compression (i.e. open during water + air-push, closes at after-blow start)
  */
  const pumpStart    = 0;
  const waterStart   = cycle.pumpWarmupSec;
  const waterEnd     = waterStart + cycle.waterSec;
  const compStart    = waterEnd;
  const compEnd      = compStart + cycle.compressionSec;
  const valveCloseAt = compEnd;
  const afterStart   = compEnd;
  const afterEnd     = afterStart + cycle.afterBlowSec;

  const seg = (cls, label, start, end) => `<div class="waterfall-block ${cls}" style="left: ${pct(start)}%; width: ${pct(end - start)}%;">${pct(end - start) > 12 ? label : ''}</div>`;

  /* Build axis ticks */
  const ticks = 5;
  let axis = '';
  for (let i = 0; i <= ticks; i++) {
    axis += `<span>${(total * i / ticks).toFixed(1)}s</span>`;
  }

  return `
    <div class="waterfall">
      <div class="waterfall-actor-label">Pomp</div>
      <div class="waterfall-track">
        ${seg('pumpwarm', 'opdrukken', pumpStart, waterStart)}
        ${seg('water', 'pompen', waterStart, waterEnd)}
      </div>

      <div class="waterfall-actor-label">Compressor</div>
      <div class="waterfall-track">
        ${seg('compress', 'lucht duwt', compStart, compEnd)}
        ${seg('afterblow', 'naspoelen', afterStart, afterEnd)}
      </div>

      <div class="waterfall-actor-label">Klep zone</div>
      <div class="waterfall-track">
        ${seg('water', 'klep open', waterStart, valveCloseAt)}
        <div class="waterfall-marker" style="left: ${pct(valveCloseAt)}%;">
          <div class="waterfall-marker-label">klep dicht</div>
        </div>
      </div>

      <div></div>
      <div class="waterfall-axis">${axis}</div>
    </div>

    <div class="waterfall-legend">
      <span class="waterfall-legend-item"><span class="waterfall-legend-swatch" style="background: #94a3b8;"></span>Pomp opdrukken</span>
      <span class="waterfall-legend-item"><span class="waterfall-legend-swatch" style="background: var(--sky-500);"></span>Water</span>
      <span class="waterfall-legend-item"><span class="waterfall-legend-swatch" style="background: #14b8a6;"></span>Lucht duwt</span>
      <span class="waterfall-legend-item"><span class="waterfall-legend-swatch" style="background: var(--amber-500);"></span>Naspoelen</span>
      <span class="waterfall-legend-item"><span class="waterfall-legend-swatch" style="background: var(--rust-500);"></span>Klep dicht</span>
    </div>
  `;
}

/* ====================================================================
   12. PAGE: WEEKPLANNER (per zone view)
==================================================================== */
let plannerState = { selectedZone: null };

function renderPlanner() {
  const activeZones = state.zones.filter(z => z.active);
  if (!plannerState.selectedZone && activeZones.length) {
    plannerState.selectedZone = activeZones[0].name;
  }
  const selZone = state.zones.find(z => z.name === plannerState.selectedZone);
  if (!selZone) {
    $app().innerHTML = `<div class="empty"><div class="empty-title">Geen actieve zones</div></div>`;
    return;
  }

  const entries = state.weekSchedule.entries.filter(e => e.zone === selZone.name);
  const byDay = {};
  DAYS.forEach(d => byDay[d] = []);
  entries.forEach(e => { if (byDay[e.day]) byDay[e.day].push(e); });
  DAYS.forEach(d => byDay[d].sort((a,b) => a.time.localeCompare(b.time)));

  /* Daily totals per zone */
  const dailyTotalMl = d => byDay[d].reduce((a, e) => a + e.mlPerPlant * selZone.plants, 0);

  $app().innerHTML = `
    <div class="live-strip-mini"></div>

    <div class="planner-layout">

      <!-- Left: zone list -->
      <div>
        <div class="t-meta-strong mb-md" style="padding: 0 4px;">Kies zone</div>
        <div class="planner-zones">
          ${activeZones.map(z => {
            const count = state.weekSchedule.entries.filter(e => e.zone === z.name).length;
            return `
              <button class="planner-zone ${z.name === plannerState.selectedZone ? 'selected' : ''}" data-pick-zone="${z.name}">
                <div>
                  <div class="planner-zone-name">${z.name}</div>
                  <div class="planner-zone-sub">Tafel ${z.table} · ${z.plants} planten</div>
                </div>
                <span class="planner-zone-count">${count}</span>
              </button>
            `;
          }).join('')}
        </div>

        <div class="card-soft mt-lg" style="padding: 18px;">
          <div class="t-meta-strong mb-md">Snel inrichten</div>
          <button class="btn btn-sm" id="copy-weekday-btn" style="width: 100%; margin-bottom: 6px;">Kopieer maandag naar werkdagen</button>
          <button class="btn btn-sm" id="copy-all-btn" style="width: 100%; margin-bottom: 6px;">Kopieer maandag naar hele week</button>
          <button class="btn btn-sm btn-danger" id="clear-zone-btn" style="width: 100%;">Maak deze zone leeg</button>
        </div>
      </div>

      <!-- Right: 7-day grid -->
      <div>
        <div class="row-between mb-md">
          <div>
            <div class="t-h2">${selZone.name}</div>
            <div class="t-meta">Tafel ${selZone.table} · ${selZone.plants} planten</div>
          </div>
          <div class="t-meta">${entries.length} beurten deze week · ${(entries.reduce((a, e) => a + e.mlPerPlant * selZone.plants, 0) / 1000).toFixed(1)} L</div>
        </div>

        <div class="week-grid">
          ${DAYS.map(d => `
            <div class="week-day">
              <div class="week-day-head">
                <div>
                  <div class="week-day-label">${DAY_SHORT[d]}</div>
                  <div class="t-meta" style="font-size: 10px;">${byDay[d].length} × · ${(dailyTotalMl(d)/1000).toFixed(1)}L</div>
                </div>
                <button class="week-day-menu" data-day-menu="${d}" title="Meer acties">⋯</button>
              </div>
              <div class="week-events">
                ${byDay[d].map(e => {
                  const t = state.tanks.find(tt => tt.id === e.tank);
                  return `<div class="week-event t${e.tank}" data-edit-entry="${e.id}">
                    <span class="week-event-time">${e.time}</span>
                    <span class="tank-chip-dot" style="background: ${t ? t.color : 'var(--ash)'};"></span>
                    <span class="week-event-vol">${e.mlPerPlant}mL</span>
                  </div>`;
                }).join('')}
              </div>
              <button class="week-add-btn" data-add-entry="${d}">+ Toevoegen</button>
            </div>
          `).join('')}
        </div>
      </div>

    </div>
  `;

  /* Bindings */
  document.querySelectorAll('[data-pick-zone]').forEach(b => b.addEventListener('click', () => {
    plannerState.selectedZone = b.getAttribute('data-pick-zone');
    renderPlanner();
  }));
  document.querySelectorAll('[data-add-entry]').forEach(b => b.addEventListener('click', () => {
    openEntryModal(selZone.name, b.getAttribute('data-add-entry'));
  }));
  document.querySelectorAll('[data-edit-entry]').forEach(b => b.addEventListener('click', () => {
    openEntryModal(selZone.name, null, b.getAttribute('data-edit-entry'));
  }));
  document.querySelectorAll('[data-day-menu]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    openDayMenu(b, b.getAttribute('data-day-menu'), selZone.name);
  }));
  document.getElementById('copy-weekday-btn').addEventListener('click', () => copyDay(selZone.name, 'mon', ['tue','wed','thu','fri']));
  document.getElementById('copy-all-btn').addEventListener('click', () => copyDay(selZone.name, 'mon', DAYS.filter(d => d !== 'mon')));
  document.getElementById('clear-zone-btn').addEventListener('click', () => {
    if (!confirm(`Verwijder ALLE geplande beurten voor ${selZone.name}?`)) return;
    state.weekSchedule.entries = state.weekSchedule.entries.filter(e => e.zone !== selZone.name);
    saveState();
    toast('Zone-planning gewist', 'success');
    renderPlanner();
  });
}

function openEntryModal(zoneName, day, editId) {
  const existing = editId ? state.weekSchedule.entries.find(e => e.id === editId) : null;
  const data = existing || { zone: zoneName, day, time: '08:00', tank: 1, mlPerPlant: 30 };
  const m = openModal(`
    <h2>${existing ? 'Beurt bewerken' : 'Nieuwe beurt plannen'}</h2>
    <div class="modal-sub">${zoneName} · ${DAY_LABELS[data.day]}</div>
    <div class="stack">
      <div class="field">
        <label class="field-label">Welke smaak?</label>
        <div class="row gap-sm">
          ${state.tanks.map(t => `
            <button class="tank-choice t${t.id} ${data.tank === t.id ? 'selected' : ''}" data-mod-tank="${t.id}" style="padding: 12px 14px;">
              <div class="tank-choice-head" style="font-size: 14px;">${t.name}</div>
              <div class="tank-choice-recept" style="font-size: 11px;">${t.smaak}</div>
            </button>
          `).join('')}
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label class="field-label">Tijd</label>
          <input class="input mono" id="mod-time" type="time" value="${data.time}" />
        </div>
        <div class="field">
          <label class="field-label">mL per plant</label>
          <input class="input mono" id="mod-ml" type="number" min="0" max="500" value="${data.mlPerPlant}" />
        </div>
      </div>
      <div class="card-soft" style="padding: 14px 16px;">
        <div class="t-meta-strong" style="margin-bottom: 4px;">Totaal water</div>
        <div class="t-num" id="mod-total">— mL</div>
      </div>
    </div>
    <div class="modal-actions">
      ${existing ? `<button class="btn btn-danger" id="mod-del" style="margin-right: auto;">Verwijderen</button>` : ''}
      <button class="btn" id="mod-cancel">Annuleren</button>
      <button class="btn btn-primary" id="mod-save">${existing ? 'Opslaan' : 'Beurt plannen'}</button>
    </div>
  `);
  const zone = state.zones.find(z => z.name === zoneName);
  let chosen = { ...data };
  const refreshTotal = () => {
    const ml = parseInt(document.getElementById('mod-ml').value) || 0;
    document.getElementById('mod-total').innerHTML = `${ml * zone.plants} mL <span class="muted" style="font-size: 12px; font-weight: 500;">(${ml} mL × ${zone.plants} planten)</span>`;
  };
  refreshTotal();
  m.querySelectorAll('[data-mod-tank]').forEach(b => b.addEventListener('click', () => {
    chosen.tank = parseInt(b.getAttribute('data-mod-tank'));
    m.querySelectorAll('[data-mod-tank]').forEach(bb => bb.classList.toggle('selected', parseInt(bb.getAttribute('data-mod-tank')) === chosen.tank));
  }));
  m.querySelector('#mod-ml').addEventListener('input', refreshTotal);
  m.querySelector('#mod-cancel').addEventListener('click', () => m.remove());
  m.querySelector('#mod-save').addEventListener('click', () => {
    const time = m.querySelector('#mod-time').value;
    const ml = parseInt(m.querySelector('#mod-ml').value) || 0;
    if (ml <= 0) { toast('Vul een aantal mL in', 'error'); return; }
    if (existing) {
      existing.tank = chosen.tank;
      existing.time = time;
      existing.mlPerPlant = ml;
    } else {
      state.weekSchedule.entries.push({
        id: 'evt_' + Date.now() + '_' + Math.floor(Math.random() * 999),
        zone: zoneName,
        day: data.day,
        time, tank: chosen.tank, mlPerPlant: ml,
      });
    }
    saveState();
    toast(existing ? 'Beurt aangepast' : 'Beurt gepland', 'success');
    m.remove();
    renderPlanner();
  });
  if (existing) {
    m.querySelector('#mod-del').addEventListener('click', () => {
      state.weekSchedule.entries = state.weekSchedule.entries.filter(e => e.id !== existing.id);
      saveState();
      toast('Beurt verwijderd');
      m.remove();
      renderPlanner();
    });
  }
}

function openDayMenu(anchor, day, zoneName) {
  /* Remove any existing menu */
  document.querySelectorAll('.day-menu-pop').forEach(e => e.remove());
  const rect = anchor.getBoundingClientRect();
  const pop = document.createElement('div');
  pop.className = 'day-menu-pop';
  pop.style.top = (rect.bottom + 4) + 'px';
  pop.style.left = (rect.right - 200) + 'px';
  pop.innerHTML = `
    <div class="day-menu-item" data-copy-to-weekdays>Kopieer naar werkdagen</div>
    <div class="day-menu-item" data-copy-to-weekend>Kopieer naar weekend</div>
    <div class="day-menu-item" data-copy-to-all>Kopieer naar hele week</div>
    <div style="height: 1px; background: var(--mist); margin: 4px;"></div>
    <div class="day-menu-item" data-clear-day style="color: var(--rust-600);">Maak ${DAY_LABELS[day]} leeg</div>
  `;
  document.body.appendChild(pop);
  setTimeout(() => {
    document.addEventListener('click', function close() {
      pop.remove();
      document.removeEventListener('click', close);
    });
  }, 10);
  pop.querySelector('[data-copy-to-weekdays]').addEventListener('click', () => { copyDay(zoneName, day, ['mon','tue','wed','thu','fri'].filter(d => d !== day)); pop.remove(); });
  pop.querySelector('[data-copy-to-weekend]').addEventListener('click', () => { copyDay(zoneName, day, ['sat','sun'].filter(d => d !== day)); pop.remove(); });
  pop.querySelector('[data-copy-to-all]').addEventListener('click', () => { copyDay(zoneName, day, DAYS.filter(d => d !== day)); pop.remove(); });
  pop.querySelector('[data-clear-day]').addEventListener('click', () => {
    state.weekSchedule.entries = state.weekSchedule.entries.filter(e => !(e.zone === zoneName && e.day === day));
    saveState();
    toast(`${DAY_LABELS[day]} gewist`);
    pop.remove();
    renderPlanner();
  });
}

function copyDay(zoneName, sourceDay, targetDays) {
  const source = state.weekSchedule.entries.filter(e => e.zone === zoneName && e.day === sourceDay);
  if (!source.length) { toast(`${DAY_LABELS[sourceDay]} heeft geen beurten om te kopiëren`, 'warn'); return; }
  /* Remove existing entries on target days */
  state.weekSchedule.entries = state.weekSchedule.entries.filter(e => !(e.zone === zoneName && targetDays.includes(e.day)));
  /* Add copies */
  targetDays.forEach(td => {
    source.forEach(s => {
      state.weekSchedule.entries.push({
        ...s,
        id: 'evt_' + Date.now() + '_' + Math.floor(Math.random() * 99999),
        day: td,
      });
    });
  });
  saveState();
  toast(`${source.length} beurten gekopieerd naar ${targetDays.length} dagen`, 'success');
  renderPlanner();
}

function renderSensors() {
  const activeTables = state.tables.filter(t => t.active);
  if (!activeTables.length) {
    $app().innerHTML = `<div class="empty"><div class="empty-title">Geen tafel actief</div><div class="empty-desc">Sensoren zijn alleen zichtbaar voor actieve tafels.</div></div>`;

  }

  $app().innerHTML = `

    <div class="card mb-md" style="background: var(--cream); border: none;">
      <div class="row gap-md">
        <div class="empty-icon" style="background: var(--canvas); width: 44px; height: 44px;">${svgEl('<path d="M9 11 L9 17 M15 7 L15 17 M3 21 L21 21"/><circle cx="9" cy="8" r="2"/><circle cx="15" cy="4" r="2"/>', 22)}</div>
        <div>
          <div class="t-h3">Substraat-sensoren</div>

        </div>

}

function renderTafelSensorBlock(tableId) {
  const tafel = state.substrate ? state.substrate[tableId] : null;
  if (!tafel) return '';
  const ecAvg = mean(tafel.points.map(p => p.ec));
  const tempAvg = mean(tafel.points.map(p => p.temp));
  const moistAvg = mean(tafel.points.map(p => p.moisture));

  /* 4×2 heatmap layout for 8 sensors */
  let heatmap = '<div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;">';
  tafel.points.forEach(p => {
    const mc = p.moisture < 35 ? 'var(--rust-500)' : p.moisture < 45 ? 'var(--amber-500)' : p.moisture > 75 ? 'var(--sky-500)' : 'var(--plant-500)';
    heatmap += `
      <div style="background: var(--cream); border-radius: 10px; padding: 12px; border: 1px solid var(--mist);">
        <div class="row-between" style="margin-bottom: 6px;"><span class="t-meta-strong" style="font-size: 10px;">#${p.id}</span><span style="width:8px; height:8px; border-radius:50%; background: ${mc};"></span></div>
        <div class="t-num" style="font-size: 14px;">${p.ec.toFixed(1)} <span class="muted" style="font-size: 10px;">EC</span></div>
        <div class="t-meta" style="font-size: 10px; margin-top: 2px;">${p.temp.toFixed(1)}°C · ${p.moisture.toFixed(0)}%</div>
      </div>`;
  });
  heatmap += '</div>';

  return `
    <div class="card mb-md" style="padding: 24px;">
      <div class="card-head">
        <div>
          <div class="t-h2">Tafel ${tableId}</div>
          <div class="t-meta">8 meetpunten · gemiddelde EC ${ecAvg.toFixed(2)} · ${tempAvg.toFixed(1)}°C · vocht ${moistAvg.toFixed(0)}%</div>
        </div>
        <div class="row gap-md">
          <div class="row-tight"><span class="t-meta-strong">EC</span><span class="t-num" style="font-size: 16px;">${ecAvg.toFixed(2)}</span></div>
          <div class="row-tight"><span class="t-meta-strong">°C</span><span class="t-num" style="font-size: 16px;">${tempAvg.toFixed(1)}</span></div>
          <div class="row-tight"><span class="t-meta-strong">Vocht</span><span class="t-num" style="font-size: 16px;">${moistAvg.toFixed(0)}%</span></div>
        </div>
      </div>
      <div class="grid-2" style="gap: 20px; align-items: start;">
        <div>
          <div class="t-meta-strong mb-md">Per meetpunt</div>
          ${heatmap}
        </div>
        <div>
          <div class="t-meta-strong mb-md">Verloop laatste tijd</div>
          <div style="height: 220px; position: relative;"><canvas id="sub-ec-${tableId}"></canvas></div>
          <div class="row gap-md mt-md" style="justify-content: center; font-size: 11px; color: var(--slate);">
            <span class="row-tight"><span style="width:10px; height:2px; background: var(--plant-500);"></span>EC trend</span>
          </div>
        </div>
      </div>
    </div>
  `;
}

function initSensorCharts(tableId) {
  const tafel = state.substrate ? state.substrate[tableId] : null;
  if (!tafel) return;
  const canvas = document.getElementById(`sub-ec-${tableId}`);
  if (!canvas || !window.Chart) return;
  const labels = tafel.history[0].ec.map((_, i) => i);
  const datasets = tafel.history.map((h, i) => ({
    label: `#${i+1}`,
    data: h.ec,
    borderColor: `hsl(${100 + i * 30}, 50%, 45%)`,
    backgroundColor: 'transparent',
    tension: 0.35,
    borderWidth: 1.5,
    pointRadius: 0,
  }));
  const c = new Chart(canvas, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { display: false },
        y: { ticks: { font: { family: 'JetBrains Mono', size: 10 }, color: '#9a9482' }, grid: { color: '#ebe6d6' } },
      },
    },
  });
  allCharts.push(c);
}

function refreshSensorsLive() {
  /* Re-render the whole sensors page to update numbers; charts are recreated */
  if (getRoute() === 'sensors') renderSensors();
}

/* ====================================================================
   14. PAGE: BEURTEN LIVE (charts)
==================================================================== */
function renderCharts() {
  const recent = state.batchEvents.slice(0, 60);
  const oot = recent.filter(e => Math.abs(e.deviationPct) > 5).length;

  $app().innerHTML = `
    <div class="live-strip-mini"></div>

    <div class="grid-3 mb-md">
      <div class="stat-block">
        <div class="stat-block-label">Beurten zichtbaar</div>
        <div class="stat-block-value">${recent.length}</div>
      </div>

        <div class="stat-block-trend">— afwijking > 5%</div>
      </div>
      <div class="stat-block">
        <div class="stat-block-label">Gem. afwijking</div>
        <div class="stat-block-value">${recent.length ? mean(recent.map(e => Math.abs(e.deviationPct))).toFixed(1) : '0'}<span class="stat-block-unit">%</span></div>
      </div>
    </div>

    <div class="grid-2 mb-md" style="align-items: start;">
      <div class="card">
        <div class="card-head"><div class="t-h3">Afwijking per beurt</div><div class="t-meta">target vs gemeten (%)</div></div>
        <div style="height: 240px; position: relative;"><canvas id="ch-dev"></canvas></div>
      </div>
      <div class="card">
        <div class="card-head"><div class="t-h3">Volumes per tank</div><div class="t-meta">target ml</div></div>
        <div style="height: 240px; position: relative;"><canvas id="ch-vol"></canvas></div>
      </div>
    </div>

    <div class="card" style="padding: 0;">
      <div class="card-head" style="padding: 24px 24px 12px;"><div class="t-h3">Laatste 30 beurten</div></div>
      <table class="t">
        <thead><tr><th>Tijd</th><th>Tank</th><th>Zone</th><th>Target</th><th>Gemeten</th><th>Afwijking</th></tr></thead>
        <tbody>
          ${recent.slice(0, 30).map(e => {
            const t = state.tanks.find(tt => tt.id === e.tank);
            const dv = devClass(e.deviationPct);
            const devColor = dv === 'ok' ? 'var(--plant-600)' : dv === 'near' ? '#84cc16' : dv === 'warn' ? 'var(--amber-700)' : 'var(--rust-600)';
            return `<tr>
              <td class="cell-mono muted">${fmtTime(e.ts)}</td>
              <td><span class="tank-chip t${e.tank}"><span class="tank-chip-dot"></span>${t ? t.smaak : 'T'+e.tank}</span></td>
              <td><strong>${e.zone}</strong></td>
              <td class="cell-mono">${e.targetMl}</td>
              <td class="cell-mono">${e.measuredMl.toFixed(0)}</td>
              <td class="cell-mono" style="color: ${devColor}; font-weight: 700;">${e.deviationPct > 0 ? '+' : ''}${e.deviationPct.toFixed(1)}%</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
  setTimeout(() => initBatchCharts(recent), 50);
}

function initBatchCharts(recent) {
  if (!window.Chart) return;
  const devCanvas = document.getElementById('ch-dev');
  if (devCanvas) {
    const ordered = recent.slice().reverse();
    const c1 = new Chart(devCanvas, {
      type: 'bar',
      data: {
        labels: ordered.map((_, i) => i + 1),
        datasets: [{
          label: 'Afwijking',
          data: ordered.map(e => e.deviationPct),
          backgroundColor: ordered.map(e => {
            const a = Math.abs(e.deviationPct);
            if (a <= 2) return 'rgba(94, 156, 58, 0.7)';
            if (a <= 5) return 'rgba(132, 204, 22, 0.7)';
            if (a <= 10) return 'rgba(217, 119, 6, 0.7)';
            return 'rgba(194, 65, 12, 0.7)';
          }),
          borderColor: 'transparent',
          borderRadius: 3,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { display: false },
          y: { ticks: { font: { family: 'JetBrains Mono', size: 10 }, color: '#9a9482', callback: v => v + '%' }, grid: { color: '#ebe6d6' } },
        },
      },
    });
    allCharts.push(c1);
  }
  const volCanvas = document.getElementById('ch-vol');
  if (volCanvas) {
    const byTank = [1,2,3,4].map(t => recent.filter(e => e.tank === t).reverse());
    const c2 = new Chart(volCanvas, {
      type: 'line',
      data: {
        labels: Array.from({length: 30}, (_, i) => i + 1),
        datasets: byTank.map((arr, i) => ({
          label: state.tanks[i].smaak,
          data: arr.slice(0, 30).map(e => e.targetMl),
          borderColor: TANK_COLORS[i],
          backgroundColor: TANK_COLORS[i] + '20',
          tension: 0.35,
          borderWidth: 2,
          pointRadius: 0,
          fill: false,
        })),
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { font: { family: 'Inter', size: 11 }, boxWidth: 12 } } },
        scales: {
          x: { display: false },
          y: { ticks: { font: { family: 'JetBrains Mono', size: 10 }, color: '#9a9482' }, grid: { color: '#ebe6d6' } },
        },
      },
    });
    allCharts.push(c2);
  }
}

function refreshChartsLive() {
  /* Don't fully re-render — just update existing chart data lightly */
  if (getRoute() === 'charts') {
    const recent = state.batchEvents.slice(0, 60).reverse();
    if (allCharts[0]) {
      allCharts[0].data.labels = recent.map((_, i) => i + 1);
      allCharts[0].data.datasets[0].data = recent.map(e => e.deviationPct);
      allCharts[0].data.datasets[0].backgroundColor = recent.map(e => {
        const a = Math.abs(e.deviationPct);
        if (a <= 2) return 'rgba(94, 156, 58, 0.7)';
        if (a <= 5) return 'rgba(132, 204, 22, 0.7)';
        if (a <= 10) return 'rgba(217, 119, 6, 0.7)';
        return 'rgba(194, 65, 12, 0.7)';
      });
      allCharts[0].update('none');
    }
  }
}

/* ====================================================================
   15. PAGE: KALIBRATIE
   Per pomp:
     · warm-up tijd, compressie tijd, after-blow tijd
     · curve via guided 5-level (10/20/30/40/50 mL/plant) OF free wizard
==================================================================== */
var calState = { selectedPump: 1, guided: null };

function renderCalibration() {
  const profile = activeProfileForPump(calState.selectedPump);
  if (!profile) { $app().innerHTML = `<div class="empty">Geen kalibratie-profiel.</div>`; return; }

  $app().innerHTML = `
    <div class="cal-layout">
      <!-- Linker kolom: pomp-keuze + status -->
      <div>
        <div class="t-meta-strong mb-md" style="padding: 0 4px;">Kies pomp</div>
        <div class="cal-pumps">
          ${state.tanks.map(t => {
            const p = activeProfileForPump(t.id);
            const r2 = profileR2(p);
            const age = profileAgeDays(p);
            const pointsCount = p ? (p.points || []).length : 0;
            const status = pointsCount < 4 ? 'warn' : age > 30 ? 'warn' : 'ok';
            return `
              <button class="cal-pump-item ${calState.selectedPump === t.id ? 'selected' : ''}" data-pick-pump="${t.id}">
                <div class="cal-pump-color" style="background: ${t.color};"></div>
                <div style="flex: 1;">
                  <div class="cal-pump-name">${t.name}</div>
                  <div class="cal-pump-meta">${pointsCount} punten · ${r2 != null ? 'R²=' + r2.toFixed(3) : 'sparse'}</div>
                </div>
                <span class="status-dot ${status}"></span>
              </button>
            `;
          }).join('')}
        </div>

        <div class="card-soft mt-lg" style="padding: 18px;">
          <div class="t-meta-strong mb-md">Snelle acties</div>
          <button class="btn btn-sm btn-primary" id="start-guided" style="width: 100%; margin-bottom: 6px;">
            ${svgEl('<polygon points="5 3 19 12 5 21 5 3"/>', 14)}
            Start geleide kalibratie
          </button>
          <button class="btn btn-sm" id="start-free" style="width: 100%;">Vrije meting toevoegen…</button>
        </div>
      </div>

      <!-- Rechter kolom: profiel-details -->
      <div>
        ${calState.guided ? renderGuidedCalibration(profile) : renderProfileDetail(profile)}
      </div>
    </div>
  `;

  document.querySelectorAll('[data-pick-pump]').forEach(b => b.addEventListener('click', () => {
    calState.selectedPump = parseInt(b.getAttribute('data-pick-pump'));
    calState.guided = null;
    renderCalibration();
  }));
  document.getElementById('start-guided').addEventListener('click', () => {
    /* Check op bewaard sessie. Als er een onafgemaakte sessie is, vraag of
       operator daar verder mee wil of een nieuwe start. */
    const saved = profile.guidedSession;
    const hasSaved = saved && Array.isArray(saved.measurements)
                     && saved.measurements.some(arr => Array.isArray(arr) && arr.length > 0);
    if (hasSaved) {
      const ago = saved.ts ? Math.round((Date.now() - saved.ts) / 60000) : null;
      const ageTxt = ago == null ? '' : (ago < 1 ? ' (zojuist)' : ago < 60 ? ` (${ago} min geleden)` : ` (${Math.round(ago/60)} uur geleden)`);
      const totalMeas = saved.measurements.reduce((s, arr) => s + (arr?.length || 0), 0);
      const resume = confirm(
        `Er is een opgeslagen kalibratie-sessie${ageTxt}.\n\n` +
        `Niveau ${(saved.level ?? 0) + 1} van 5, ${totalMeas} metingen totaal.\n\n` +
        `OK = verder gaan met deze sessie.\n` +
        `Annuleren = nieuwe sessie starten (oude metingen blijven in de curve staan).`
      );
      if (resume) {
        calState.guided = {
          level:              saved.level || 0,
          measurements:       saved.measurements,
          testPlants:         saved.testPlants || 25,
          _manualOpenSec:     saved._manualOpenSec,
          convergedOpenSec:   saved.convergedOpenSec,
          currentRun:         null,
        };
        renderCalibration();
        return;
      }
      /* Anders: maak schoon en start vers. */
      profile.guidedSession = null;
      saveState();
    }
    /* Nieuwe sessie. Bij een al-gekalibreerde pomp gebruiken we de bestaande
       curve als initial guess voor niveau 1 (10 mL/plant × testPlants).
       Dat scheelt de operator een paar blinde pulsen. */
    const fresh = { level: 0, measurements: [[], [], [], [], []], testPlants: 25, currentRun: null };
    const target0 = 10 * fresh.testPlants;
    const inv0 = timeForVolume(profile, target0);
    if (inv0 && inv0.sec > 0 && (inv0.region === 'reliable' || inv0.region === 'extrapolated')) {
      fresh._manualOpenSec = +inv0.sec.toFixed(2);
    }
    calState.guided = fresh;
    renderCalibration();
  });
  document.getElementById('start-free').addEventListener('click', () => openFreeWizard(profile));

  /* CRITICAL: bind the page-body controls (timings save, guided buttons) every render */
  if (calState.guided) bindGuidedCalibration(profile);
  else bindProfileDetail(profile);
}

function bindProfileDetail(profile) {
  /* Bereik toevoegen */
  const addBtn = document.getElementById('add-range');
  if (addBtn) addBtn.addEventListener('click', () => {
    if (!Array.isArray(profile.timingProfiles)) profile.timingProfiles = [];
    /* Bepaal volgend bereik: pak hoogste maxMl en zet daarboven +20 */
    const maxSoFar = profile.timingProfiles.reduce((m, tp) => Math.max(m, tp.maxMl ?? 0), 0);
    profile.timingProfiles.push({
      id:    'range_' + Date.now().toString(36),
      label: `Bereik ${profile.timingProfiles.length + 1}`,
      minMl: maxSoFar + 1,
      maxMl: maxSoFar + 20,
      pumpWarmupSec:      profile.pumpWarmupSec      ?? 0.5,
      compressionSec:     profile.compressionSec     ?? 2.0,
      afterBlowSec:       profile.afterBlowSec       ?? 1.0,
      routerOpenDelaySec: profile.routerOpenDelaySec ?? 0.0,
      zoneBlowSec:        profile.zoneBlowSec        ?? 0.0,
    });
    saveState();
    renderCalibration();
  });

  /* Bereik verwijderen */
  document.querySelectorAll('[data-tp-del]').forEach(b => b.addEventListener('click', () => {
    const i = parseInt(b.getAttribute('data-tp-del'));
    if (!confirm('Bereik verwijderen?')) return;
    profile.timingProfiles.splice(i, 1);
    saveState();
    renderCalibration();
  }));

  /* Tijden opslaan — leest alle rijen uit de tabel */
  const saveBtn = document.getElementById('save-timings');
  if (saveBtn) saveBtn.addEventListener('click', () => {
    const rows = document.querySelectorAll('#cal-timings-body tr[data-tp-idx]');
    const next = [];
    rows.forEach(row => {
      const i = parseInt(row.getAttribute('data-tp-idx'));
      const orig = profile.timingProfiles[i] || {};
      const readNum = (name, fallback) => {
        const el = row.querySelector(`[data-tp-field="${name}"]`);
        const v = el ? parseFloat(el.value) : NaN;
        return Number.isFinite(v) ? v : fallback;
      };
      const readStr = (name) => {
        const el = row.querySelector(`[data-tp-field="${name}"]`);
        return el ? el.value : '';
      };
      next.push({
        id:    orig.id || ('range_' + Date.now().toString(36) + '_' + i),
        label: readStr('label') || `Bereik ${i+1}`,
        minMl: readNum('minMl', 0),
        maxMl: readNum('maxMl', 999),
        pumpWarmupSec:      readNum('pumpWarmupSec',      0.5),
        compressionSec:     readNum('compressionSec',     2.0),
        afterBlowSec:       readNum('afterBlowSec',       1.0),
        routerOpenDelaySec: readNum('routerOpenDelaySec', 0.0),
        zoneBlowSec:        readNum('zoneBlowSec',        0.0),
      });
    });
    /* Sorteer op minMl zodat matching voorspelbaar is */
    next.sort((a, b) => a.minMl - b.minMl);
    profile.timingProfiles = next;
    /* Houd ook de globale fallback up-to-date op basis van het 'normale' bereik */
    const normal = next.find(tp => tp.minMl <= 30 && tp.maxMl >= 30) || next[0];
    if (normal) {
      profile.pumpWarmupSec      = normal.pumpWarmupSec;
      profile.compressionSec     = normal.compressionSec;
      profile.afterBlowSec       = normal.afterBlowSec;
      profile.routerOpenDelaySec = normal.routerOpenDelaySec;
      profile.zoneBlowSec        = normal.zoneBlowSec;
    }
    profile.timestamp = new Date().toISOString();
    saveState();
    toast('Tijden opgeslagen', 'success');
    renderCalibration();
  });

  /* Bestaande: meetpunt verwijderen */
  document.querySelectorAll('[data-del-point]').forEach(b => b.addEventListener('click', () => {
    const i = parseInt(b.getAttribute('data-del-point'));
    if (!confirm('Meetpunt verwijderen?')) return;
    const pts = profilePoints(profile);
    const targetX = pts[i].x;
    profile.points = profile.points.filter(p => +p.openTime !== targetX);
    profile.timestamp = new Date().toISOString();
    saveState();
    renderCalibration();
  }));
  /* Kalibratie kopiëren naar andere pompen — handig voor demo of als één pomp
     is gekalibreerd en je tijdelijk hetzelfde wil op de andere bakken. */
  const copyBtn = document.getElementById('cal-copy-btn');
  if (copyBtn) copyBtn.addEventListener('click', () => openCopyCalibrationModal(profile));
  /* Importeer kalibratie VAN andere pomp NAAR deze — andersom als de kopieer-knop.
     Handig als je een nieuwe pomp gaat kalibreren en de curve van Tank 1 als
     startpunt wil gebruiken. Daarna kun je gewoon verder verfijnen. */
  const importBtn = document.getElementById('cal-import-btn');
  if (importBtn) importBtn.addEventListener('click', () => openImportCalibrationModal(profile));
  /* Resume gepauzeerde guided sessie */
  const resumeBtn = document.getElementById('resume-guided');
  if (resumeBtn) resumeBtn.addEventListener('click', () => {
    const saved = profile.guidedSession;
    if (!saved) return;
    calState.guided = {
      level:              saved.level || 0,
      measurements:       saved.measurements,
      testPlants:         saved.testPlants || 25,
      _manualOpenSec:     saved._manualOpenSec,
      convergedOpenSec:   saved.convergedOpenSec,
      currentRun:         null,
    };
    renderCalibration();
  });
  /* Chart */
  setTimeout(() => initCalChart(profile), 50);
}

/* openCopyCalibrationModal — toont een eenvoudige modal met checkboxes per
   doel-pomp. Bij bevestigen kopieert deze functie: meetpunten (curve),
   timing-bereiken, dode zone en scalar fallback-tijden. Doel-profielen worden
   in-place vervangen; bestaande points worden overschreven. */
function openCopyCalibrationModal(srcProfile) {
  const targets = state.calibrationProfiles.filter(p => p.pump !== srcProfile.pump);
  if (!targets.length) {
    toast('Geen andere pompen om naar te kopiëren', 'warn');
    return;
  }
  const srcTank = state.tanks.find(t => t.id === srcProfile.pump);
  /* Modal markup */
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:99990; display:flex; align-items:center; justify-content:center; padding:20px;';
  overlay.innerHTML = `
    <div class="card-lg" style="max-width: 520px; width: 100%; padding: 28px; background: white;">
      <div class="t-h2" style="margin-bottom: 4px;">Kalibratie kopiëren</div>
      <div class="t-meta mb-md">
        Neem de kalibratie van <strong>${srcTank.name}</strong> over op andere pompen.
        Handig als deze pomp goed gekalibreerd is en je tijdelijk hetzelfde wil aanhouden op de rest.
      </div>
      <div class="card-soft" style="padding: 14px; background: var(--cream); margin-bottom: 16px;">
        <div class="t-meta-strong" style="margin-bottom: 8px;">Wat wordt gekopieerd:</div>
        <div class="t-meta" style="line-height: 1.7;">
          • Meetpunten van de grafiek (${(srcProfile.points || []).length} punten)<br>
          • Cyclus-tijden per beurtgrootte (${(srcProfile.timingProfiles || []).length} bereiken)<br>
          • Dode zone + fallback-tijden
        </div>
      </div>
      <div class="t-meta-strong mb-sm">Doelpompen:</div>
      <div class="stack" style="gap: 8px; margin-bottom: 18px;">
        ${targets.map(t => {
          const tk = state.tanks.find(tn => tn.id === t.pump);
          const pts = (t.points || []).length;
          return `
            <label class="row gap-md" style="align-items:center; padding: 10px; border: 1px solid var(--mist); border-radius: 8px; cursor:pointer;">
              <input type="checkbox" class="cal-copy-target" value="${t.id}" style="width:18px; height:18px;" />
              <div style="flex:1;">
                <div class="t-meta-strong">${tk.name} — ${tk.smaak}</div>
                <div class="t-meta">Heeft nu ${pts} meetpunten${pts > 0 ? ' (worden overschreven)' : ''}</div>
              </div>
            </label>
          `;
        }).join('')}
      </div>
      <div class="row gap-md" style="justify-content: flex-end;">
        <button class="btn btn-soft" id="cal-copy-cancel">Annuleren</button>
        <button class="btn btn-primary" id="cal-copy-confirm">Kopieer</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  overlay.querySelector('#cal-copy-cancel').addEventListener('click', close);
  overlay.querySelector('#cal-copy-confirm').addEventListener('click', () => {
    const picks = Array.from(overlay.querySelectorAll('.cal-copy-target:checked')).map(c => c.value);
    if (!picks.length) { toast('Kies eerst doelpompen', 'warn'); return; }
    /* Diepe kopie van de bron-velden om referentie-koppeling te voorkomen */
    const srcPoints  = JSON.parse(JSON.stringify(srcProfile.points || []));
    const srcTimings = JSON.parse(JSON.stringify(srcProfile.timingProfiles || []));
    const now = new Date().toISOString();
    let n = 0;
    picks.forEach(targetId => {
      const target = state.calibrationProfiles.find(p => p.id === targetId);
      if (!target) return;
      target.points              = srcPoints;
      target.timingProfiles      = srcTimings;
      target.deadZone            = srcProfile.deadZone;
      target.pumpWarmupSec       = srcProfile.pumpWarmupSec;
      target.compressionSec      = srcProfile.compressionSec;
      target.afterBlowSec        = srcProfile.afterBlowSec;
      target.routerOpenDelaySec  = srcProfile.routerOpenDelaySec;
      target.zoneBlowSec         = srcProfile.zoneBlowSec;
      target.fitMethod           = srcProfile.fitMethod;
      target.timestamp           = now;
      target.notes               = (target.notes ? target.notes + ' · ' : '') + `gekopieerd van ${srcTank.name}`;
      n++;
    });
    saveState();
    close();
    toast(`Kalibratie gekopieerd naar ${n} pomp${n > 1 ? 'en' : ''}`, 'success');
    renderCalibration();
  });
}

/* openImportCalibrationModal — andersom: kies een BRON-pomp om kalibratie van
   over te nemen op het huidige profiel. Handig als startpunt voor een nieuwe
   pomp; je kunt daarna gewoon verder kalibreren om de curve te verfijnen. */
function openImportCalibrationModal(dstProfile) {
  const sources = state.calibrationProfiles.filter(p =>
    p.pump !== dstProfile.pump && (p.points || []).length > 0
  );
  if (!sources.length) {
    toast('Geen andere pomp met kalibratie-data om van te importeren', 'warn');
    return;
  }
  const dstTank = state.tanks.find(t => t.id === dstProfile.pump);
  const dstHasPoints = (dstProfile.points || []).length > 0;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:99990; display:flex; align-items:center; justify-content:center; padding:20px;';
  overlay.innerHTML = `
    <div class="card-lg" style="max-width: 520px; width: 100%; padding: 28px; background: white;">
      <div class="t-h2" style="margin-bottom: 4px;">Kalibratie importeren</div>
      <div class="t-meta mb-md">
        Neem de curve van een andere pomp over als <strong>startpunt</strong> voor ${dstTank.name}.
        Daarna kun je gewoon verder kalibreren — elke nieuwe meting verbetert de curve.
      </div>
      ${dstHasPoints ? `
      <div class="card-soft mb-md" style="background: var(--amber-50); border-color: var(--amber-200); padding: 12px 14px;">
        <div class="t-meta" style="color: var(--amber-700);">
          <strong>Let op:</strong> ${dstTank.name} heeft al ${dstProfile.points.length} meetpunten.
          Deze worden overschreven door de import.
        </div>
      </div>
      ` : ''}
      <div class="t-meta-strong mb-sm">Bronpomp:</div>
      <div class="stack" style="gap: 8px; margin-bottom: 18px;">
        ${sources.map(p => {
          const tk = state.tanks.find(tn => tn.id === p.pump);
          const pts = (p.points || []).length;
          const r2 = profileR2(p);
          return `
            <label class="row gap-md" style="align-items:center; padding: 10px; border: 1px solid var(--mist); border-radius: 8px; cursor:pointer;">
              <input type="radio" name="cal-import-src" value="${p.id}" style="width:18px; height:18px;" />
              <div style="flex:1;">
                <div class="t-meta-strong">${tk.name} — ${tk.smaak}</div>
                <div class="t-meta">${pts} meetpunten${r2 != null ? ' · R²=' + r2.toFixed(3) : ''}</div>
              </div>
            </label>
          `;
        }).join('')}
      </div>
      <div class="card-soft" style="padding: 14px; background: var(--cream); margin-bottom: 16px;">
        <div class="t-meta-strong" style="margin-bottom: 6px;">Wat wordt geïmporteerd:</div>
        <div class="t-meta" style="line-height: 1.7;">
          • Alle meetpunten van de bron-curve<br>
          • Cyclus-tijden per beurtgrootte<br>
          • Dode zone + fallback-tijden
        </div>
      </div>
      <div class="row gap-md" style="justify-content: flex-end;">
        <button class="btn btn-soft" id="cal-import-cancel">Annuleren</button>
        <button class="btn btn-primary" id="cal-import-confirm">Importeer</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  overlay.querySelector('#cal-import-cancel').addEventListener('click', close);
  overlay.querySelector('#cal-import-confirm').addEventListener('click', () => {
    const radio = overlay.querySelector('input[name="cal-import-src"]:checked');
    if (!radio) { toast('Kies eerst een bronpomp', 'warn'); return; }
    const src = state.calibrationProfiles.find(p => p.id === radio.value);
    if (!src) { toast('Bronpomp niet gevonden', 'error'); return; }
    const srcTank = state.tanks.find(t => t.id === src.pump);
    /* Diepe kopie van bron-velden naar bestemming */
    dstProfile.points              = JSON.parse(JSON.stringify(src.points || []));
    dstProfile.timingProfiles      = JSON.parse(JSON.stringify(src.timingProfiles || []));
    dstProfile.deadZone            = src.deadZone;
    dstProfile.pumpWarmupSec       = src.pumpWarmupSec;
    dstProfile.compressionSec      = src.compressionSec;
    dstProfile.afterBlowSec        = src.afterBlowSec;
    dstProfile.routerOpenDelaySec  = src.routerOpenDelaySec;
    dstProfile.zoneBlowSec         = src.zoneBlowSec;
    dstProfile.fitMethod           = src.fitMethod;
    dstProfile.timestamp           = new Date().toISOString();
    dstProfile.notes               = (dstProfile.notes ? dstProfile.notes + ' · ' : '') + `geïmporteerd van ${srcTank.name}`;
    saveState();
    close();
    toast(`Kalibratie geïmporteerd van ${srcTank.name} — je kunt nu verder verfijnen`, 'success');
    renderCalibration();
  });
}

function initCalChart(profile) {
  const canvas = document.getElementById('cal-chart');
  if (!canvas || !window.Chart) return;
  const pts = profilePoints(profile);
  if (pts.length === 0) return;
  const xMax = Math.max(...pts.map(p => p.x)) * 1.1;
  const fitX = [], fitY = [];
  for (let x = 0; x <= xMax; x += xMax / 60) { fitX.push(x); fitY.push(volumeForTime(profile, x).ml); }
  const tank = state.tanks.find(t => t.id === profile.pump);

  const c = new Chart(canvas, {
    data: {
      datasets: [
        {
          type: 'line',
          label: 'Curve',
          data: fitX.map((x, i) => ({ x, y: fitY[i] })),
          borderColor: tank.color,
          backgroundColor: tank.color + '20',
          tension: 0.35,
          borderWidth: 2.5,
          pointRadius: 0,
          fill: true,
        },
        {
          type: 'scatter',
          label: 'Meetpunten',
          data: pts.map(p => ({ x: p.x, y: p.y })),
          backgroundColor: tank.color,
          borderColor: '#fff',
          borderWidth: 2,
          pointRadius: 6,
          pointHoverRadius: 9,
        },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: {
          type: 'linear',
          title: { display: true, text: 'Open-tijd (s)', font: { family: 'Inter', size: 11 }, color: '#9a9482' },
          ticks: { font: { family: 'JetBrains Mono', size: 10 }, color: '#9a9482' },
          grid: { color: '#ebe6d6' },
        },
        y: {
          title: { display: true, text: 'Volume (mL)', font: { family: 'Inter', size: 11 }, color: '#9a9482' },
          ticks: { font: { family: 'JetBrains Mono', size: 10 }, color: '#9a9482' },
          grid: { color: '#ebe6d6' },
        },
      },
    },
  });
  allCharts.push(c);
}

  const measMl   = measurements.map(m => (typeof m === 'object' ? m.mL : m));
