function bindGuidedCalibration(profile) {
  const g = calState.guided;
  const LEVELS = [10, 20, 30, 40, 50];

  /* Bewaar de huidige guided-sessie ÍN het profile zelf, zodat hij persist
     wordt via saveState en de volgende keer dat operator de pagina opent terug
     komt. Heel handig als kalibratie over meerdere dagen of werkplekken gaat. */
  function persistGuided() {
    if (!calState.guided) { profile.guidedSession = null; }
    else {
      profile.guidedSession = {
        level:              calState.guided.level,
        measurements:       calState.guided.measurements,
        testPlants:         calState.guided.testPlants,
        _manualOpenSec:     calState.guided._manualOpenSec,
        convergedOpenSec:   calState.guided.convergedOpenSec,
        ts:                 Date.now(),
      };
    }
    /* CRUCIAAL: saveState aanroepen, anders blijft de sessie alleen in
       browser-geheugen en is hij weg bij refresh of nieuwe sessie. */
    saveState();
  }
  const totalMl = LEVELS[g.level] * g.testPlants;
  const exitBtn = document.getElementById('exit-guided');
  if (exitBtn) exitBtn.addEventListener('click', () => {
    if (g.measurements.flat().length > 0) {
      if (!confirm('Geleide kalibratie afsluiten? Niet-bevestigde metingen gaan verloren.')) return;
    }
    calState.guided = null; renderCalibration();
  });
  document.querySelectorAll('[data-plants-delta]').forEach(b => b.addEventListener('click', () => {
    const d = parseInt(b.getAttribute('data-plants-delta'));
    g.testPlants = clamp(g.testPlants + d, 1, 100);
    renderCalibration();
  }));
  /* Input-listener: zodra operator het veld wijzigt, update g._manualOpenSec direct.
     Dit zorgt dat de state altijd in sync is met de input, en dat de Stuur-knop niet
     afhankelijk is van DOM-state (die in Safari soms blijft plakken). */
  const manEl = document.getElementById('guided-manual-sec');
  if (manEl) {
    manEl.addEventListener('input', () => {
      const v = parseFloat(manEl.value);
      if (Number.isFinite(v) && v > 0) g._manualOpenSec = v;
    });
    /* Forceer initiele waarde via JS (Safari respecteert soms value-attribuut niet bij re-render).
       Fallback-volgorde: opgeslagen _manualOpenSec → curve-schatting → 1.0
       Zo krijgt de operator bij een al-gekalibreerde pomp meteen een goede startwaarde
       i.p.v. blind 1.0 — bespaart pulsen en tijd. */
    let curveGuess = null;
    const target = LEVELS[g.level] * (g.testPlants || 25);
    const inv = timeForVolume(profile, target);
    if (inv && inv.sec > 0 && (inv.region === 'reliable' || inv.region === 'extrapolated')) {
      curveGuess = +inv.sec.toFixed(2);
    }
    manEl.value = (g._manualOpenSec || curveGuess || 1.0).toFixed(2);
    /* Als curve een schatting heeft maar _manualOpenSec nog leeg: schrijf 'm
       meteen ook naar de state zodat de Stuur-knop direct werkt. */
    if (!g._manualOpenSec && curveGuess) {
      g._manualOpenSec = curveGuess;
    }
  }

  const runBtn = document.getElementById('guided-run');
  if (runBtn) runBtn.addEventListener('click', () => {
    /* Single source of truth: g._manualOpenSec. Operator wijzigt via input,
       suggestie wijzigt via record-handler. Geen DOM-read meer. */
    const openSec = g._manualOpenSec;
    if (!Number.isFinite(openSec) || openSec <= 0) {
      toast('Vul een geldige open-tijd in (sec)', 'error');
      return;
    }
    g.currentRun = { openSec, ts: Date.now(), forced: true };
    if (state.systemMode !== 'dryrun') {
      toast(`Pakket verzonden (${openSec.toFixed(2)}s open) — meet het opgevangen water`, 'success');
    } else {
      toast(`Test-modus: pakket gesimuleerd (${openSec.toFixed(2)}s)`, 'success');
    }
    renderCalibration();
  });
  const recBtn = document.getElementById('guided-record');
  if (recBtn) recBtn.addEventListener('click', () => {
    const v = parseFloat(document.getElementById('guided-measure').value);
    if (!v || v < 0) { toast('Vul een geldig volume in', 'error'); return; }
    if (!g.currentRun) { toast('Geen actieve puls', 'error'); return; }
    const usedOpenSec = g.currentRun.openSec;
    /* Sla meting op met de open-tijd waarbij hij hoorde (kerngegeven voor curve-bouw + suggestie). */
    g.measurements[g.level].push({
      mL:      Math.round(v),
      openSec: usedOpenSec,
      ts:      Date.now(),
    });

    /* === AUTO-SUGGESTIE: gebruikt nu ALLE metingen op dit niveau ===
       Regressie door oorsprong: slope = Σ(x·y) / Σ(x²)
       Waarom door oorsprong: bij open_sec = 0 verwachten we 0 mL water — die
       aanname maakt het robuust ook bij maar 2-3 metingen, en het beste model
       voor een pomp-curve in dit bereik.

       Belangrijk: de suggestie wordt ALTIJD opnieuw berekend, ook als de
       laatste meting binnen 5% van target was. Convergentie is alleen een
       INFO-status — operator beslist zelf wanneer hij door gaat naar het
       volgende niveau. Geen automatische stop. */
    const target = LEVELS[g.level] * g.testPlants;
    const allMeas = g.measurements[g.level].filter(m =>
      typeof m === 'object' && m.openSec > 0 && m.mL >= 0
    );

    /* Regressie door oorsprong op ALLE metingen */
    let newOpenSec, slope = 0, r2 = null;
    if (allMeas.length >= 2) {
      let sumXY = 0, sumXX = 0;
      for (const m of allMeas) {
        sumXY += m.openSec * m.mL;
        sumXX += m.openSec * m.openSec;
      }
      slope = sumXX > 0 ? sumXY / sumXX : 0;
    }
    if (slope > 0) {
      newOpenSec = clamp(target / slope, 0.01, 30);
    } else {
      /* Fallback: lineaire schaling op de laatste meting (bij 1 meting of edge case). */
      newOpenSec = clamp(usedOpenSec * (target / v), 0.01, 30);
    }
    /* Update altijd — ook als convergent. Operator kan altijd nog pulsen. */
    g._manualOpenSec = +newOpenSec.toFixed(2);

    /* === SPREIDINGS-CHECK ===
       R² geeft aan hoe goed de metingen op één lijn liggen. Bij R² < 0.9 zit
       er waarschijnlijk een uitschieter tussen. <3 metingen → te weinig data. */
    if (allMeas.length >= 3 && slope > 0) {
      let ssRes = 0, ssTot = 0;
      const yMean = mean(allMeas.map(m => m.mL));
      for (const m of allMeas) {
        const pred = slope * m.openSec;
        ssRes += (m.mL - pred) ** 2;
        ssTot += (m.mL - yMean) ** 2;
      }
      r2 = ssTot > 0 ? (1 - ssRes / ssTot) : 1.0;
      if (r2 < 0.9) {
        toast(`⚠ Metingen zijn niet consistent (R²=${r2.toFixed(2)}). Wis eventueel een uitschieter en probeer opnieuw.`, 'warn');
      }
    }

    /* === CONVERGENTIE als INFO ===
       Bij ≤5% afwijking laten we de groene "klaar"-banner zien zodat operator
       weet dat hij MAG stoppen. Maar niets blokkeert — hij kan altijd nog
       pulsen om te verfijnen. De suggestie kan iets afwijken (regressie weet
       meer dan één meting), dus die wordt ook getoond. */
    const dev    = (v - target) / target;
    const absDev = Math.abs(dev);
    const pct    = (dev * 100).toFixed(0);
    const sign   = dev > 0 ? '+' : '';

    if (absDev <= 0.05) {
      g.convergedOpenSec = usedOpenSec;
      const extra = Math.abs(newOpenSec - usedOpenSec) > 0.02
        ? ` Verfijnen kan met ${newOpenSec.toFixed(2)}s.`
        : '';
      toast(`✓ Binnen 5% bij ${usedOpenSec.toFixed(2)}s — je mag stoppen of doorgaan.${extra}`, 'success');
    } else {
      g.convergedOpenSec = null;
      const basis = (allMeas.length >= 2 && slope > 0)
        ? ` (uit ${allMeas.length} metingen, flow ≈ ${slope.toFixed(0)} mL/s)`
        : '';
      toast(`Afwijking ${sign}${pct}% — volgende puls: ${newOpenSec.toFixed(2)}s${basis}`, 'info');
    }
    g.currentRun = null;
    persistGuided();
    renderCalibration();
  });
  document.querySelectorAll('[data-del-meas]').forEach(b => b.addEventListener('click', () => {
    const i = parseInt(b.getAttribute('data-del-meas'));
    g.measurements[g.level].splice(i, 1);
    /* Reset convergentie-flag: na verwijderen moet operator opnieuw verifiëren. */
    g.convergedOpenSec = null;
    persistGuided();
    renderCalibration();
  }));
  const nextBtn = document.getElementById('guided-next');
  if (nextBtn) nextBtn.addEventListener('click', () => {
    const ms = g.measurements[g.level];
    if (ms.length === 0) return;
    /* Bundel alle metingen per unieke openSec en push elk als curve-punt. Dit
       is de échte kwaliteit van de curve — niet één punt per niveau, maar één
       per gebruikte open-tijd. */
    const byOpenSec = new Map();
    for (const m of ms) {
      const key = (+m.openSec).toFixed(2);
      if (!byOpenSec.has(key)) byOpenSec.set(key, []);
      byOpenSec.get(key).push(m.mL);
    }
    for (const [openTimeStr, samples] of byOpenSec) {
      const openTime = parseFloat(openTimeStr);
      const existing = profile.points.find(p => Math.abs(+p.openTime - openTime) < 0.05);
      if (existing) {
        existing.samples = (existing.samples || []).concat(samples);
      } else {
        profile.points.push({
          openTime,
          samples: samples.slice(),
          notes: 'guided ' + LEVELS[g.level] + ' mL/plant',
        });
      }
    }
    profile.points.sort((a,b) => +a.openTime - +b.openTime);
    profile.timestamp = new Date().toISOString();
    saveState();

    if (g.level < 4) {
      g.level++;
      g.currentRun = null;
      g.convergedOpenSec = null;
      /* Slimme initial guess: gebruik werkelijk gemeten data (niet de suggestie-waarde).
         Bereken voor elke gebruikte open-tijd het gemiddelde, daarna lineair schalen naar
         het nieuwe doel-volume. Dat is veel robuuster dan blind op _manualOpenSec schalen. */
      const nextTarget = LEVELS[g.level] * g.testPlants;
      const prevTarget = LEVELS[g.level - 1] * g.testPlants;
      const prevMeas = g.measurements[g.level - 1];
      let initialGuess = null;
      if (prevMeas && prevMeas.length > 0) {
        /* Pak het convergente punt als dat bestaat, anders het laatste gemeten punt. */
        const ref = prevMeas[prevMeas.length - 1];
        const refMl = typeof ref === 'object' ? ref.mL : ref;
        const refSec = typeof ref === 'object' ? ref.openSec : null;
        if (refSec && refMl > 0) {
          /* Schaling: gevraagd_sec = ref_sec × (refMl→target_oud) × (target_oud→target_nieuw)
             = ref_sec × (prevTarget / refMl) × (nextTarget / prevTarget)
             = ref_sec × (nextTarget / refMl) */
          initialGuess = +(refSec * (nextTarget / refMl)).toFixed(2);
        }
      }
      /* Fallback: gebruik curve als die bruikbaar is, anders houd _manualOpenSec en schaal blind. */
      if (initialGuess == null) {
        const inv = timeForVolume(profile, nextTarget);
        if (inv && inv.sec > 0 && (inv.region === 'reliable' || inv.region === 'extrapolated')) {
          initialGuess = +inv.sec.toFixed(2);
        } else if (g._manualOpenSec) {
          initialGuess = +(g._manualOpenSec * (nextTarget / prevTarget)).toFixed(2);
        }
      }
      if (initialGuess != null) g._manualOpenSec = clamp(initialGuess, 0.01, 30);
      persistGuided();
      renderCalibration();
    } else {
      toast('Kalibratie voltooid! Alle 5 niveaus opgeslagen.', 'success');
      calState.guided = null;
      profile.guidedSession = null;  /* sessie afgerond → wissen */
      saveState();
      renderCalibration();
    }
  });
  const skipBtn = document.getElementById('guided-skip');
  if (skipBtn) skipBtn.addEventListener('click', () => {
    if (g.level < 4) {
      g.level++; g.currentRun = null; g.convergedOpenSec = null;
      persistGuided();
      renderCalibration();
    } else {
      calState.guided = null;
      profile.guidedSession = null;
      saveState();
      renderCalibration();
    }
  });
  /* Terug naar vorig niveau — laat metingen staan, operator kan ze bekijken/wijzigen. */
  const prevBtn = document.getElementById('guided-prev');
  if (prevBtn) prevBtn.addEventListener('click', () => {
    if (g.level > 0) {
      g.level--;
      g.currentRun = null;
      g.convergedOpenSec = null;
      /* Herstel een zinnige open-tijd voor dit niveau: gebruik de laatste meting van
         dit niveau als die er is, anders houd huidige _manualOpenSec. */
      const prev = g.measurements[g.level];
      if (prev && prev.length > 0) {
        const last = prev[prev.length - 1];
        if (typeof last === 'object' && last.openSec) g._manualOpenSec = +last.openSec.toFixed(2);
      }
      persistGuided();
      renderCalibration();
    }
  });
  /* Wis alle metingen op het huidige niveau — handig als operator opnieuw wil beginnen. */
  const clearBtn = document.getElementById('guided-clear');
  if (clearBtn) clearBtn.addEventListener('click', () => {
    if (!confirm(`Alle ${g.measurements[g.level].length} metingen op niveau ${LEVELS[g.level]} mL/plant wissen?`)) return;
    g.measurements[g.level] = [];
    g.currentRun = null;
    g.convergedOpenSec = null;
    persistGuided();
    renderCalibration();
  });
  /* Sessie pauzeren — sluit guided UI, sessie blijft bewaard in profile.guidedSession.
     De volgende keer dat operator de pagina opent verschijnt een "Verder gaan?" banner. */
  const pauseBtn = document.getElementById('guided-pause');
  if (pauseBtn) pauseBtn.addEventListener('click', () => {
    persistGuided();
    saveState();
    toast('Sessie opgeslagen — je kunt later verder gaan', 'success');
    calState.guided = null;
    renderCalibration();
  });
  /* Klikbare voortgang-dots: spring direct naar een ander niveau. */
  document.querySelectorAll('[data-goto-level]').forEach(el => el.addEventListener('click', () => {
    const target = parseInt(el.getAttribute('data-goto-level'));
    if (!Number.isFinite(target) || target === g.level) return;
    g.level = target;
    g.currentRun = null;
    g.convergedOpenSec = null;
    /* Herstel open-tijd o.b.v. laatste meting op dit niveau. */
    const meas = g.measurements[target];
    if (meas && meas.length > 0) {
      const last = meas[meas.length - 1];
      if (typeof last === 'object' && last.openSec) g._manualOpenSec = +last.openSec.toFixed(2);
    }
    renderCalibration();
  }));
}

function openFreeWizard(profile) {
  const tank = state.tanks.find(t => t.id === profile.pump);
  const m = openModal(`
    <h2>Vrije meting toevoegen</h2>
    <div class="modal-sub">${tank.name} · ${tank.smaak}</div>
    <div class="stack">
      <div class="field">
        <label class="field-label">Open-tijd (sec)</label>
        <input class="input mono large" type="number" min="0" step="0.1" id="fw-time" placeholder="bijv. 2.5" />
      </div>
      <div class="field">
        <label class="field-label">Gemeten volume (mL)</label>
        <input class="input mono large" type="number" min="0" step="1" id="fw-vol" placeholder="bijv. 1200" />
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="fw-cancel">Annuleren</button>
      <button class="btn btn-primary" id="fw-save">Toevoegen</button>
    </div>
  `);
  m.querySelector('#fw-cancel').addEventListener('click', () => m.remove());
  m.querySelector('#fw-save').addEventListener('click', () => {
    const t = parseFloat(m.querySelector('#fw-time').value);
    const v = parseFloat(m.querySelector('#fw-vol').value);
    if (!t || !v) { toast('Vul beide velden in', 'error'); return; }
    const existing = profile.points.find(p => Math.abs(+p.openTime - t) < 0.05);
    if (existing) existing.samples.push(v);
    else profile.points.push({ openTime: t, samples: [v], notes: 'vrije meting' });
    profile.points.sort((a,b) => +a.openTime - +b.openTime);
    profile.timestamp = new Date().toISOString();
    saveState();
    toast('Meetpunt toegevoegd', 'success');
    m.remove();
    renderCalibration();
  });
}

        <button class="btn btn-soft" id="maint-backup-restore" style="flex: 1; min-width: 200px;">
          ${svgEl('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>', 18)}

        <input type="file" id="maint-backup-file" accept=".json,application/json" style="display: none;" />
      </div>
      <div class="t-meta mt-md" style="opacity: 0.7;">
        <strong>Tip:</strong> Maak één backup per week, plus vóór elke nieuwe kalibratie. Het bestand kan je per e-mail of cloud opslaan.
      </div>
    </div>

    <div class="section-heading">Pompen</div>
    <div class="degrade-grid">
      ${[1,2,3,4].map(id => {
        const w = wear.pumps[id];
        const tank = state.tanks.find(t => t.id === id);
        const pct = (w.runSec / PUMP_LIFETIME) * 100;
        const bar = pct > 90 ? 'err' : pct > 70 ? 'warn' : '';
        return `

        <thead><tr><th>Zone</th><th>Tafel</th><th>Schakelingen</th><th>% van levensduur</th><th></th></tr></thead>
        <tbody>
          ${state.zones.filter(z => z.active).map(z => {
            const opens = (wear.valves[z.name] && wear.valves[z.name].opens) || 0;

            const bar = pct > 90 ? 'err' : pct > 70 ? 'warn' : '';
            return `<tr>

    if (!confirm(`Markeer onderhoud uitgevoerd op pomp ${id}? Draaitijd-teller wordt op nul gezet (lifetime blijft behouden).`)) return;
    state.componentWear.pumps[id].runSec = 0;
    state.componentWear.pumps[id].lastMaintenance = new Date().toISOString();
    saveState();
    toast(`Onderhoud pomp ${id} gemarkeerd`, 'success');
    renderMaintenance();
  }));
  /* Backup downloaden — gebruikt window.downloadBackup helper. */
  const dlBtn = document.getElementById('maint-backup-download');
  if (dlBtn) dlBtn.addEventListener('click', async () => {
    if (typeof window.downloadBackup !== 'function') {
      toast('Backup-functie nog niet geladen — vernieuw de pagina', 'error');
      return;
    }
    if (typeof withButtonFeedback === 'function') {
      await withButtonFeedback(dlBtn, () => window.downloadBackup(),
        { busyText: 'Backup maken…', successText: '✓ Gedownload' });
    } else {
      await window.downloadBackup();
    }
  });
  /* Restore: openen file-picker; bij file change → upload met confirmatie. */
  const restoreBtn = document.getElementById('maint-backup-restore');
  const restoreFile = document.getElementById('maint-backup-file');
  if (restoreBtn && restoreFile) {
    restoreBtn.addEventListener('click', () => restoreFile.click());
    restoreFile.addEventListener('change', async () => {
      const file = restoreFile.files[0];
      if (!file) return;
      const ok = confirm(
        `Backup terugzetten: "${file.name}"\n\n` +
        `Dit overschrijft ALLE huidige instellingen: kalibraties, zones, tafels, planning.\n\n` +
        `Eerst wordt de huidige configuratie automatisch als backup gedownload.\n\n` +
        `Doorgaan?`
      );
      if (!ok) { restoreFile.value = ''; return; }
      try {
        if (typeof window.restoreBackup === 'function') {
          await window.restoreBackup(file);

      } catch (e) {
        toast('Terugzetten faalde: ' + e.message, 'error');
      } finally {
        restoreFile.value = '';
      }
    });
  }
  document.getElementById('reset-comp')?.addEventListener('click', () => {});
  document.querySelector('[data-reset-comp]')?.addEventListener('click', () => {
    if (!confirm('Markeer onderhoud uitgevoerd op compressor?')) return;
    state.componentWear.compressor.runSec = 0;
    state.componentWear.compressor.lastMaintenance = new Date().toISOString();
    saveState();
    toast('Onderhoud compressor gemarkeerd', 'success');
    renderMaintenance();
  });
  document.querySelectorAll('[data-reset-valve]').forEach(b => b.addEventListener('click', () => {
    const z = b.getAttribute('data-reset-valve');
    if (!confirm(`Klep ${z}: schakeling-teller resetten?`)) return;
    if (state.componentWear.valves[z]) state.componentWear.valves[z].opens = 0;
    saveState();
    renderMaintenance();
  }));
  document.getElementById('reload-driver').addEventListener('click', () => {
    toast('Driver herstart aangevraagd (gesimuleerd)', 'success');
  });
  document.getElementById('factory-reset').addEventListener('click', () => {
    if (!confirm('LET OP: alle instellingen worden teruggezet naar fabriekswaarden. Doorgaan?')) return;
    if (!confirm('Echt zeker? Alle kalibratie en planning gaat verloren.')) return;
    resetState();
  });

}

function renderSettingsTab() {
  if (settingsState.tab === 'tables') return renderSettingsTables();
  if (settingsState.tab === 'zones')  return renderSettingsZones();
  if (settingsState.tab === 'tanks')  return renderSettingsTanks();
  if (settingsState.tab === 'hardware') return renderSettingsHardware();
  if (settingsState.tab === 'general') return renderSettingsGeneral();
}
function bindSettingsTab() {
  if (settingsState.tab === 'tables') bindSettingsTables();
  if (settingsState.tab === 'zones')  bindSettingsZones();
  if (settingsState.tab === 'tanks')  bindSettingsTanks();
  if (settingsState.tab === 'hardware') bindSettingsHardware();
  if (settingsState.tab === 'general') bindSettingsGeneral();
}

function renderSettingsTables() {
  return `
    <div class="t-meta mb-md">Activeer alleen de tafels die fysiek aanwezig zijn. Inactieve tafels worden overal verborgen.</div>
    <div class="grid-2">
      ${state.tables.map(t => {
        const zones = state.zones.filter(z => z.table === t.id && z.active).length;
        return `
          <div class="card" style="padding: 24px;">
            <div class="row-between mb-md">
              <div>
                <div class="t-h2">${t.name}</div>
                <div class="t-meta">${zones} actieve zones</div>
              </div>
              <button class="toggle ${t.active ? 'on' : ''}" data-tab-toggle="${t.id}"></button>
            </div>
            <div class="field">
              <label class="field-label">Naam</label>
              <input class="input" data-tab-name="${t.id}" value="${t.name}" />
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}
function bindSettingsTables() {
  document.querySelectorAll('[data-tab-toggle]').forEach(b => b.addEventListener('click', () => {
    const id = parseInt(b.getAttribute('data-tab-toggle'));
    const t = state.tables.find(tt => tt.id === id);
    t.active = !t.active;
    /* When deactivating: deactivate all zones on this tafel */
    if (!t.active) state.zones.forEach(z => { if (z.table === id) { z.active = false; z.table = null; } });
    saveState();
    renderSettings();
  }));
  document.querySelectorAll('[data-tab-name]').forEach(inp => inp.addEventListener('change', () => {
    const id = parseInt(inp.getAttribute('data-tab-name'));
    state.tables.find(t => t.id === id).name = inp.value;
    saveState();
    toast('Tafel-naam opgeslagen', 'success');
  }));
}

function renderSettingsZones() {
  return `
    <div class="t-meta mb-md">Bepaal welke van de 16 poorten in gebruik zijn, op welke tafel ze zitten, en hoeveel planten per zone staan.</div>
    <div class="card" style="padding: 0;">
      <table class="t">
        <thead>
          <tr>
            <th>Poort</th>
            <th>Actief</th>
            <th>Tafel</th>
            <th>Planten</th>
            <th>Hardware</th>
          </tr>
        </thead>
        <tbody>
          ${state.zones.map((z, i) => `
            <tr style="${z.active ? '' : 'opacity: 0.55;'}">
              <td><strong>${z.name}</strong></td>
              <td><button class="toggle ${z.active ? 'on' : ''}" data-zn-toggle="${i}"></button></td>
              <td>
                <select class="select" data-zn-table="${i}" ${!z.active ? 'disabled' : ''} style="min-height: 36px; padding: 6px 12px;">
                  <option value="">— geen tafel —</option>
                  ${state.tables.filter(t => t.active).map(t => `<option value="${t.id}" ${z.table === t.id ? 'selected' : ''}>${t.name}</option>`).join('')}
                </select>
              </td>
              <td>
                <input class="input mono" type="number" min="1" max="100" value="${z.plants}" data-zn-plants="${i}" ${!z.active ? 'disabled' : ''} style="min-height: 36px; padding: 6px 12px; width: 88px;" />
              </td>
              <td class="t-meta" style="font-family: var(--mono); font-size: 11px;">${z.port}/${z.relayCh}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}
function bindSettingsZones() {
  document.querySelectorAll('[data-zn-toggle]').forEach(b => b.addEventListener('click', () => {
    const i = parseInt(b.getAttribute('data-zn-toggle'));
    const z = state.zones[i];
    z.active = !z.active;
    if (z.active && !z.table) {
      const firstActive = state.tables.find(t => t.active);
      if (firstActive) z.table = firstActive.id;
    }
    if (!z.active) z.table = null;
    saveState();
    renderSettings();
  }));
  document.querySelectorAll('[data-zn-table]').forEach(sel => sel.addEventListener('change', () => {
    const i = parseInt(sel.getAttribute('data-zn-table'));
    state.zones[i].table = sel.value ? parseInt(sel.value) : null;
    saveState();
    toast('Tafel-toewijzing opgeslagen', 'success');
  }));
  document.querySelectorAll('[data-zn-plants]').forEach(inp => inp.addEventListener('change', () => {
    const i = parseInt(inp.getAttribute('data-zn-plants'));
    state.zones[i].plants = clamp(parseInt(inp.value) || 1, 1, 100);
    saveState();
    toast('Aantal planten opgeslagen', 'success');
  }));
}

function renderSettingsTanks() {

function bindSettingsTanks() {

function bindSettingsGeneral() {
  document.getElementById('g-save')?.addEventListener('click', () => {
    state.general.taktTimeSec = parseInt(document.getElementById('g-takt').value) || 90;
    state.general.softLimits.warnMlPerPlant   = parseInt(document.getElementById('g-warn').value)  || 50;
    state.general.softLimits.confirmMlPerPlant= parseInt(document.getElementById('g-conf').value)  || 100;
    state.general.softLimits.blockMlPerPlant  = parseInt(document.getElementById('g-block').value) || 500;

    toast('Instellingen opgeslagen', 'success');

    <div class="help-topics">
      ${HELP_TOPICS.map(h => `
        <div class="help-topic" data-help="${h.id}">
          <div class="help-topic-icon">${svgEl(h.icon, 22)}</div>
          <div class="help-topic-title">${h.title}</div>
          <div class="help-topic-desc">${h.desc}</div>
        </div>
      `).join('')}
    </div>
  `;
  document.querySelectorAll('[data-help]').forEach(b => b.addEventListener('click', () => {
    const t = HELP_TOPICS.find(h => h.id === b.getAttribute('data-help'));
    openModal(`
      <div class="help-topic-icon" style="margin-bottom: 16px;">${svgEl(t.icon, 22)}</div>
      <h2>${t.title}</h2>
      <div class="modal-sub">${t.desc}</div>
      <div class="stack" style="gap: 12px; line-height: 1.65;">${t.body}</div>
      <div class="modal-actions"><button class="btn btn-primary" onclick="this.closest('.modal-backdrop').remove()">Begrepen</button></div>
    `, { wide: true });
  }));
}

/* ====================================================================
   19. GLOBAL HANDLERS — nav, mode, NOODSTOP
==================================================================== */
function setupGlobalHandlers() {
  /* Sidebar nav */
  document.querySelectorAll('.nav-item[data-route]').forEach(el => {
    el.addEventListener('click', () => navigate(el.getAttribute('data-route')));
  });

  /* Mode pill — cycle live → paused → dryrun → live */
  const modePill = document.getElementById('mode-pill');
  const modeLabel = document.getElementById('mode-label');
  function refreshMode() {
    modePill.classList.remove('live', 'paused', 'dryrun');
    modePill.classList.add(state.systemMode);
    modeLabel.textContent = state.systemMode === 'live' ? 'Live' : state.systemMode === 'paused' ? 'Pauze' : 'Test';
  }
  refreshMode();
  modePill.addEventListener('click', () => {
    const order = ['live', 'paused', 'dryrun'];
    const next = order[(order.indexOf(state.systemMode) + 1) % 3];
    state.systemMode = next;
    saveState();
    refreshMode();
    if (next === 'live') startLiveEngine();
    else stopLiveEngine();
    toast(`Modus: ${next === 'live' ? 'Live' : next === 'paused' ? 'Gepauzeerd' : 'Test-modus'}`, next === 'paused' ? 'warn' : 'success');
    refreshLiveStrip();
  });

  /* NOODSTOP */
  const estop = document.getElementById('estop-btn');
  estop.addEventListener('click', () => {
    if (!confirm('NOODSTOP indrukken? Dit stopt alle pompen en kleppen direct, en zet het systeem op pauze.')) return;
    state.systemMode = 'paused';
    saveState();
    stopLiveEngine();
    refreshMode();
    refreshLiveStrip();
    estop.classList.add('armed');
    setTimeout(() => estop.classList.remove('armed'), 2500);
    toast('NOODSTOP geactiveerd — alle activiteit gestopt', 'error');
  });
}

/* ====================================================================
   20. INIT
==================================================================== */
document.addEventListener('DOMContentLoaded', () => {
  loadState();
  setupGlobalHandlers();
  render();
  if (state.systemMode === 'live') startLiveEngine();
});
</script>

<script>

  const ALIA = window.ALIA = {
    online: false,
    ws: null,
    wsReconnectMs: 1500,

    /* Service-modus: zichtbaar in topbar, alle service-tabs zichtbaar.
       Default UIT (operator-modus) — operator ziet alleen dagelijkse acties.

    serviceMode: (function() {
      try { return localStorage.getItem('alia_service_mode') === 'true'; } catch (e) { return false; }

  /* Pas zichtbaarheid sidebar-items aan op basis van service-mode.

  const SERVICE_ROUTES = ['calibration', 'maintenance', 'settings'];
  function applyServiceModeVisibility() {

    document.querySelectorAll('.nav-item[data-route]').forEach(btn => {

      if (SERVICE_ROUTES.includes(route)) {

    /* Verberg het "Instellen" section-label als geen van zijn items zichtbaar is. */
    document.querySelectorAll('.nav-section-label').forEach(lbl => {
      if (lbl.textContent.trim().toLowerCase() === 'instellen') {

      }

    if (!show) {
      const active = document.querySelector('.nav-item.active');

  }
  function setServiceMode(on) {

  /* CSS voor spinner + hero-banner — eenmalig injecteren. */

      #alia-hero-banner button {

      /* ===== Topbar (altijd zichtbaar, compact, niet in de weg) ===== */
      #alia-topbar {

      }

  /* withButtonFeedback — wrapt een async actie zodat de knop direct visuele feedback geeft:
     spinner + "Bezig…", daarna ✓ of ✗, daarna terug naar origineel. */
  async function withButtonFeedback(btn, asyncFn, opts = {}) {
    if (!btn) return asyncFn();
    const orig = { html: btn.innerHTML, disabled: btn.disabled };
    btn.disabled = true;
    btn.innerHTML = '<span class="alia-spinner-inline"></span>' + (opts.busyText || 'Bezig…');
    try {
      const result = await asyncFn();
      btn.innerHTML = opts.successText || '✓ Verstuurd';
      setTimeout(() => { btn.innerHTML = orig.html; btn.disabled = orig.disabled; }, opts.successHoldMs || 1200);
      return result;
    } catch (e) {
      btn.innerHTML = '✗ Faalde';
      setTimeout(() => { btn.innerHTML = orig.html; btn.disabled = orig.disabled; }, 2200);
      throw e;
    }
  }
  window.withButtonFeedback = withButtonFeedback;

  /* ------------------------------------------------------------------
     1. Helpers
  ------------------------------------------------------------------ */
  async function apiJson(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const res = await fetch(API_BASE + path, opts);
    if (!res.ok) {
      const txt = await res.text().catch(() => '');
      throw new Error(`${method} ${path} -> ${res.status} ${txt}`);
    }
    if (res.status === 204) return null;
    const ct = res.headers.get('content-type') || '';
    return ct.includes('json') ? res.json() : res.text();
  }

  async function probeHealth() {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), HEALTH_TIMEOUT_MS);
      const res = await fetch(API_BASE + '/api/health', { signal: ctrl.signal });
      clearTimeout(t);
      return res.ok;
    } catch {
      return false;
    }
  }

  /* ============================================================
     STATUSPANEEL — altijd-zichtbare waarheidsbron voor operator
     ============================================================
     Toont in één blik: verbinding, modus, hardware, lopende cyclus,
     en hoe vers de data is. Polled elke 3 sec /api/health en
     synchroniseert mode-mismatches automatisch. */
  const ALIA_STATUS = {
    online:        false,
    mode:          null,
    hwAttached:    null,
    hwTotal:       null,
    flowEnabled:   false,
    backendVersion: null,
    cycleActive:   false,
    cyclePhase:    'idle',
    cycleTank:     null,
    cycleZone:     null,
    cyclePlannedMs: 0,
    cycleStartedAt: 0,
    lastUpdate:    0,
    wsConnected:   false,
  };

  /* layoutTopChrome — coördineert positie van hero-banner én topbar.
     Anders zou de hero-banner (z-index 99998) bovenop de topbar (z-index 99996)
     liggen en bv. de "▾ details"-knop verbergen. Hier zetten we de topbar
     dynamisch onder de hero-banner. */
  function layoutTopChrome() {
    const hero = document.getElementById('alia-hero-banner');
    const top  = document.getElementById('alia-topbar');
    const heroH = hero ? hero.offsetHeight : 0;
    const topH  = top  ? top.offsetHeight  : 0;
    if (top) top.style.top = heroH + 'px';
    document.body.style.paddingTop = (heroH + topH) + 'px';
  }
  window.layoutTopChrome = layoutTopChrome;

  /* renderTopbar — vervangt het oude rechtsonder paneel.
     Eén dunne strook bovenaan met essentiële status: backend, modus, hardware, cyclus.
     Klikbaar voor uitklap-paneel met details + acties (backup, service-toggle, etc.). */
  let topbarDetailsOpen = false;

  function renderTopbar() {
    let el = document.getElementById('alia-topbar');
    if (!el) {
      el = document.createElement('div');
      el.id = 'alia-topbar';
      document.body.appendChild(el);
    }
    const s = ALIA_STATUS;
    const lastSec = s.lastUpdate ? Math.max(0, Math.floor((Date.now() - s.lastUpdate)/1000)) : null;
    const isStale = lastSec === null || lastSec > 10;
    const isOnline = s.online && !isStale;

    /* Backend dot */
    let backendDot = 'err', backendLbl = 'verbinden…';
    if (isOnline) { backendDot = ''; backendLbl = 'verbonden'; }
    else if (lastSec !== null) { backendDot = 'err'; backendLbl = `weg (${lastSec}s)`; }

    /* Mode-pill */
    let modeDot = '', modeLbl = '—';
    if (s.mode === 'live')     { modeDot = '';     modeLbl = 'Live'; }
    else if (s.mode === 'paused') { modeDot = 'warn'; modeLbl = 'Pauze'; }
    else if (s.mode === 'dryrun') { modeDot = 'busy'; modeLbl = 'Test'; }

    /* Hardware */
    const hwOk = s.hwTotal && s.hwAttached === s.hwTotal;
    const hwDot = hwOk ? '' : (s.hwTotal ? 'warn' : 'err');
    const hwLbl = s.hwTotal ? `${s.hwAttached}/${s.hwTotal}` : '—';

    /* Cyclus */
    let cycDot = '', cycLbl = 'rust';
    if (s.cycleActive) { cycDot = 'busy'; cycLbl = `actief · ${s.cyclePhase || 'cyclus'}`; }

    /* Service-modus indicator */
    const svcIndicator = ALIA.serviceMode
      ? `<div id="alia-topbar-service">🔧 SERVICE-MODUS · alle tabs zichtbaar</div>`
      : '';

    el.innerHTML = `
      <div id="alia-topbar-inner">
        <span class="alia-tb-item" title="Verbinding met backend"><span class="alia-tb-dot ${backendDot}"></span><span class="alia-tb-value">${backendLbl}</span></span>
        <span class="alia-tb-sep"></span>
        <span class="alia-tb-item" title="Werkmodus"><span class="alia-tb-label">Modus</span><span class="alia-tb-dot ${modeDot}"></span><span class="alia-tb-value">${modeLbl}</span></span>
        <span class="alia-tb-sep"></span>
        <span class="alia-tb-item" title="Hardware online"><span class="alia-tb-label">Hardware</span><span class="alia-tb-dot ${hwDot}"></span><span class="alia-tb-value ${hwDot}">${hwLbl}</span></span>
        <span class="alia-tb-sep"></span>
        <span class="alia-tb-item" title="Cyclus-status"><span class="alia-tb-label">Cyclus</span><span class="alia-tb-dot ${cycDot}"></span><span class="alia-tb-value">${cycLbl}</span></span>
        <span class="alia-tb-spacer"></span>
        <button class="alia-tb-action" id="alia-topbar-toggle" aria-expanded="${topbarDetailsOpen}">${topbarDetailsOpen ? '▴' : '▾'} details</button>
      </div>
      ${svcIndicator}
      ${topbarDetailsOpen ? renderTopbarDetails() : ''}
    `;
    /* Layout-coördinatie met hero-banner. */
    layoutTopChrome();

    const toggleBtn = document.getElementById('alia-topbar-toggle');
    if (toggleBtn) toggleBtn.addEventListener('click', () => {
      topbarDetailsOpen = !topbarDetailsOpen;
      renderTopbar();
    });
    /* Event-bindings voor knoppen in het details-paneel — alleen als open. */
    if (topbarDetailsOpen) bindTopbarDetailsActions();
  }

  function renderTopbarDetails() {
    const s = ALIA_STATUS;
    const lastSec = s.lastUpdate ? Math.max(0, Math.floor((Date.now() - s.lastUpdate)/1000)) : null;
    const lastTxt = lastSec === null ? 'nooit' : (lastSec < 2 ? 'net actief' : `${lastSec}s geleden`);
    const flowTxt = s.flowEnabled ? 'aan' : 'uitgeschakeld';
    const cycTxt = s.cycleActive
      ? `${s.cycleTank ? 'Tank ' + s.cycleTank : ''}${s.cycleZone ? ' → ' + s.cycleZone : ''} · ${s.cyclePhase || '—'}`
      : 'geen actieve cyclus';
    return `
      <div id="alia-topbar-details">
        <div class="alia-tbd-block">
          <div class="alia-tbd-title">Modus</div>
          <div class="alia-tbd-value">${s.mode || '—'}</div>
          <div class="alia-tbd-help">${s.mode === 'paused' ? 'Cycli zijn geblokkeerd' : s.mode === 'dryrun' ? 'Hardware uit, alleen simulatie' : 'Cycli kunnen draaien'}</div>
        </div>
        <div class="alia-tbd-block">
          <div class="alia-tbd-title">Hardware</div>
          <div class="alia-tbd-value">${s.hwTotal ? s.hwAttached + '/' + s.hwTotal + ' online' : '—'}</div>
          <div class="alia-tbd-help">Flow-sensoren: ${flowTxt}</div>
        </div>
        <div class="alia-tbd-block">
          <div class="alia-tbd-title">Cyclus</div>
          <div class="alia-tbd-value">${cycTxt}</div>
          <div class="alia-tbd-help">${s.cycleActive ? 'Er loopt nu een waterpuls' : 'Klaar voor volgende opdracht'}</div>
        </div>
        <div class="alia-tbd-block">
          <div class="alia-tbd-title">Update</div>
          <div class="alia-tbd-value">${lastTxt}</div>
          <div class="alia-tbd-help">UI ${ALIA_BUILD} · backend ${s.backendVersion || '?'}</div>
        </div>
        <div class="alia-tbd-block" style="grid-column: 1 / -1;">
          <label class="alia-tbd-toggle">
            <input type="checkbox" id="alia-svc-toggle" ${ALIA.serviceMode ? 'checked' : ''}>
            <div>
              <div class="alia-tbd-toggle-label">🔧 Service-modus</div>
              <div class="alia-tbd-toggle-help">Toont kalibratie, onderhoud en geavanceerde instellingen. Voor service-monteurs.</div>
            </div>
          </label>
        </div>
        <div class="alia-tbd-button-row">
          <button class="alia-tbd-button" id="alia-tb-refresh">↻ Ververs status</button>
          ${s.mode === 'paused' && s.online ? `<button class="alia-tbd-button primary" id="alia-tb-golive">▶ Zet op Live</button>` : ''}
          ${!s.online ? `<button class="alia-tbd-button" id="alia-tb-retry">↻ Opnieuw verbinden</button>` : ''}
        </div>
      </div>
    `;
  }

  function bindTopbarDetailsActions() {
    const svc = document.getElementById('alia-svc-toggle');
    if (svc) svc.addEventListener('change', () => setServiceMode(svc.checked));
    const refresh = document.getElementById('alia-tb-refresh');
    if (refresh) refresh.addEventListener('click', () => {
      pollHealthNow();
      if (typeof pullStateFromBackend === 'function') pullStateFromBackend();
    });
    const golive = document.getElementById('alia-tb-golive');
    if (golive) golive.addEventListener('click', async () => {
      try {
        await apiJson('POST', '/api/command/set_mode', { mode: 'live' });
        state.systemMode = 'live';
        if (typeof toast === 'function') toast('Systeem op Live', 'success');
        if (typeof render === 'function') render();
        pollHealthNow();
      } catch (e) {
        if (typeof toast === 'function') toast('Live zetten faalde: ' + e.message, 'error');
      }
    });
    const retry = document.getElementById('alia-tb-retry');
    if (retry) retry.addEventListener('click', () => pollHealthNow());
  }

  /* Backwards-compat alias: oude code roept renderStatusPanel() aan. */
  function renderStatusPanel() { renderTopbar(); }

  /* ============================================================
     BACKUP & RESTORE — exporteer/importeer state.json
     ============================================================
     downloadBackup() → trekt /api/state en serveer als download. Kalibraties,
     zones, tafels, week-planning — alles bewaard. Bestand is mens-leesbaar JSON.
     restoreBackup(file) → upload JSON, valideer, vraag bevestiging, schrijf via
     PUT /api/state. De huidige state wordt EERST automatisch lokaal als backup
     gedownload zodat operator een vangnet heeft. */
  async function downloadBackup() {
    try {
      const remote = await apiJson('GET', '/api/state');
      const wrapper = {
        version:    '1.0',
        kind:       'alia-backup',
        exportedAt: new Date().toISOString(),
        uiBuild:    ALIA_BUILD,
        backendVersion: ALIA_STATUS.backendVersion || null,
        state:      remote,
      };
      const text = JSON.stringify(wrapper, null, 2);
      const blob = new Blob([text], { type: 'application/json' });
      const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 16);
      const filename = `alia-backup-${ts}.json`;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      if (typeof toast === 'function') toast(`Backup gedownload: ${filename}`, 'success');
      return filename;
    } catch (e) {
      if (typeof toast === 'function') toast('Backup faalde: ' + e.message, 'error');
      throw e;
    }
  }

  async function restoreBackup(file) {
    if (!file) throw new Error('Geen bestand gekozen');
    const text = await file.text();
    let parsed;
    try { parsed = JSON.parse(text); }
    catch (e) { throw new Error('Bestand is geen geldig JSON'); }
    if (!parsed || parsed.kind !== 'alia-backup' || !parsed.state) {
      throw new Error('Dit is geen ALIA-backup-bestand (verwacht "kind: alia-backup")');
    }
    /* Eerst huidige state wegschrijven als veiligheidsbackup vóór we vervangen. */
    try { await downloadBackup(); } catch (e) {
      throw new Error('Kon huidige state niet veiligstellen — restore afgebroken. (' + e.message + ')');
    }
    /* Nu de nieuwe state via PUT /api/state. We sturen ALLE velden uit het backup-bestand. */
    await apiJson('PUT', '/api/state', parsed.state);
    if (typeof toast === 'function') {
      toast(`Backup geïmporteerd van ${parsed.exportedAt || 'onbekende datum'} — pagina laadt opnieuw…`, 'success');
    }
    setTimeout(() => location.reload(), 1500);
  }
  window.downloadBackup = downloadBackup;
  window.restoreBackup  = restoreBackup;

  /* Hero-banner: dunne strook bovenaan het scherm die alleen verschijnt als er
     iets actie-relevant is. Veel zichtbaarder dan het paneel rechtsonder. */
  function renderHeroBanner() {
    let el = document.getElementById('alia-hero-banner');
    const s = ALIA_STATUS;
    const lastSec = s.lastUpdate ? Math.max(0, Math.floor((Date.now() - s.lastUpdate)/1000)) : null;
    const isStale = lastSec === null || lastSec > 10;

    /* Bepaal welke banner getoond moet worden, in volgorde van urgentie. */
    let bannerClass = null, bannerHtml = null;

    if (!s.online || isStale) {
      bannerClass = 'alia-banner-error';
      bannerHtml = `⚠ <strong>Backend onbereikbaar</strong> — geen verbinding met de Pi sinds ${lastSec === null ? 'opstart' : lastSec + 's'} <button id="alia-hero-retry">↻ Opnieuw proberen</button>`;
    } else if (s.hwTotal && s.hwAttached < s.hwTotal) {
      bannerClass = 'alia-banner-warn';
      const missing = s.hwTotal - s.hwAttached;
      bannerHtml = `⚠ <strong>${missing} hardware-device${missing === 1 ? '' : 's'} offline</strong> (${s.hwAttached}/${s.hwTotal}) — controleer kabels en herstart`;
    } else if (s.cycleActive) {
      bannerClass = 'alia-banner-info';
      const where = (s.cycleTank ? `Tank ${s.cycleTank}` : '') + (s.cycleZone ? ` → ${s.cycleZone}` : '');
      bannerHtml = `▶ <strong>Cyclus loopt</strong> · ${where || 'bezig'} · fase: ${s.cyclePhase || '—'}`;
    } else if (s.mode === 'paused') {
      bannerClass = 'alia-banner-warn';
      bannerHtml = `⏸ <strong>Systeem op pauze</strong> — er kunnen geen cycli worden gestart <button id="alia-hero-golive">▶ Zet op Live</button>`;
    }

    if (!bannerClass) {
      /* Alles in orde — geen banner. */
      if (el) { el.remove(); }
      layoutTopChrome();  /* herpositioneer topbar zonder banner */
      return;
    }
    if (!el) {
      el = document.createElement('div');
      el.id = 'alia-hero-banner';
      document.body.appendChild(el);
    }
    el.className = bannerClass;
    el.innerHTML = bannerHtml;
    /* Layout-coördinatie met topbar — anders dekt deze banner de topbar af. */
    layoutTopChrome();

    const retryBtn = document.getElementById('alia-hero-retry');
    if (retryBtn) retryBtn.addEventListener('click', () => pollHealthNow());
    const liveBtn = document.getElementById('alia-hero-golive');
    if (liveBtn) liveBtn.addEventListener('click', async () => {
      try {
        await apiJson('POST', '/api/command/set_mode', { mode: 'live' });
        state.systemMode = 'live';
        if (typeof toast === 'function') toast('Systeem op Live', 'success');
        if (typeof render === 'function') render();
        pollHealthNow();
      } catch (e) {
        if (typeof toast === 'function') toast('Live zetten faalde: ' + e.message, 'error');
      }
    });
  }

  async function pollHealthNow() {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 3000);
      const res = await fetch(API_BASE + '/api/health', { signal: ctrl.signal });
      clearTimeout(t);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const h = await res.json();
      ALIA_STATUS.online      = true;
      ALIA_STATUS.mode        = h.systemMode || null;
      ALIA_STATUS.cycleActive = !!h.cycleActive;
      ALIA_STATUS.backendVersion = h.version || null;
      if (h.hardware) {
        ALIA_STATUS.hwAttached  = h.hardware.attached;
        ALIA_STATUS.hwTotal     = h.hardware.total;
        ALIA_STATUS.flowEnabled = !!h.hardware.flowSensorsEnabled;
      }
      ALIA_STATUS.lastUpdate = Date.now();
      ALIA.online = true;
      /* Detecteer mode-drift tussen UI state en backend, en sync stilletjes. */
      if (state && state.systemMode && state.systemMode !== h.systemMode) {
        console.warn('[ALIA] Mode-drift: UI=' + state.systemMode + ' backend=' + h.systemMode + ' — sync vanaf backend');
        state.systemMode = h.systemMode;
        try { saveStateLocalOnly(); } catch (e) {}
        if (typeof render === 'function') render();
      }
    } catch (e) {
      ALIA_STATUS.online = false;
      ALIA.online = false;
    }
    renderStatusPanel();
    renderHeroBanner();
  }

  /* Compatibility: oude setOnlineBadge kan nog door bestaande code aangeroepen worden. */
  function setOnlineBadge(online) {
    ALIA_STATUS.online = !!online;
    if (online) ALIA_STATUS.lastUpdate = Date.now();
    renderStatusPanel();
    renderHeroBanner();
  }

  /* ------------------------------------------------------------------
     2. State sync (download bij start + upload bij elke saveState)
  ------------------------------------------------------------------ */
  async function pullStateFromBackend() {
    try {
      const remote = await apiJson('GET', '/api/state');
      if (!remote || typeof remote !== 'object') return;
      // Behoud client-side overlay (UI prefs/route) maar overschrijf data
      const keepUI = { _route: window.location.hash };
      Object.assign(window.state, remote);
      // Forceer arrays/objects die nodig zijn voor render
      if (!Array.isArray(window.state.batchEvents)) window.state.batchEvents = [];
      if (!Array.isArray(window.state.calibrationProfiles)) window.state.calibrationProfiles = [];
      window.saveStateLocal && window.saveStateLocal();
      if (typeof render === 'function') render();
    } catch (e) {
      console.warn('[ALIA] pullState failed:', e.message);
    }
  }

  function schedulePushState() {
    if (!ALIA.online) return;
    if (ALIA.putTimer) clearTimeout(ALIA.putTimer);
    ALIA.putTimer = setTimeout(async () => {
      try {
        // Stuur enkel velden die de backend mag overschrijven
        const payload = {
          tanks:          window.state.tanks,
          zones:          window.state.zones,
          tables:         window.state.tables,
          weekSchedule:   window.state.weekSchedule,
          calibrationProfiles: window.state.calibrationProfiles,
          systemSettings: window.state.systemSettings,
          systemMode:     window.state.systemMode,
        };
        await apiJson('PUT', '/api/state', payload);
      } catch (e) {
        console.warn('[ALIA] pushState failed:', e.message);
      }
    }, 600);
  }

  /* Lokaal opslaan zonder PUT te triggeren — gebruikt door WS-handlers
     wanneer state-changes van backend komen (anders bouncen ze terug). */
  function saveStateLocalOnly() {
    try {
      if (state.batchEvents && state.batchEvents.length > 200) state.batchEvents = state.batchEvents.slice(0, 200);
      localStorage.setItem('alia_state', JSON.stringify(state));
    } catch (e) {}
  }
  window.saveStateLocal = saveStateLocalOnly;  // backward-compat alias

  /* Luister naar het event dat alia.html's saveState() dispatcht — dat is
     de robuuste hook om alle state-mutaties naar de backend te pushen.
     (De eerdere window.saveState wrapper werkte niet omdat function-
      declarations in classic scripts een lexicale binding aanmaken die je
      niet via window kunt vervangen.) */
  window.addEventListener('alia-state-saved', schedulePushState);

  /* ------------------------------------------------------------------
     3. WebSocket — luisteren naar fasewissels en batches
  ------------------------------------------------------------------ */
  function openWS() {
    if (!ALIA.online) return;
    if (ALIA.ws && ALIA.ws.readyState <= 1) return;
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = `${proto}://${location.host}${WS_PATH}`;
    try {
      ALIA.ws = new WebSocket(url);
    } catch (e) {
      console.warn('[ALIA] ws open failed:', e.message);
      return;
    }
    ALIA.ws.onopen = () => { ALIA.wsReconnectMs = 1500; console.log('[ALIA] WS open'); };
    ALIA.ws.onclose = () => {
      if (!ALIA.online) return;
      setTimeout(openWS, ALIA.wsReconnectMs);
      ALIA.wsReconnectMs = Math.min(ALIA.wsReconnectMs * 1.6, 15000);
    };
    ALIA.ws.onerror = (e) => console.warn('[ALIA] WS error', e);
    ALIA.ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      handleWSMessage(msg);
    };
  }

  function handleWSMessage(msg) {
    if (!msg || !msg.type) return;
    switch (msg.type) {
      case 'phase_change': {
        // payload: { tank, zone, mlPerPlant, plants, targetMl, startedAt, plannedMs, phases }
        const p = msg.payload || {};
        window.livePhase = {
          tank: p.tank, zone: p.zone,
          mlPerPlant: p.mlPerPlant, plants: p.plants, targetMl: p.targetMl,
          startedAt: p.startedAt || Date.now(),
          plannedMs: p.plannedMs || 0,
          phases: p.phases || [],
        };
        /* Update status-panel met cyclus-info. Pak de eerste actieve fase als label. */
        const now = Date.now();
        let activePhaseName = 'idle';
        if (Array.isArray(p.phases) && p.startedAt) {
          for (const ph of p.phases) {
            const phStart = (p.startedAt || 0) + (ph.startMs || 0);
            const phEnd = phStart + (ph.durationMs || 0);
            if (now >= phStart && now < phEnd) { activePhaseName = ph.name; break; }
          }
        }
        ALIA_STATUS.cycleActive    = true;
        ALIA_STATUS.cyclePhase     = activePhaseName;
        ALIA_STATUS.cycleTank      = p.tank || null;
        ALIA_STATUS.cycleZone      = p.zone || null;
        ALIA_STATUS.cycleStartedAt = p.startedAt || now;
        ALIA_STATUS.cyclePlannedMs = p.plannedMs || 0;
        renderStatusPanel();
        if (typeof refreshLiveStrip === 'function') refreshLiveStrip();
        break;
      }
      case 'batch_complete': {
        const evt = msg.payload;
        if (!evt) break;
        if (!Array.isArray(window.state.batchEvents)) window.state.batchEvents = [];
        window.state.batchEvents.unshift(evt);
        if (window.state.batchEvents.length > 200) window.state.batchEvents.length = 200;
        window.saveStateLocal && window.saveStateLocal();
        /* Cyclus afgerond — status terug naar idle. */
        ALIA_STATUS.cycleActive = false;
        ALIA_STATUS.cyclePhase  = 'idle';
        ALIA_STATUS.cycleTank   = null;
        ALIA_STATUS.cycleZone   = null;
        renderStatusPanel();
        if (typeof render === 'function') render();
        break;
      }
      case 'wear_update': {
        if (msg.payload) {
          window.state.componentWear = msg.payload;
          window.saveStateLocal && window.saveStateLocal();
          if (typeof render === 'function') render();
        }
        break;
      }
      case 'substrate_update': {
        if (msg.payload && msg.payload.zone && typeof msg.payload.substratePct === 'number') {
          const z = (window.state.zones || []).find(z => z.name === msg.payload.zone);
          if (z) { z.substratePct = msg.payload.substratePct; }
          window.saveStateLocal && window.saveStateLocal();
          if (typeof refreshSensorsLive === 'function') refreshSensorsLive();
        }
        break;
      }
      case 'mode_change': {
        if (msg.payload && msg.payload.mode) {
          window.state.systemMode = msg.payload.mode;
          window.saveStateLocal && window.saveStateLocal();
          if (typeof refreshMode === 'function') refreshMode();
          if (typeof refreshLiveStrip === 'function') refreshLiveStrip();
        }
        break;
      }
      case 'emergency_stop': {
        window.state.systemMode = 'paused';
        window.livePhase = {};
        window.saveStateLocal && window.saveStateLocal();
        if (typeof toast === 'function') toast('NOODSTOP vanuit backend ontvangen', 'error');
        if (typeof render === 'function') render();
        break;
      }
      case 'cycle_error': {
        if (typeof toast === 'function') toast('Cyclus-fout: ' + (msg.payload && msg.payload.reason || 'onbekend'), 'error');
        break;
      }
      case 'calibration_update': {
        const prof = msg.payload;
        if (prof && prof.id && Array.isArray(window.state.calibrationProfiles)) {
          const idx = window.state.calibrationProfiles.findIndex(p => p.id === prof.id);
          if (idx >= 0) window.state.calibrationProfiles[idx] = prof;
          else window.state.calibrationProfiles.push(prof);
          window.saveStateLocal && window.saveStateLocal();
          if (typeof render === 'function') render();
        }
        break;
      }
    }
  }

  /* ------------------------------------------------------------------
     4. Mock-engine uitschakelen wanneer backend live is
  ------------------------------------------------------------------ */
  function disableMockEngine() {
    if (typeof window.stopLiveEngine === 'function') {
      try { window.stopLiveEngine(); } catch (e) {}
    }
    window.simulateBatch  = function () { /* no-op — backend stuurt batches via WS */ };
    window.advanceSubstrate = function () { /* backend levert sensors */ };
    window.startLiveEngine = function () {
      // strip-refresh blijft lokaal lopen voor soepele aftelling
      if (window._stripIv) clearInterval(window._stripIv);
      window._stripIv = setInterval(() => {
        if (typeof refreshLiveStrip === 'function') refreshLiveStrip();
      }, 200);
    };
    window.stopLiveEngine = function () {
      if (window._stripIv) { clearInterval(window._stripIv); window._stripIv = null; }
    };
    window.startLiveEngine();
  }

  /* ------------------------------------------------------------------
     5. Knoppen functioneel maken (capture phase, vóór originele handlers)
  ------------------------------------------------------------------ */
  function wireButtons() {
    // NOODSTOP — onderschep vóór de originele lokale handler
    document.addEventListener('click', async (ev) => {
      const target = ev.target.closest('#estop-btn');
      if (!target) return;
      if (!ALIA.online) return;  // laat lokale fallback z'n werk doen
      ev.stopImmediatePropagation();
      ev.preventDefault();
      if (!confirm('NOODSTOP indrukken? Dit stopt alle pompen en kleppen direct.')) return;
      try {
        await apiJson('POST', '/api/command/emergency_stop', { reason: 'user_button' });
        if (typeof toast === 'function') toast('NOODSTOP verzonden naar backend', 'error');
      } catch (e) {
        if (typeof toast === 'function') toast('NOODSTOP faalde: ' + e.message, 'error');
      }
    }, true);

    // Mode pill — toggle via backend
    document.addEventListener('click', async (ev) => {
      const target = ev.target.closest('#mode-pill');
      if (!target) return;
      if (!ALIA.online) return;
      ev.stopImmediatePropagation();
      ev.preventDefault();
      const cur = window.state.systemMode || 'live';
      const next = cur === 'live' ? 'paused' : (cur === 'paused' ? 'dryrun' : 'live');
      try {
        await apiJson('POST', '/api/command/set_mode', { mode: next });
      } catch (e) {
        if (typeof toast === 'function') toast('Mode-wissel faalde: ' + e.message, 'error');
      }
    }, true);

    // Handmatige cyclus — loopt over alle gekozen zones (multi-zone modus).
    // Backend-queue handelt sequentiële uitvoering automatisch af; we sturen
    // gewoon één POST per zone in klik-volgorde.
    document.addEventListener('click', async (ev) => {
      const target = ev.target.closest('#manual-start');
      if (!target) return;
      if (!ALIA.online) return;
      ev.stopImmediatePropagation();
      ev.preventDefault();
      let ms = {};
      try { ms = typeof manualState !== 'undefined' ? manualState : (window.manualState || {}); }
      catch (_e) { ms = window.manualState || {}; }
      /* Bouw lijst van zones; valt terug op legacy `zone` veld als zones leeg is. */
      let zones = Array.isArray(ms.zones) ? ms.zones.slice() : [];
      if (!zones.length && ms.zone) zones = [ms.zone];
      if (!ms.tank || !(ms.mlPerPlant > 0) || !zones.length) {
        if (typeof toast === 'function') toast('Kies eerst tank, zone(s) en mL/plant', 'error');
        return;
      }
      let okCount = 0, errCount = 0;
      /* Per zone: gebruik per-zone tank als perZoneSmaak aan staat, anders default. */
      const zoneTanks = (ms.zoneTanks && typeof ms.zoneTanks === 'object') ? ms.zoneTanks : {};
      const usePerZone = !!ms.perZoneSmaak;
      for (const zn of zones) {
        const tankId = (usePerZone && zoneTanks[zn]) ? zoneTanks[zn] : ms.tank;
        try {
          await apiJson('POST', '/api/command/manual_cycle', {
            tank:       tankId,
            zone:       zn,
            mlPerPlant: ms.mlPerPlant,
          });
          okCount++;
        } catch (e) {
          errCount++;
          console.warn('Manual cycle queue failed for', zn, e);
        }
      }
      if (typeof toast === 'function') {
        if (errCount === 0 && okCount === 1) {
          toast(`Beurt gestart → ${zones[0]}`, 'success');
        } else if (errCount === 0) {
          toast(`${okCount} beurten in wachtrij — de machine loopt ze automatisch af`, 'success');
        } else if (okCount === 0) {
          toast(`Starten faalde voor alle ${errCount} zones`, 'error');
        } else {
          toast(`${okCount} beurten gestart, ${errCount} faalden`, 'warn');
        }
      }
    }, true);

    // Guided calibration — pulse test via backend
    document.addEventListener('click', async (ev) => {
      const target = ev.target.closest('#guided-run');
      if (!target) return;
      if (!ALIA.online) return;        // laat originele lokale handler werken
      try {
        const g    = typeof calState !== 'undefined' ? calState.guided : null;
        const pump = typeof calState !== 'undefined' ? calState.selectedPump : null;
        if (!g || !pump) return;
        const LEVELS = [10, 20, 30, 40, 50];
        const mlPerPlant = LEVELS[g.level] || 10;
        const calZone = (state.zones || []).find(z => z.active);
        if (!calZone) {
          if (typeof toast === 'function') toast('Geen actieve zone — activeer eerst een zone via Instellingen', 'error');
          return;
        }
        /* Pre-flight: check mode. Als paused, bied gebruiker aan om op live te zetten. */
        if (state.systemMode === 'paused') {
          if (typeof toast === 'function') toast('Systeem staat op pauze — banner bovenaan om live te zetten', 'error');
          return;
        }
        /* Single source of truth: g._manualOpenSec uit state. Niet de input.value lezen
           (Safari kan user-typed values plakken na re-render). */
        const openSec = g._manualOpenSec;
        if (!Number.isFinite(openSec) || openSec <= 0) {
          if (typeof toast === 'function') toast('Geen geldige open-tijd', 'error');
          return;
        }
        const body = {
          tank:       pump,
          zone:       calZone.name,
          mlPerPlant: mlPerPlant,
          openSec:    openSec,
        };
        /* Knop-feedback: spinner tijdens fetch, ✓ na succes. */
        await withButtonFeedback(target,
          () => apiJson('POST', `/api/calibration/cal_p${pump}/test_pulse`, body),
          { busyText: 'Versturen…', successText: '✓ Verstuurd' }
        );
        if (typeof toast === 'function') {
          toast(`Pakket onderweg → ${calZone.name} · ${openSec.toFixed(2)}s open`, 'success');
        }
        /* Forceer onmiddellijke health-poll zodat status-paneel direct toont dat cyclus draait. */
        pollHealthNow();
      } catch (e) {
        if (typeof toast === 'function') toast('Test-puls faalde: ' + e.message, 'error');
      }
    }, true);
  }

  /* ------------------------------------------------------------------
     6. Boot — probeer backend te bereiken, anders fallback naar mock
  ------------------------------------------------------------------ */
  async function boot() {
    // Wacht tot DOMContentLoaded init klaar is (loadState + setupGlobalHandlers)
    await new Promise(r => setTimeout(r, 50));
    applyServiceModeVisibility();  /* sidebar direct filteren op operator/service-modus */
    renderStatusPanel();  /* toon meteen "VERBINDEN…" zodat operator weet dat er iets gebeurt */
    await pollHealthNow();
    if (!ALIA.online) {
      console.warn('[ALIA] Backend niet bereikbaar — draait in offline mock-modus.');
      /* Blijf periodiek proberen — niet stoppen, anders blijft de UI in mock hangen. */
      setInterval(pollHealthNow, 3000);
      return;
    }
    console.log('[ALIA] Backend bereikbaar.');
    disableMockEngine();
    wireButtons();
    await pullStateFromBackend();
    openWS();

    /* Periodieke health-poll: 3 sec interval geeft snelle feedback bij verbindingsverlies
       en houdt mode/hardware/cyclus-status in het paneel altijd vers. */
    setInterval(pollHealthNow, 3000);
    /* Re-render status-panel + hero-banner elke seconde voor de "x sec geleden"-teller
       en zodat staleness snel zichtbaar wordt. */
    setInterval(() => { renderStatusPanel(); renderHeroBanner(); }, 1000);
    /* Pull state opnieuw als de tab weer focus krijgt (operator kwam terug van een ander tabblad). */
    window.addEventListener('focus', () => { pollHealthNow(); pullStateFromBackend(); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => setTimeout(boot, 100));
  } else {
    setTimeout(boot, 100);
  }
})();
</script>
</body>
</html>
