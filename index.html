<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Allico × ALIA</title>
<!-- Lokale assets — werken offline op de Pi (zie frontend/vendor/README.md).
     Als fonts.css faalt of de woff2's ontbreken, valt de UI terug op systeem-
     fonts via de fallback-keten in --sans / --mono. Chart.js wordt ALTIJD
     lokaal geladen vanaf /static/vendor/ (geen CDN-afhankelijkheid). -->
<link href="/static/vendor/fonts.css" rel="stylesheet" />
<script src="/static/vendor/chart.umd.min.js"></script>
<style>
/* ====================================================================
   ALIA v3 — Visual Industrial Control System
   Design tokens inspired by Refactoring UI:
     - One warm-paper palette + plant-green accent + tank colors
     - Typography hierarchy by weight + size, not just color
     - Soft, color-tinted shadows
     - Generous whitespace
     - Content-first
==================================================================== */

:root {
  /* Surface palette — warm off-white, agricultural feel */
  --paper:        #fafaf6;
  --canvas:       #ffffff;
  --cream:        #f5f1e6;
  --cream-deep:   #ede7d3;

  /* Borders */
  --mist:         #ebe6d6;
  --mist-strong:  #d8d2bc;
  --haze:         #f3eede;

  /* Text */
  --ink:          #1a1815;
  --charcoal:     #4a4640;
  --slate:        #6b6859;
  --ash:          #9a9482;
  --mist-text:    #b8b3a1;

  /* Plant accent (primary) */
  --plant-50:  #f1f7eb;
  --plant-100: #ddedc8;
  --plant-200: #b9d896;
  --plant-300: #93bf64;
  --plant-400: #74a847;
  --plant-500: #5e9c3a;
  --plant-600: #4d8030;
  --plant-700: #3d6526;
  --plant-800: #304f1d;

  /* Status */
  --amber-50:  #fef8eb;
  --amber-100: #fceec0;
  --amber-500: #d97706;
  --amber-700: #92400e;

  --rust-50:  #fef3f0;
  --rust-100: #fde0d3;
  --rust-500: #c2410c;
  --rust-600: #9a3412;
  --rust-700: #7c2d12;

  --sky-50:   #eff8ff;
  --sky-100:  #d6ecff;
  --sky-500:  #0284c7;
  --sky-700:  #0369a1;

  /* Tank palette (vivid, distinct) */
  --tank-1: #0284c7;  /* sky */
  --tank-2: #16a34a;  /* forest */
  --tank-3: #d97706;  /* amber */
  --tank-4: #db2777;  /* rose */
  --tank-1-soft: #e0f2fe;
  --tank-2-soft: #dcfce7;
  --tank-3-soft: #fed7aa;
  --tank-4-soft: #fce7f3;

  /* Tones */
  --shadow-sm: 0 1px 2px rgba(28, 24, 21, 0.04);
  --shadow:    0 2px 6px rgba(28, 24, 21, 0.05), 0 1px 2px rgba(28, 24, 21, 0.04);
  --shadow-md: 0 6px 18px rgba(28, 24, 21, 0.08), 0 2px 4px rgba(28, 24, 21, 0.04);
  --shadow-lg: 0 16px 40px rgba(28, 24, 21, 0.12), 0 4px 8px rgba(28, 24, 21, 0.06);
  --ring-plant: 0 0 0 3px rgba(94, 156, 58, 0.18);
  --ring-rust:  0 0 0 3px rgba(194, 65, 12, 0.18);

  --radius-sm: 8px;
  --radius:    12px;
  --radius-md: 16px;
  --radius-lg: 20px;
  --radius-xl: 28px;

  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: var(--sans);
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-size: 15px;
  line-height: 1.5;
  font-feature-settings: 'cv11', 'ss01', 'ss03';
}

button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--plant-500); outline-offset: 2px; border-radius: 4px; }

/* ============ APP SHELL — sidebar + topbar + content ============ */
.app-shell {
  display: grid;
  grid-template-columns: 260px 1fr;
  grid-template-rows: 64px 1fr;
  grid-template-areas:
    "sidebar topbar"
    "sidebar content";
  min-height: 100vh;
}

.sidebar {
  grid-area: sidebar;
  background: var(--canvas);
  border-right: 1px solid var(--mist);
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

/* ===== Brand-blok in sidebar — Cogas Climate Control logo + Powered by ===== */
.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 14px 12px 18px;
  border-bottom: 1px solid var(--mist);
  margin: -16px -16px 16px;  /* sluit aan op sidebar-padding zodat het strak loopt */
  background: var(--canvas);
}
.brand-cogas {
  display: block;
  width: 100%;
  max-width: 200px;
}
.brand-cogas svg {
  width: 100%;
  height: auto;
  display: block;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.05));
}
.brand-poweredby {
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 0.2px;
  color: var(--plant-700);
  text-align: center;
  line-height: 1.4;
  padding-top: 4px;
}
.brand-poweredby .brand-name {
  /* ALIA én Allico Systems krijgen dezelfde behandeling — gelijk lettertype
     (erft van root) en gelijke kleur + gewicht. Mooi op het Cogas-logo
     afgestemd. */
  font-weight: 700;
  letter-spacing: 0.3px;
  color: var(--plant-800, #16432e);
}
.brand-poweredby .brand-x {
  /* Het scheidingsteken iets subtieler zodat de namen accent krijgen. */
  color: var(--plant-500);
  font-weight: 600;
  margin: 0 1px;
}

.nav-section-label {
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--ash);
  padding: 18px 12px 8px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 12px;
  border-radius: 9px;
  font-size: 14px;
  font-weight: 500;
  color: var(--charcoal);
  cursor: pointer;
  margin-bottom: 2px;
  transition: background 0.12s, color 0.12s;
  background: none;
  border: none;
  text-align: left;
  width: 100%;
}
.nav-item:hover { background: var(--cream); color: var(--ink); }
.nav-item.active {
  background: var(--plant-50);
  color: var(--plant-700);
  font-weight: 600;
}
.nav-item.active .nav-icon { color: var(--plant-600); }
.nav-icon {
  width: 20px; height: 20px;
  flex-shrink: 0;
  color: var(--slate);
  display: flex; align-items: center; justify-content: center;
}
.nav-item.active .nav-icon { color: var(--plant-600); }
.nav-icon svg { width: 18px; height: 18px; }

.nav-divider {
  height: 1px; background: var(--mist);
  margin: 12px 4px;
}

.nav-footer {
  margin-top: auto;
  padding-top: 16px;
  border-top: 1px solid var(--mist);
}
.nav-footer-status {
  padding: 8px 12px;
  font-size: 11px;
  color: var(--ash);
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-footer-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--plant-500);
  box-shadow: 0 0 0 3px var(--plant-100);
}

/* ============ TOPBAR ============ */
.topbar {
  grid-area: topbar;
  background: var(--canvas);
  border-bottom: 1px solid var(--mist);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  position: sticky;
  top: 0;
  z-index: 50;
}

.topbar-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.3px;
  color: var(--ink);
}
.topbar-subtitle {
  font-size: 12px;
  color: var(--ash);
  margin-top: -2px;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.mode-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  background: var(--canvas);
  border: 1px solid var(--mist);
  color: var(--charcoal);
}
.mode-pill .mode-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--ash);
}
.mode-pill.live {
  background: var(--plant-50);
  border-color: var(--plant-200);
  color: var(--plant-700);
}
.mode-pill.live .mode-dot {
  background: var(--plant-500);
  animation: live-pulse 1.5s ease-in-out infinite;
}
.mode-pill.paused {
  background: var(--amber-50);
  border-color: var(--amber-100);
  color: var(--amber-700);
}
.mode-pill.paused .mode-dot { background: var(--amber-500); }
.mode-pill.dryrun {
  background: var(--sky-50);
  border-color: var(--sky-100);
  color: var(--sky-700);
}
.mode-pill.dryrun .mode-dot { background: var(--sky-500); }

@keyframes live-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(94, 156, 58, 0.5); }
  50% { box-shadow: 0 0 0 5px rgba(94, 156, 58, 0); }
}

.estop-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 18px;
  border-radius: 10px;
  border: 1.5px solid var(--rust-500);
  background: var(--canvas);
  color: var(--rust-500);
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0.4px;
  cursor: pointer;
  transition: all 0.12s;
}
.estop-btn:hover {
  background: var(--rust-500);
  color: white;
}
.estop-btn:active { transform: scale(0.97); }
.estop-btn svg { width: 16px; height: 16px; }
.estop-btn.armed {
  background: var(--rust-500);
  color: white;
  animation: estop-blink 1s ease-in-out infinite;
}
@keyframes estop-blink {
  0%, 100% { box-shadow: 0 0 0 0 rgba(194, 65, 12, 0.6); }
  50% { box-shadow: 0 0 0 12px rgba(194, 65, 12, 0); }
}

/* ============ CONTENT AREA ============ */
.content {
  grid-area: content;
  padding: 32px 40px 80px;
  max-width: 1400px;
  width: 100%;
}

.page-head {
  margin-bottom: 32px;
}
.page-title {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -0.6px;
  margin: 0 0 6px;
  color: var(--ink);
}
.page-lead {
  color: var(--slate);
  font-size: 15px;
  max-width: 720px;
  margin: 0;
}

/* ============ CARDS ============ */
.card {
  background: var(--canvas);
  border: 1px solid var(--mist);
  border-radius: var(--radius-md);
  padding: 24px;
}
.card-flat { background: var(--canvas); border-radius: var(--radius-md); padding: 24px; }
.card-soft {
  background: var(--cream);
  border-radius: var(--radius-md);
  padding: 24px;
}
.card-tight { padding: 16px 20px; }
.card-lg { padding: 32px; border-radius: var(--radius-lg); }

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  gap: 12px;
}
.card-title {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.2px;
  color: var(--ink);
}
.card-sub {
  font-size: 12px;
  color: var(--ash);
}

/* Section heading inside content */
.section-heading {
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.4px;
  color: var(--ash);
  margin: 32px 0 16px;
}

/* ============ TYPOGRAPHY HELPERS ============ */
.t-display { font-size: 36px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.1; }
.t-h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.2; }
.t-h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.2px; }
.t-h3 { font-size: 15px; font-weight: 600; }
.t-meta { font-size: 12px; color: var(--ash); font-weight: 500; }
.t-meta-strong { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--ash); }
.t-mono { font-family: var(--mono); font-feature-settings: 'tnum'; }
.t-num-lg { font-family: var(--mono); font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
.t-num { font-family: var(--mono); font-size: 18px; font-weight: 600; }
.muted { color: var(--ash); }

/* ============ BUTTONS ============ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: 10px;
  border: 1px solid var(--mist);
  background: var(--canvas);
  color: var(--ink);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.12s;
  min-height: 42px;
  text-align: center;
}
.btn:hover { background: var(--cream); border-color: var(--mist-strong); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 16px; height: 16px; }
.btn-sm { padding: 6px 12px; font-size: 13px; min-height: 34px; }
.btn-xs { padding: 4px 10px; font-size: 12px; min-height: 28px; }

.btn-primary {
  background: var(--plant-600);
  border-color: var(--plant-600);
  color: white;
}
.btn-primary:hover { background: var(--plant-700); border-color: var(--plant-700); }

.btn-danger {
  background: var(--canvas);
  border-color: var(--rust-100);
  color: var(--rust-500);
}
.btn-danger:hover { background: var(--rust-50); border-color: var(--rust-500); }

.btn-soft {
  background: var(--cream);
  border-color: transparent;
}
.btn-soft:hover { background: var(--cream-deep); }

.btn-ghost {
  background: transparent;
  border-color: transparent;
}
.btn-ghost:hover { background: var(--cream); }

.btn-icon { width: 36px; height: 36px; padding: 0; }
.btn-disabled, .btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  pointer-events: none;
}

/* The hero "START" button — industrial yet refined */
.btn-hero {
  padding: 18px 36px;
  border-radius: 16px;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  background: var(--plant-600);
  color: white;
  border: none;
  min-height: 60px;
  box-shadow: var(--shadow-md);
  display: inline-flex;
  align-items: center;
  gap: 12px;
}
.btn-hero:hover { background: var(--plant-700); transform: translateY(-1px); box-shadow: var(--shadow-lg); }
.btn-hero:active { transform: translateY(0); }
.btn-hero:disabled, .btn-hero.disabled {
  background: var(--mist-strong);
  color: var(--ash);
  cursor: not-allowed;
  pointer-events: none;
  box-shadow: none;
}
.btn-hero svg { width: 24px; height: 24px; }

/* ============ INPUTS ============ */
.input, .select, .textarea {
  display: block;
  width: 100%;
  padding: 11px 16px;
  border-radius: 10px;
  border: 1px solid var(--mist);
  background: var(--canvas);
  font-size: 14px;
  color: var(--ink);
  font-weight: 500;
  transition: border-color 0.12s, box-shadow 0.12s;
  min-height: 44px;
}
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--plant-500);
  box-shadow: var(--ring-plant);
}
.input.mono { font-family: var(--mono); font-feature-settings: 'tnum'; }
.input.large {
  padding: 18px 22px;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.3px;
  min-height: 64px;
}
.input.large.mono { font-family: var(--mono); font-size: 22px; }
.input.error { border-color: var(--rust-500); background: var(--rust-50); }
.input.warn  { border-color: var(--amber-500); background: var(--amber-50); }
.input.ok    { border-color: var(--plant-500); }
.input:disabled, .input[readonly] {
  background: var(--paper);
  color: var(--slate);
  cursor: not-allowed;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.field-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--charcoal);
  letter-spacing: 0.2px;
}
.field-hint {
  font-size: 12px;
  color: var(--ash);
  line-height: 1.4;
}
.field-hint.warn { color: var(--amber-700); }
.field-hint.error { color: var(--rust-600); }
.field-hint.ok { color: var(--plant-700); }

/* Pretty toggle */
.toggle {
  position: relative;
  width: 44px; height: 26px;
  background: var(--mist-strong);
  border-radius: 999px;
  border: none;
  cursor: pointer;
  transition: background 0.18s;
  flex-shrink: 0;
}
.toggle::after {
  content: '';
  position: absolute;
  width: 20px; height: 20px;
  top: 3px; left: 3px;
  background: white;
  border-radius: 50%;
  transition: left 0.18s;
  box-shadow: var(--shadow-sm);
}
.toggle.on { background: var(--plant-500); }
.toggle.on::after { left: 21px; }

/* Stepper (numeric input with +/- buttons) */
.stepper {
  display: inline-flex;
  align-items: stretch;
  border-radius: 12px;
  border: 1px solid var(--mist);
  background: var(--canvas);
  overflow: hidden;
}
.stepper-btn {
  width: 44px;
  background: transparent;
  border: none;
  cursor: pointer;
  font-size: 18px;
  font-weight: 600;
  color: var(--charcoal);
  transition: background 0.1s;
}
.stepper-btn:hover { background: var(--cream); }
.stepper-btn:active { background: var(--cream-deep); }
.stepper-value {
  min-width: 80px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 700;
  border-left: 1px solid var(--mist);
  border-right: 1px solid var(--mist);
  background: var(--paper);
}
.stepper-unit { font-size: 12px; color: var(--ash); margin-left: 4px; font-weight: 500; }

/* ============ PILLS / BADGES ============ */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.2px;
}
.pill-plant { background: var(--plant-100); color: var(--plant-700); }
.pill-amber { background: var(--amber-100); color: var(--amber-700); }
.pill-rust  { background: var(--rust-100); color: var(--rust-700); }
.pill-sky   { background: var(--sky-100); color: var(--sky-700); }
.pill-soft  { background: var(--cream); color: var(--charcoal); }
.pill-ink   { background: var(--ink); color: white; }

/* Tank chip — always coloured by tank id, used everywhere */
.tank-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid;
}
.tank-chip-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
}
.tank-1 { color: var(--tank-1); border-color: var(--tank-1); background: var(--tank-1-soft); }
.tank-1 .tank-chip-dot { background: var(--tank-1); }
.tank-2 { color: var(--tank-2); border-color: var(--tank-2); background: var(--tank-2-soft); }
.tank-2 .tank-chip-dot { background: var(--tank-2); }
.tank-3 { color: var(--tank-3); border-color: var(--tank-3); background: var(--tank-3-soft); }
.tank-3 .tank-chip-dot { background: var(--tank-3); }
.tank-4 { color: var(--tank-4); border-color: var(--tank-4); background: var(--tank-4-soft); }
.tank-4 .tank-chip-dot { background: var(--tank-4); }

/* Status dot inline */
.status-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-right: 8px;
}
.status-dot.ok    { background: var(--plant-500); }
.status-dot.warn  { background: var(--amber-500); }
.status-dot.err   { background: var(--rust-500); }
.status-dot.idle  { background: var(--ash); }

/* ============ GRIDS / LAYOUT HELPERS ============ */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row   { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.row-tight { display: flex; align-items: center; gap: 8px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.gap-sm { gap: 8px; }
.gap-md { gap: 16px; }
.gap-lg { gap: 24px; }
.mt-sm { margin-top: 8px; }
.mt-md { margin-top: 16px; }
.mt-lg { margin-top: 24px; }
.mb-md { margin-bottom: 16px; }
.flex-1 { flex: 1; }

/* ============ TAFEL VISUALIZATION ============ */
.tafel-svg-wrap {
  background: var(--canvas);
  border-radius: var(--radius-md);
  padding: 32px;
  display: flex;
  justify-content: center;
}
.tafel-svg { max-width: 100%; height: auto; }

/* ============ ZONE CARDS ============ */
.zone-card {
  border: 1.5px solid var(--mist);
  border-radius: var(--radius-md);
  padding: 18px;
  background: var(--canvas);
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
  overflow: hidden;
}
.zone-card:hover { border-color: var(--plant-300); transform: translateY(-2px); box-shadow: var(--shadow-md); }
.zone-card.active-pulse { border-color: var(--plant-500); box-shadow: var(--ring-plant); }
.zone-card.selected { border-color: var(--plant-500); background: var(--plant-50); box-shadow: var(--ring-plant); }
.zone-card.inactive { opacity: 0.5; cursor: default; }
.zone-card.inactive:hover { transform: none; box-shadow: none; }
.zone-card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.zone-card-name { font-weight: 700; font-size: 15px; }
.zone-card-meta { font-size: 11px; color: var(--ash); }
.zone-card-plants {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 600;
  color: var(--charcoal);
  margin-top: 8px;
}

/* ============ STAT BLOCK ============ */
.stat-block {
  background: var(--canvas);
  border: 1px solid var(--mist);
  border-radius: var(--radius-md);
  padding: 22px 24px;
}
.stat-block-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.1px;
  color: var(--ash);
  margin-bottom: 8px;
}
.stat-block-value {
  font-family: var(--mono);
  font-size: 30px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--ink);
  line-height: 1.1;
}
.stat-block-unit {
  font-size: 14px;
  font-weight: 500;
  color: var(--ash);
  margin-left: 4px;
}
.stat-block-trend {
  margin-top: 6px;
  font-size: 12px;
  color: var(--slate);
  display: flex;
  align-items: center;
  gap: 6px;
}
.stat-block.alert { background: var(--rust-50); border-color: var(--rust-100); }
.stat-block.alert .stat-block-value { color: var(--rust-600); }
.stat-block.success { background: var(--plant-50); border-color: var(--plant-100); }
.stat-block.success .stat-block-value { color: var(--plant-700); }

/* ============ TANK CHOICE CARDS ============ */
.tank-choices {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
}
.tank-choice {
  position: relative;
  padding: 20px 22px;
  border-radius: var(--radius-md);
  border: 2px solid var(--mist);
  background: var(--canvas);
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow: hidden;
  text-align: left;
}
.tank-choice::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 6px;
}
.tank-choice.t1::before { background: var(--tank-1); }
.tank-choice.t2::before { background: var(--tank-2); }
.tank-choice.t3::before { background: var(--tank-3); }
.tank-choice.t4::before { background: var(--tank-4); }
.tank-choice:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.tank-choice.selected { border-color: var(--ink); box-shadow: var(--shadow-md); }
.tank-choice.selected.t1 { border-color: var(--tank-1); background: var(--tank-1-soft); }
.tank-choice.selected.t2 { border-color: var(--tank-2); background: var(--tank-2-soft); }
.tank-choice.selected.t3 { border-color: var(--tank-3); background: var(--tank-3-soft); }
.tank-choice.selected.t4 { border-color: var(--tank-4); background: var(--tank-4-soft); }
.tank-choice-head { font-weight: 800; font-size: 17px; }
.tank-choice-recept { font-size: 13px; color: var(--slate); margin-top: 2px; }
.tank-choice-meta { font-family: var(--mono); font-size: 11px; color: var(--ash); margin-top: 10px; }

/* ============ MULTI-ZONE PICKER (Handmatige Beurt - Stap 1) ============ */
.mz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
}
.mz-card {
  position: relative;
  padding: 14px 14px 12px;
  border-radius: var(--radius-md);
  border: 2px solid var(--mist);
  background: var(--canvas);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-height: 64px;
  display: flex; flex-direction: column; gap: 2px;
}
.mz-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); border-color: var(--plant-300); }
.mz-card.selected {
  border-color: var(--plant-600);
  background: var(--plant-50);
  box-shadow: 0 0 0 3px rgba(34,139,34,0.10);
}
.mz-card-num {
  position: absolute; top: 8px; right: 8px;
  background: var(--plant-600); color: white;
  width: 22px; height: 22px; border-radius: 50%;
  font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.mz-card-name { font-weight: 700; font-size: 14px; color: var(--ink); }
.mz-card-meta { font-family: var(--mono); font-size: 11px; color: var(--ash); }

.mz-summary {
  background: var(--cream);
  padding: 12px 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--cream-deep);
}
.mz-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.mz-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 6px 5px 4px;
  background: var(--canvas);
  border: 1px solid var(--mist);
  border-radius: 999px;
  font-size: 12px; font-weight: 600;
}
.mz-chip-num {
  background: var(--plant-600); color: white;
  width: 18px; height: 18px; border-radius: 50%;
  font-size: 11px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
}
.mz-chip-x {
  background: transparent; border: none; cursor: pointer;
  color: var(--ash); font-size: 16px; line-height: 1; padding: 0 4px;
  border-radius: 50%;
}
.mz-chip-x:hover { color: var(--rust-600); background: var(--rust-50); }

.mz-preview-list {
  background: var(--canvas); border-radius: 8px;
  padding: 4px 0;
}
.mz-preview-row {
  display: grid;
  grid-template-columns: 28px 1fr auto auto;
  gap: 10px;
  align-items: center;
  padding: 8px 12px;
  font-size: 13px;
  border-bottom: 1px solid var(--mist);
}
.mz-preview-row:last-child { border-bottom: none; }
.mz-preview-num {
  background: var(--plant-600); color: white;
  width: 20px; height: 20px; border-radius: 50%;
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.mz-preview-name { font-weight: 600; color: var(--ink); }
.mz-preview-ml { font-family: var(--mono); color: var(--slate); font-size: 12px; }
.mz-preview-time { font-family: var(--mono); color: var(--ash); font-size: 11px; min-width: 40px; text-align: right; }

/* ============ PER-ZONE TANK PICKER (multi-smaak in Handmatige Beurt) ============ */
.mz-zonetank-list {
  display: flex; flex-direction: column; gap: 8px;
}
.mz-zonetank-row {
  display: grid;
  grid-template-columns: 28px 140px 1fr;
  gap: 12px;
  align-items: center;
  padding: 10px 12px;
  background: var(--cream);
  border-radius: var(--radius-md);
  border: 1px solid var(--cream-deep);
}
.mz-zonetank-name { font-weight: 600; font-size: 13px; color: var(--ink); }
.mz-zonetank-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.mz-zonetank-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px;
  background: var(--canvas);
  border: 2px solid var(--mist);
  border-radius: 999px;
  font-size: 12px; font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--slate);
}
.mz-zonetank-pill:hover { border-color: var(--plant-300); transform: translateY(-1px); }
.mz-zonetank-pill-dot {
  width: 10px; height: 10px; border-radius: 50%;
  flex-shrink: 0;
}
.mz-zonetank-pill.t1 .mz-zonetank-pill-dot { background: var(--tank-1); }
.mz-zonetank-pill.t2 .mz-zonetank-pill-dot { background: var(--tank-2); }
.mz-zonetank-pill.t3 .mz-zonetank-pill-dot { background: var(--tank-3); }
.mz-zonetank-pill.t4 .mz-zonetank-pill-dot { background: var(--tank-4); }
.mz-zonetank-pill.selected.t1 { border-color: var(--tank-1); background: var(--tank-1-soft); color: var(--ink); }
.mz-zonetank-pill.selected.t2 { border-color: var(--tank-2); background: var(--tank-2-soft); color: var(--ink); }
.mz-zonetank-pill.selected.t3 { border-color: var(--tank-3); background: var(--tank-3-soft); color: var(--ink); }
.mz-zonetank-pill.selected.t4 { border-color: var(--tank-4); background: var(--tank-4-soft); color: var(--ink); }

/* ============ TIMELINE WATERFALL (CYCLE PREVIEW) ============ */
.cycle-timeline {
  background: var(--canvas);
  border: 1px solid var(--mist);
  border-radius: var(--radius-md);
  padding: 24px;
}
.cycle-timeline-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
  gap: 12px;
  flex-wrap: wrap;
}
.cycle-timeline-stats {
  display: flex; gap: 18px; font-size: 12px; color: var(--slate);
}
.cycle-timeline-stats b { color: var(--ink); font-family: var(--mono); }

/* Actor waterfall */
.waterfall {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 4px 12px;
  align-items: center;
  position: relative;
}
.waterfall-actor-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--charcoal);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  text-align: right;
}
.waterfall-track {
  position: relative;
  height: 28px;
  background: var(--cream);
  border-radius: 6px;
  overflow: hidden;
}
.waterfall-block {
  position: absolute;
  top: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 11px;
  font-weight: 700;
  text-shadow: 0 1px 2px rgba(0,0,0,0.2);
  border-radius: 4px;
  overflow: hidden;
  white-space: nowrap;
}
.waterfall-block.water    { background: var(--sky-500); }
.waterfall-block.pumpwarm { background: #94a3b8; color: white; }
.waterfall-block.compress { background: #14b8a6; }
.waterfall-block.afterblow{ background: var(--amber-500); }
.waterfall-block.zoneblow { background: #8b5cf6; }

/* Vertical marker for valve close */
.waterfall-marker {
  position: absolute;
  top: 0; bottom: 0;
  width: 2px;
  background: var(--rust-500);
  z-index: 5;
}
.waterfall-marker-label {
  position: absolute;
  bottom: -22px;
  transform: translateX(-50%);
  font-size: 9.5px;
  font-weight: 700;
  color: var(--rust-500);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

.waterfall-axis {
  grid-column: 2;
  display: flex;
  justify-content: space-between;
  margin-top: 26px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ash);
  padding: 0 1px;
}

.waterfall-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--mist);
  font-size: 11px;
  color: var(--slate);
}
.waterfall-legend-item {
  display: inline-flex; align-items: center; gap: 6px;
}
.waterfall-legend-swatch { width: 12px; height: 12px; border-radius: 3px; }

/* Industrial fase pills (used in live strip + lists) */
.phase-pill {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: white;
}
.phase-pill.pumpwarm  { background: #94a3b8; }
.phase-pill.water     { background: var(--sky-500); }
.phase-pill.compress  { background: #14b8a6; }
.phase-pill.afterblow { background: var(--amber-500); }
.phase-pill.zoneblow  { background: #8b5cf6; }
.phase-pill.idle      { background: var(--cream-deep); color: var(--ash); }

/* ============ LIVE STRIP (compact, on top of pages) ============ */
.live-strip-mini {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 18px;
  background: var(--canvas);
  border: 1px solid var(--mist);
  border-radius: var(--radius-md);
  margin-bottom: 24px;
  font-size: 13px;
}
.live-strip-mini-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--plant-500); box-shadow: 0 0 0 3px var(--plant-100); }
.live-strip-mini-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--ash); }
.live-strip-mini-value { font-weight: 600; font-family: var(--mono); }

/* ============ TABLE ============ */
table.t {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
table.t th, table.t td {
  text-align: left;
  padding: 12px 16px;
  border-bottom: 1px solid var(--mist);
}
table.t th {
  font-size: 11px; font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--ash);
  background: var(--paper);
}
table.t tr:last-child td { border-bottom: none; }
table.t .cell-mono { font-family: var(--mono); font-feature-settings: 'tnum'; }

/* ============ MODAL ============ */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(28, 24, 21, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 16px;
  animation: fadeIn 0.12s ease-out;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--canvas);
  border-radius: var(--radius-lg);
  padding: 32px;
  width: 100%;
  max-width: 520px;
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: scaleIn 0.16s ease-out;
}
.modal.modal-wide { max-width: 800px; }
@keyframes scaleIn { from { transform: scale(0.97); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal h2 { margin: 0 0 8px; font-size: 22px; font-weight: 800; letter-spacing: -0.4px; }
.modal-sub { color: var(--slate); margin-bottom: 24px; font-size: 14px; }
.modal-actions {
  display: flex; gap: 10px; justify-content: flex-end;
  margin-top: 28px;
}

/* ============ TOAST ============ */
.toast-container {
  position: fixed; bottom: 24px; right: 24px;
  display: flex; flex-direction: column; gap: 8px;
  z-index: 9999;
}
.toast {
  padding: 12px 18px;
  background: var(--ink);
  color: white;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  animation: slideIn 0.2s ease-out;
  max-width: 360px;
}
.toast.success { background: var(--plant-700); }
.toast.error { background: var(--rust-600); }
.toast.warn { background: var(--amber-700); }
@keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ============ TABS (within page) ============ */
.tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--cream);
  border-radius: 12px;
  margin-bottom: 24px;
  width: max-content;
}
.tab {
  padding: 8px 16px;
  border-radius: 8px;
  background: transparent;
  border: none;
  font-size: 13px;
  font-weight: 600;
  color: var(--slate);
  cursor: pointer;
  transition: all 0.12s;
}
.tab:hover { color: var(--ink); }
.tab.active {
  background: var(--canvas);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}

/* ============ EMPTY STATES ============ */
.empty {
  padding: 60px 24px;
  text-align: center;
  background: var(--cream);
  border-radius: var(--radius-md);
  border: 1px dashed var(--mist-strong);
}
.empty-icon {
  width: 56px; height: 56px;
  background: var(--canvas);
  border-radius: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--ash);
  margin-bottom: 16px;
}
.empty-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
.empty-desc { font-size: 13px; color: var(--slate); max-width: 360px; margin: 0 auto; }

/* ============ WEEK PLANNER ============ */
.planner-layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 24px;
}
.planner-zones {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.planner-zone {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: var(--canvas);
  cursor: pointer;
  transition: all 0.12s;
  text-align: left;
  width: 100%;
  border: 1px solid var(--mist);
}
.planner-zone:hover { background: var(--cream); }
.planner-zone.selected {
  border-color: var(--plant-500);
  background: var(--plant-50);
}
.planner-zone-name { font-weight: 700; font-size: 14px; }
.planner-zone-sub { font-size: 11px; color: var(--ash); margin-top: 1px; }
.planner-zone-count {
  margin-left: auto;
  font-size: 11px;
  font-weight: 700;
  background: var(--cream);
  padding: 3px 8px;
  border-radius: 999px;
  color: var(--charcoal);
}

.week-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
}
.week-day {
  background: var(--canvas);
  border: 1px solid var(--mist);
  border-radius: var(--radius-md);
  padding: 14px;
  min-height: 240px;
  display: flex;
  flex-direction: column;
}
.week-day-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--mist);
}
.week-day-label {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--charcoal);
}
.week-day-menu {
  background: none; border: none;
  font-size: 16px;
  cursor: pointer;
  color: var(--ash);
  padding: 2px 6px;
  border-radius: 4px;
}
.week-day-menu:hover { background: var(--cream); color: var(--ink); }
.week-events {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
}
.week-event {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 9px;
  border-radius: 8px;
  background: var(--cream);
  font-size: 12px;
  cursor: pointer;
  transition: background 0.1s;
  border-left: 3px solid;
}
.week-event:hover { background: var(--cream-deep); }
.week-event.t1 { border-left-color: var(--tank-1); }
.week-event.t2 { border-left-color: var(--tank-2); }
.week-event.t3 { border-left-color: var(--tank-3); }
.week-event.t4 { border-left-color: var(--tank-4); }
.week-event-time { font-family: var(--mono); font-weight: 700; }
.week-event-vol { color: var(--slate); margin-left: auto; font-weight: 600; }
.week-add-btn {
  margin-top: 8px;
  padding: 8px;
  border: 1px dashed var(--mist-strong);
  border-radius: 8px;
  background: transparent;
  font-size: 12px;
  color: var(--ash);
  cursor: pointer;
  transition: all 0.12s;
}
.week-add-btn:hover {
  border-color: var(--plant-500);
  color: var(--plant-700);
  background: var(--plant-50);
}

/* Day menu dropdown */
.day-menu-pop {
  position: absolute;
  background: var(--canvas);
  border: 1px solid var(--mist);
  border-radius: 10px;
  box-shadow: var(--shadow-lg);
  padding: 6px;
  z-index: 100;
  min-width: 200px;
}
.day-menu-item {
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
}
.day-menu-item:hover { background: var(--cream); }

/* ============ HELP PAGE ============ */
.help-topics {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
}
.help-topic {
  padding: 22px;
  border-radius: var(--radius-md);
  background: var(--canvas);
  border: 1px solid var(--mist);
  cursor: pointer;
  transition: all 0.15s;
}
.help-topic:hover { border-color: var(--plant-300); transform: translateY(-2px); box-shadow: var(--shadow); }
.help-topic-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  background: var(--plant-50);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--plant-600);
  margin-bottom: 14px;
}
.help-topic-icon svg { width: 22px; height: 22px; }
.help-topic-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.help-topic-desc { font-size: 13px; color: var(--slate); line-height: 1.5; }

/* ============ MAINTENANCE / DEGRADATION ============ */
.degrade-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.degrade-card {
  padding: 22px;
  border-radius: var(--radius-md);
  background: var(--canvas);
  border: 1px solid var(--mist);
}
.degrade-card-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 16px;
}
.degrade-bar-wrap {
  height: 8px;
  background: var(--cream);
  border-radius: 999px;
  overflow: hidden;
  margin: 8px 0;
}
.degrade-bar {
  height: 100%;
  background: var(--plant-500);
  border-radius: 999px;
  transition: width 0.4s;
}
.degrade-bar.warn { background: var(--amber-500); }
.degrade-bar.err  { background: var(--rust-500); }

/* ============ CALIBRATION ============ */
.cal-layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 24px;
}
.cal-pumps {
  display: flex; flex-direction: column; gap: 6px;
}
.cal-pump-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid var(--mist);
  background: var(--canvas);
  cursor: pointer;
  transition: all 0.12s;
  text-align: left;
  width: 100%;
}
.cal-pump-item:hover { background: var(--cream); }
.cal-pump-item.selected { border-color: var(--plant-500); background: var(--plant-50); }
.cal-pump-color {
  width: 10px; height: 36px; border-radius: 4px;
}
.cal-pump-name { font-weight: 700; font-size: 14px; }
.cal-pump-meta { font-size: 11px; color: var(--ash); margin-top: 1px; }

.guided-step {
  background: linear-gradient(135deg, var(--plant-50) 0%, var(--canvas) 100%);
  border: 1px solid var(--plant-200);
  border-radius: var(--radius-lg);
  padding: 28px 32px;
  margin-top: 16px;
}
.guided-step-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 999px;
  background: var(--plant-100);
  color: var(--plant-700);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.guided-step-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.4px;
  margin-bottom: 8px;
}
.guided-step-desc {
  color: var(--slate);
  font-size: 14px;
  margin-bottom: 20px;
  max-width: 540px;
}
.guided-step-target {
  display: inline-flex;
  align-items: baseline;
  gap: 12px;
  padding: 18px 26px;
  background: var(--canvas);
  border-radius: 14px;
  border: 1px solid var(--plant-200);
  margin-bottom: 20px;
}
.guided-step-target-num {
  font-family: var(--mono);
  font-size: 36px;
  font-weight: 800;
  color: var(--plant-700);
  letter-spacing: -1px;
}
.guided-step-target-unit { font-size: 14px; color: var(--slate); font-weight: 600; }

.guided-levels {
  display: flex;
  gap: 10px;
  margin: 20px 0;
}
.guided-level {
  flex: 1;
  padding: 12px 8px;
  background: var(--canvas);
  border-radius: 10px;
  border: 1px solid var(--mist);
  text-align: center;
}
.guided-level.current { border-color: var(--plant-500); background: var(--plant-50); }
.guided-level.done { background: var(--plant-50); border-color: var(--plant-200); }
.guided-level.done .guided-level-num { color: var(--plant-700); }
.guided-level.done .guided-level-check { color: var(--plant-600); }
.guided-level-num {
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 800;
  color: var(--charcoal);
}
.guided-level-label {
  font-size: 11px;
  color: var(--ash);
  margin-top: 2px;
  font-weight: 600;
}
.guided-level-check {
  margin-top: 4px;
  color: var(--mist-strong);
}

.cal-chart-wrap { height: 320px; position: relative; }

/* ============ OVERVIEW DASHBOARD ============ */
.dash-hero {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 24px;
  margin-bottom: 32px;
}
.dash-tafel-card {
  background: var(--canvas);
  border: 1px solid var(--mist);
  border-radius: var(--radius-lg);
  padding: 28px;
}
.dash-tafel-card-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 18px;
}

.dash-stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

/* ============ RESPONSIVE ============ */
@media (max-width: 1100px) {
  .planner-layout { grid-template-columns: 1fr; }
  .week-grid { grid-template-columns: repeat(4, 1fr); }
  .cal-layout { grid-template-columns: 1fr; }
  .dash-hero { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .app-shell { grid-template-columns: 64px 1fr; }
  .brand-text, .brand-poweredby, .nav-section-label, .nav-item span, .nav-footer-status { display: none; }
  .brand { justify-content: center; padding: 16px 4px; margin: -16px -16px 12px; }
  .brand-cogas { max-width: 48px; }  /* logo schaalt mee, tagline weg */
  .nav-item { justify-content: center; padding: 12px 8px; }
  .week-grid { grid-template-columns: repeat(2, 1fr); }
  .content { padding: 20px 24px; }
  .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 600px) {
  .grid-3, .grid-4, .grid-2 { grid-template-columns: 1fr; }
  .week-grid { grid-template-columns: 1fr; }
  .dash-hero { grid-template-columns: 1fr; }
}

</style>

<script>
/* ====================================================================
   ALIA — DEMO-MODUS (statische versie zonder backend)
   ====================================================================
   Deze build draait volledig in de browser. Alle API-calls en WebSocket-
   verbindingen worden onderschept en met dummy-data beantwoord. Cycli
   "draaien" met realistische timing maar zonder echte hardware.
   Wijzigingen worden bewaard in localStorage zodat experimenten tussen
   sessies blijven staan. Reset-knop bovenaan om alles te wissen.
   ==================================================================== */
(function setupDemoMode() {
  const LS_KEY = 'alia_demo_state_v1';
  const DEMO_VERSION = '0.1.0-demo';

  /* ---------- Dummy default state (rijk genoeg om realistisch te oefenen) ---------- */
  function makeDefaultDemoState() {
    return {
      systemMode: 'live',
      general: {
        taktTimeSec: 90,
        softLimits: { warnMlPerPlant: 50, confirmMlPerPlant: 100, blockMlPerPlant: 500 },
      },
      tables: [
        { id: 1, name: 'Tafel A', cols: 5, rows: 4, plantsPerSlot: 1, active: true },
      ],
      zones: [
        { name: 'zone_1', table: 1, plants: 25, active: true, lastMlPerPlant: 30 },
        { name: 'zone_2', table: 1, plants: 25, active: true, lastMlPerPlant: 25 },
        { name: 'zone_3', table: 1, plants: 25, active: true, lastMlPerPlant: 35 },
        { name: 'zone_4', table: 1, plants: 25, active: true, lastMlPerPlant: 30 },
      ],
      tanks: [
        { id: 1, name: 'Tank 1', smaak: 'Water',      ec: 0.2, ph: 6.5, fillPct: 92, capacityL: 100 },
        { id: 2, name: 'Tank 2', smaak: 'Voeding A',  ec: 1.8, ph: 5.8, fillPct: 74, capacityL: 100 },
        { id: 3, name: 'Tank 3', smaak: 'Bloei',      ec: 2.0, ph: 6.0, fillPct: 81, capacityL: 100 },
        { id: 4, name: 'Tank 4', smaak: 'Wortel-mix', ec: 1.5, ph: 6.2, fillPct: 55, capacityL: 100 },
      ],
      calibrationProfiles: [
        makeProfile(1, 'Tank 1', [[0.3, 75], [0.6, 150], [1.0, 250], [1.5, 375], [2.0, 500]]),
        makeProfile(2, 'Tank 2', [[0.3, 70], [0.6, 145], [1.0, 240], [1.5, 365], [2.0, 490]]),
        makeProfile(3, 'Tank 3', [[0.3, 80], [0.6, 160], [1.0, 265], [1.5, 395], [2.0, 525]]),
        makeProfile(4, 'Tank 4', [[0.3, 72], [0.6, 148], [1.0, 245], [1.5, 370], [2.0, 495]]),
      ],
      componentWear: {
        pumps:        { 1: { runSec: 124500, switches: 8420, lastMaintenance: '2025-11-12T10:00:00Z' },
                        2: { runSec:  87320, switches: 6210, lastMaintenance: '2026-01-04T09:30:00Z' },
                        3: { runSec: 215800, switches: 12130, lastMaintenance: '2025-08-22T11:15:00Z' },
                        4: { runSec:  42100, switches: 3105, lastMaintenance: '2026-03-15T14:00:00Z' } },
        baseValves:   { 1: { switches: 8420 }, 2: { switches: 6210 }, 3: { switches: 12130 }, 4: { switches: 3105 } },
        zoneValves:   { zone_1: { switches: 6912 }, zone_2: { switches: 5210 }, zone_3: { switches: 4801 }, zone_4: { switches: 3420 } },
        compressor:   { runSec: 469720, lastMaintenance: '2025-09-30T08:00:00Z' },
        compValve:    { switches: 29765 },
      },
      schedule: [
        { day: 'maandag',  zone: 'zone_1', tank: 2, mlPerPlant: 30, time: '08:00', active: true },
        { day: 'maandag',  zone: 'zone_2', tank: 2, mlPerPlant: 25, time: '08:00', active: true },
        { day: 'woensdag', zone: 'zone_1', tank: 3, mlPerPlant: 35, time: '09:00', active: true },
        { day: 'vrijdag',  zone: 'zone_3', tank: 2, mlPerPlant: 30, time: '10:00', active: true },
      ],
      sensors: [
        { id: 's1', name: 'Substraat zone 1', kind: 'moisture', value: 38, unit: '%', updatedAt: Date.now() - 60000 },
        { id: 's2', name: 'Substraat zone 2', kind: 'moisture', value: 42, unit: '%', updatedAt: Date.now() - 50000 },
        { id: 's3', name: 'Lucht-temp kas',   kind: 'temperature', value: 21.5, unit: '°C', updatedAt: Date.now() - 30000 },
        { id: 's4', name: 'Lucht-RH kas',     kind: 'humidity',    value: 64, unit: '%', updatedAt: Date.now() - 30000 },
      ],
      cycleHistory: [
        { ts: Date.now() - 3600000, zone: 'zone_1', tank: 2, targetMl: 750, measuredMl: 745, ok: true },
        { ts: Date.now() - 3000000, zone: 'zone_2', tank: 2, targetMl: 625, measuredMl: 638, ok: true },
        { ts: Date.now() - 1800000, zone: 'zone_3', tank: 3, targetMl: 875, measuredMl: 870, ok: true },
      ],
      lastManual: { tank: 2, zones: ['zone_1'], zoneTanks: {}, perZoneSmaak: false, mlPerPlant: 30 },
    };
  }
  function makeProfile(pumpId, name, pointsArr) {
    return {
      id: 'cal_p' + pumpId,
      pump: pumpId,
      name: name,
      active: true,
      fitMethod: 'piecewise_linear',
      deadZone: 0.1,
      timestamp: '2026-03-15T10:00:00Z',
      pumpWarmupSec: 0.5, compressionSec: 2.0, afterBlowSec: 1.0, routerOpenDelaySec: 0.0, zoneBlowSec: 0.0,
      points: pointsArr.map(([t, ml]) => ({ openTime: t, samples: [ml] })),
      timingProfiles: [
        { id: 'small',  label: 'Klein',   minMl: 0,  maxMl: 20,  pumpWarmupSec: 0.5, compressionSec: 1.5, afterBlowSec: 0.8, routerOpenDelaySec: 0.0, zoneBlowSec: 0.0 },
        { id: 'normal', label: 'Normaal', minMl: 21, maxMl: 35,  pumpWarmupSec: 0.5, compressionSec: 2.0, afterBlowSec: 1.0, routerOpenDelaySec: 0.0, zoneBlowSec: 0.0 },
        { id: 'large',  label: 'Groot',   minMl: 36, maxMl: 999, pumpWarmupSec: 0.5, compressionSec: 2.5, afterBlowSec: 1.2, routerOpenDelaySec: 0.0, zoneBlowSec: 0.0 },
      ],
    };
  }

  /* ---------- State management in localStorage ---------- */
  function loadDemo() {
    try {
      const txt = localStorage.getItem(LS_KEY);
      if (txt) return JSON.parse(txt);
    } catch (e) {}
    const def = makeDefaultDemoState();
    saveDemoState(def);
    return def;
  }
  function saveDemoState(s) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch (e) {}
  }
  let demoState = loadDemo();
  /* Cycle tracking voor health-poll en phase-broadcasts. */
  let cycleActive = false;
  let cyclePhase = 'idle';
  let cycleTank = null, cycleZone = null;

  /* ---------- WebSocket-mock ---------- */
  const wsSubscribers = [];
  const RealWebSocket = window.WebSocket;
  window.WebSocket = class MockWS {
    constructor(url) {
      this.url = url;
      this.readyState = 1;
      this.onopen = null; this.onmessage = null; this.onclose = null; this.onerror = null;
      wsSubscribers.push(this);
      setTimeout(() => { try { this.onopen && this.onopen({}); } catch (e) {} }, 10);
    }
    send(data) { /* zwartgat: client stuurt enkel ping/pong */ }
    close() {
      this.readyState = 3;
      const i = wsSubscribers.indexOf(this);
      if (i >= 0) wsSubscribers.splice(i, 1);
      try { this.onclose && this.onclose({}); } catch (e) {}
    }
  };
  function broadcastWs(obj) {
    const data = JSON.stringify(obj);
    wsSubscribers.forEach(ws => {
      try { ws.onmessage && ws.onmessage({ data }); } catch (e) {}
    });
  }

  /* ---------- Mock-cyclus simulator ---------- */
  /* Loopt door warmup → water → compression → afterblow → (zoneblow) → idle
     met realistische tijden uit het profile. Update phase-broadcasts en
     berekent een "gemeten" volume met ±5% ruis voor in cycleHistory. */
  function simulateCycle(params) {
    if (cycleActive) {
      /* Queue: wacht tot huidige klaar is */
      setTimeout(() => simulateCycle(params), 200);
      return;
    }
    cycleActive = true;
    cycleTank = params.tank;
    cycleZone = params.zone;
    const profile = demoState.calibrationProfiles.find(p => p.pump === params.tank);
    const ml = params.mlPerPlant || 30;
    const target = ml * 25; /* 25 planten in demo */
    const pts = profile.points;
    /* Lineair interpoleren voor open-tijd */
    let openSec = 1.0;
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i-1], b = pts[i];
      const aMl = a.samples[0], bMl = b.samples[0];
      if (target <= bMl) {
        openSec = a.openTime + (b.openTime - a.openTime) * ((target - aMl) / (bMl - aMl));
        break;
      }
    }
    const tp = profile.timingProfiles.find(t => ml >= t.minMl && ml <= t.maxMl) || profile.timingProfiles[1];
    const phases = [
      { name: 'pump_warmup', durationMs: tp.pumpWarmupSec * 1000 },
      { name: 'water',       durationMs: openSec * 1000 },
      { name: 'compress',    durationMs: tp.compressionSec * 1000 },
      { name: 'afterblow',   durationMs: tp.afterBlowSec * 1000 },
    ];
    if (tp.zoneBlowSec > 0) phases.push({ name: 'zoneblow', durationMs: tp.zoneBlowSec * 1000 });
    /* Bereken startMs per fase. */
    let cum = 0;
    for (const ph of phases) {
      ph.startMs = cum;
      cum += ph.durationMs;
    }
    const startedAt = Date.now();
    const plannedMs = cum;
    /* Eén grote phase_change broadcast vooraf — het systeem rekent dan zelf
       de actieve fase uit op basis van wall-clock vs startMs. */
    broadcastWs({
      type: 'phase_change',
      payload: {
        tank: params.tank,
        zone: params.zone,
        mlPerPlant: ml,
        plants: 25,
        targetMl: target,
        startedAt, plannedMs, phases,
      },
    });
    /* Bij voltooien: batch_complete event + slijtage-update. */
    setTimeout(() => {
      const noise = (Math.random() - 0.5) * 0.06;
      const measured = Math.round(target * (1 + noise));
      const ok = Math.abs(measured - target) / target < 0.1;
      demoState.cycleHistory = demoState.cycleHistory || [];
      demoState.cycleHistory.unshift({ ts: Date.now(), zone: params.zone, tank: params.tank, targetMl: target, measuredMl: measured, ok });
      if (demoState.cycleHistory.length > 50) demoState.cycleHistory.length = 50;
      const w = demoState.componentWear;
      const pumpRun = tp.pumpWarmupSec + openSec;
      const compRun = tp.compressionSec + tp.afterBlowSec + (tp.zoneBlowSec || 0);
      w.pumps[params.tank].runSec += pumpRun;
      w.pumps[params.tank].switches += 1;
      w.baseValves[params.tank].switches += 1;
      if (w.zoneValves[params.zone]) w.zoneValves[params.zone].switches += 1;
      w.compressor.runSec += compRun;
      w.compValve.switches += 1;
      cycleActive = false;
      cyclePhase = 'idle';
      cycleTank = null; cycleZone = null;
      broadcastWs({
        type: 'batch_complete',
        payload: {
          ts: Date.now(),
          tank: params.tank, zone: params.zone,
          targetMl: target, measuredMl: measured, ok,
        },
      });
      broadcastWs({ type: 'wear_update', payload: w });
      saveDemoState(demoState);
    }, plannedMs);
  }

  /* ---------- Mock-test-pulse (voor kalibratie) ---------- */
  function simulateTestPulse(profile_id, params) {
    if (cycleActive) return;
    cycleActive = true;
    cyclePhase = 'water';
    const phases = [{ name: 'water', startMs: 0, durationMs: (params.openSec || 1) * 1000 }];
    broadcastWs({
      type: 'phase_change',
      payload: {
        tank: params.tank, zone: params.zone,
        mlPerPlant: params.mlPerPlant || 10, plants: 25, targetMl: 250,
        startedAt: Date.now(), plannedMs: phases[0].durationMs, phases,
      },
    });
    setTimeout(() => {
      cycleActive = false; cyclePhase = 'idle';
      broadcastWs({ type: 'batch_complete', payload: { ts: Date.now(), tank: params.tank, zone: params.zone, targetMl: 250, measuredMl: 250, ok: true } });
    }, (params.openSec + 0.5) * 1000);
  }

  /* ---------- Fetch-mock ---------- */
  const RealFetch = window.fetch.bind(window);
  window.fetch = async function(url, options) {
    const u = typeof url === 'string' ? url : (url && url.url) || '';
    const method = ((options && options.method) || 'GET').toUpperCase();
    let body = null;
    try { body = options && options.body ? JSON.parse(options.body) : null; } catch (e) {}

    /* Alle non-API requests gewoon laten lopen (assets, etc.) */
    if (!u.includes('/api/')) return RealFetch(url, options);

    /* /api/health */
    if (u.includes('/api/health')) {
      return jsonResponse({
        ok: true,
        systemMode: demoState.systemMode || 'live',
        cycleActive: cycleActive,
        cyclePhase: cyclePhase,
        hardware: { attached: 13, total: 13, flowSensorsEnabled: false },
        version: DEMO_VERSION,
      });
    }
    /* /api/state GET/PUT */
    if (u.endsWith('/api/state') || u.includes('/api/state?')) {
      if (method === 'GET') return jsonResponse(demoState);
      if (method === 'PUT') {
        if (body && typeof body === 'object') {
          demoState = { ...demoState, ...body };
          saveDemoState(demoState);
        }
        return jsonResponse({ ok: true });
      }
    }
    /* Commands */
    if (u.includes('/api/command/set_mode')) {
      demoState.systemMode = body.mode;
      saveDemoState(demoState);
      return jsonResponse({ ok: true });
    }
    if (u.includes('/api/command/manual_cycle')) {
      simulateCycle(body);
      return jsonResponse({ queued: true });
    }
    if (u.includes('/test_pulse')) {
      const m = u.match(/\/api\/calibration\/([^\/]+)\/test_pulse/);
      const profileId = m ? m[1] : null;
      simulateTestPulse(profileId, body);
      return jsonResponse({ queued: true, forcedOpenSec: body.openSec });
    }
    /* Default: 200 OK */
    return jsonResponse({ ok: true });
  };
  function jsonResponse(obj) {
    return new Response(JSON.stringify(obj), { status: 200, headers: { 'Content-Type': 'application/json' }});
  }

  /* ---------- Demo-banner ---------- */
  /* Neutrale donkergrijze strook bovenaan; subtiel maar duidelijk. */
  function injectDemoBanner() {
    /* Vaste banner-hoogte zodat CSS overrides voorspelbaar werken. */
    const BANNER_H = 36;
    const TOPBAR_H_GUESS = 44;
    /* Inject CSS-overrides: forceer de topbar onder onze banner via !important.
       Hierdoor kunnen layoutTopChrome() / renderTopbar() de inline `top: 0px`
       zetten wat ze willen — onze CSS wint en de bar blijft staan. Geen
       MutationObserver-race meer. */
    const style = document.createElement('style');
    style.id = 'alia-demo-style';
    style.textContent = `
      #alia-demo-banner {
        position: fixed; top: 0; left: 0; right: 0; z-index: 99999;
        height: ${BANNER_H}px; box-sizing: border-box;
        background: #475569; color: #f1f5f9;
        font: 600 12px/1.3 ui-sans-serif,system-ui,-apple-system,sans-serif;
        padding: 8px 16px;
        display: flex; align-items: center; gap: 14px;
        border-bottom: 1px solid rgba(0,0,0,0.15);
        letter-spacing: 0.02em;
      }
      #alia-topbar { top: ${BANNER_H}px !important; }
      #alia-hero-banner { top: ${BANNER_H}px !important; }
      body { padding-top: ${BANNER_H + TOPBAR_H_GUESS}px !important; }
      #alia-demo-reset {
        background: rgba(255,255,255,0.12); color: #f1f5f9;
        border: 1px solid rgba(255,255,255,0.25);
        padding: 4px 12px; border-radius: 5px;
        font: inherit; cursor: pointer;
      }
      #alia-demo-reset:hover { background: rgba(255,255,255,0.2); }
    `;
    document.head.appendChild(style);

    const el = document.createElement('div');
    el.id = 'alia-demo-banner';
    el.innerHTML = `
      <span style="font-size:13px;opacity:0.85;">●</span>
      <span style="flex:1;">Demo-modus · geen hardware aangesloten · wijzigingen worden bewaard in deze browser</span>
      <button id="alia-demo-reset">↻ Reset demo</button>
    `;
    document.body.appendChild(el);
    document.getElementById('alia-demo-reset').addEventListener('click', () => {
      if (!confirm('Demo-data terugzetten naar beginstand? Al je wijzigingen gaan verloren.')) return;
      try { localStorage.removeItem(LS_KEY); } catch (e) {}
      location.reload();
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', injectDemoBanner);
  } else {
    injectDemoBanner();
  }
  /* Globale marker zodat de hoofdcode kan zien dat we in demo zitten. */
  window.ALIA_DEMO = true;
})();
</script>

<script>

   Single-file vanilla JS, persisted state in localStorage.
   ==================================================================== */

/* ====================================================================
   1. STATE SCHEMA + MIGRATION

     · pumpWarmupSec, compressionSec, afterBlowSec verhuisd naar calibration profile per pomp
     · cycleDefaults verwijderd (alles zit nu in active profile)
     · tafels[] met active flag
     · zones krijgen `active` + `plants` velden

const DEFAULT_STATE = {

  /* Tafels — alleen Tafel 1 actief by default */
  tables: [
    { id: 1, name: 'Tafel 1', active: true },
    { id: 2, name: 'Tafel 2', active: false },
    { id: 3, name: 'Tafel 3', active: false },
    { id: 4, name: 'Tafel 4', active: false },
  ],

  baseStation: [

function migrateState(stored) {
  /* Promote v1/v2/v3 → v4. Conservatively pick what's safe to carry over */
  const v = stored.schemaVersion || 1;
  if (v >= SCHEMA_VERSION) return stored;

  const next = JSON.parse(JSON.stringify(DEFAULT_STATE));

  /* Carry over user-set tanks (with smaak rename) */
  if (Array.isArray(stored.tanks)) {
    stored.tanks.forEach((t, i) => {
      if (next.tanks[i]) {
        if (t.name) next.tanks[i].name = t.name;
        if (t.recept || t.smaak) next.tanks[i].smaak = t.smaak || t.recept;
        if (typeof t.ec === 'number') next.tanks[i].ec = t.ec;
        if (typeof t.ph === 'number') next.tanks[i].ph = t.ph;
      }
    });
  }

  /* Hardware mapping carries 1:1 */
  if (Array.isArray(stored.baseStation)) next.baseStation = stored.baseStation;
  if (Array.isArray(stored.routers))     next.routers     = stored.routers;
  if (Array.isArray(stored.hubs))        next.hubs        = stored.hubs;
  if (stored.componentStates) next.componentStates = stored.componentStates;
  if (stored.valveStates)     next.valveStates     = stored.valveStates;
  if (stored.general && typeof stored.general.taktTimeSec === 'number') {
    next.general.taktTimeSec = stored.general.taktTimeSec;
  }

  /* Zones: keep hardware mapping, drop tafel-assignments from v1/v2,
     set first 4 active for Tafel 1 (matches user's current physical setup) */
  if (Array.isArray(stored.zones) && stored.zones.length === 16) {
    stored.zones.forEach((z, i) => {
      if (next.zones[i]) {
        if (z.port)      next.zones[i].port      = z.port;
        if (z.relayCh)   next.zones[i].relayCh   = z.relayCh;
        if (z.hubSerial) next.zones[i].hubSerial = z.hubSerial;
        if (z.station)   next.zones[i].station   = z.station;
        if (typeof z.plants === 'number') next.zones[i].plants = z.plants;
        /* Old v2/v3 had table=1..4 hardcoded for all zones. Reset to only first 4 active. */
        if (i < 4) {
          next.zones[i].table  = 1;
          next.zones[i].active = true;
        } else {
          next.zones[i].table  = null;
          next.zones[i].active = false;
        }
      }
    });
  }

  /* Calibration profiles: keep curve data, set new warm-up/after-blow fields */
  if (Array.isArray(stored.calibrationProfiles)) {
    stored.calibrationProfiles.forEach(sp => {
      const target = next.calibrationProfiles.find(p => p.pump === sp.pump);
      if (target) {
        if (sp.name) target.name = sp.name;
        if (sp.timestamp) target.timestamp = sp.timestamp;
        if (Array.isArray(sp.points) && sp.points.length) target.points = sp.points;
        if (typeof sp.deadZone === 'number') target.deadZone = sp.deadZone;
        if (sp.fitMethod) target.fitMethod = sp.fitMethod;
        if (typeof sp.active === 'boolean') target.active = sp.active;
        /* Migrate cycle defaults into profile */
        if (stored.cycleDefaults) {
          target.pumpWarmupSec   = stored.cycleDefaults.pumpWarmupSec   ?? target.pumpWarmupSec;
          target.compressionSec  = stored.cycleDefaults.compressionSec  ?? target.compressionSec;
          target.afterBlowSec    = stored.cycleDefaults.afterBlowSec    ?? target.afterBlowSec;
        }
        /* Per-pomp routerOpenDelaySec (legacy globaal veld) */
        if (typeof sp.routerOpenDelaySec === 'number') target.routerOpenDelaySec = sp.routerOpenDelaySec;
        /* timingProfiles: behoud opgeslagen bereiken, anders houden we de fabrieks-defaults */
        if (Array.isArray(sp.timingProfiles) && sp.timingProfiles.length) {
          target.timingProfiles = sp.timingProfiles.map(tp => ({
            id:                 tp.id    || 'range',
            label:              tp.label || `${tp.minMl ?? 0}-${tp.maxMl ?? 999} mL`,
            minMl:              typeof tp.minMl === 'number' ? tp.minMl : 0,
            maxMl:              typeof tp.maxMl === 'number' ? tp.maxMl : 999,
            pumpWarmupSec:      typeof tp.pumpWarmupSec      === 'number' ? tp.pumpWarmupSec      : (target.pumpWarmupSec      ?? 0.5),
            compressionSec:     typeof tp.compressionSec     === 'number' ? tp.compressionSec     : (target.compressionSec     ?? 2.0),
            afterBlowSec:       typeof tp.afterBlowSec       === 'number' ? tp.afterBlowSec       : (target.afterBlowSec       ?? 1.0),
            routerOpenDelaySec: typeof tp.routerOpenDelaySec === 'number' ? tp.routerOpenDelaySec : (target.routerOpenDelaySec ?? 0.0),
            zoneBlowSec:        typeof tp.zoneBlowSec        === 'number' ? tp.zoneBlowSec        : (target.zoneBlowSec        ?? 0.0),
          }));
        }
      }
    });
  }

  /* Drop old schedules silently (they used different data model) */
  if (stored.batchEvents) next.batchEvents = stored.batchEvents;

  next.schemaVersion = SCHEMA_VERSION;
  return next;
}

function loadState() {
  try {
    const raw = localStorage.getItem('alia_state');
    if (raw) {
      state = migrateState(JSON.parse(raw));

    }
    if (!state.substrate) state.substrate = generateInitialSubstrate();
    if (!state.batchEvents) state.batchEvents = [];
    saveState();
  } catch (e) {
    state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    state.substrate = generateInitialSubstrate();
  }

/* ====================================================================
   2. CURVE LIBRARY (calibration evaluation)
==================================================================== */
function mean(arr)  { return (!arr || !arr.length) ? 0 : arr.reduce((a,b) => a+(+b), 0) / arr.length; }
function stdev(arr) {
  if (!arr || arr.length < 2) return 0;
  const m = mean(arr);
  return Math.sqrt(arr.reduce((a,b) => a + (b-m)**2, 0) / (arr.length - 1));
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function profilePoints(profile) {
  if (!profile || !profile.points) return [];
  return profile.points
    .map(p => ({ x: +p.openTime, y: mean(p.samples), std: stdev(p.samples), n: (p.samples||[]).length, raw: p }))
    .filter(p => !isNaN(p.x) && !isNaN(p.y) && p.y >= 0)
    .sort((a,b) => a.x - b.x);
}
function volumeForTime(profile, sec) {
  const pts = profilePoints(profile);
  if (pts.length === 0) return { ml: 0, region: 'sparse' };
  if (sec < (profile.deadZone || 0)) return { ml: 0, region: 'dead' };
  if (sec <= pts[0].x) {
    const ratio = sec / pts[0].x;
    return { ml: pts[0].y * ratio, region: 'reliable' };
  }
  for (let i = 1; i < pts.length; i++) {
    if (sec <= pts[i].x) {
      const a = pts[i-1], b = pts[i];
      const t = (sec - a.x) / (b.x - a.x);
      return { ml: a.y + t * (b.y - a.y), region: 'reliable' };
    }
  }
  const a = pts[pts.length - 2] || { x: 0, y: 0 };
  const b = pts[pts.length - 1];
  const slope = (b.y - a.y) / Math.max(0.001, b.x - a.x);
  return { ml: b.y + slope * (sec - b.x), region: 'extrapolated' };
}
function timeForVolume(profile, ml) {
  const pts = profilePoints(profile);
  if (pts.length === 0) return { sec: 0, region: 'sparse' };
  if (ml <= 0) return { sec: 0, region: 'reliable' };
  if (ml <= pts[0].y) {
    const sec = (ml / pts[0].y) * pts[0].x;
    return { sec, region: sec < (profile.deadZone || 0) ? 'dead' : 'reliable' };
  }
  for (let i = 1; i < pts.length; i++) {
    if (ml <= pts[i].y) {
      const a = pts[i-1], b = pts[i];
      const t = (ml - a.y) / (b.y - a.y);
      return { sec: a.x + t * (b.x - a.x), region: 'reliable' };
    }
  }
  const a = pts[pts.length - 2] || { x: 0, y: 0 };
  const b = pts[pts.length - 1];
  const slope = (b.x - a.x) / Math.max(0.001, b.y - a.y);
  return { sec: b.x + slope * (ml - b.y), region: 'extrapolated' };
}
function profileR2(profile) {
  if (!profile) return null;
  const flat = [];
  (profile.points || []).forEach(p => (p.samples || []).forEach(s => flat.push({ x: +p.openTime, y: +s })));
  if (flat.length < 3) return null;
  const yMean = mean(flat.map(d => d.y));
  let ssRes = 0, ssTot = 0;
  flat.forEach(d => {
    const pred = volumeForTime(profile, d.x).ml;
    ssRes += (d.y - pred) ** 2;
    ssTot += (d.y - yMean) ** 2;
  });
  if (ssTot === 0) return null;
  return 1 - ssRes / ssTot;
}
function activeProfileForPump(pumpId) {
  return (state.calibrationProfiles || []).find(p => p.pump === pumpId && p.active)
      || (state.calibrationProfiles || []).find(p => p.pump === pumpId);
}
function profileAgeDays(profile) {
  if (!profile || !profile.timestamp) return null;
  const t = new Date(profile.timestamp).getTime();
  if (isNaN(t)) return null;
  return (Date.now() - t) / (1000 * 60 * 60 * 24);
}

/* ====================================================================
   3. CYCLE COMPUTATION — alles uit het kalibratieprofiel
==================================================================== */

/** Geeft de timings (warmup / compressie / nablazing / router-delay) voor
 *  een gegeven mlPerPlant. Zoekt eerst in profile.timingProfiles (per-bereik),
 *  valt terug op de globale velden van het profile, dan op defaults. */
function getTimingsForMl(profile, mlPerPlant) {
  const def = {
    pumpWarmupSec:      profile?.pumpWarmupSec      ?? 0.5,
    compressionSec:     profile?.compressionSec     ?? 2.0,
    afterBlowSec:       profile?.afterBlowSec       ?? 1.0,
    routerOpenDelaySec: profile?.routerOpenDelaySec ?? 0.0,
    zoneBlowSec:        profile?.zoneBlowSec        ?? 0.0,
    rangeId:            'default',
    rangeLabel:         'Standaard',
  };
  if (!profile || !Array.isArray(profile.timingProfiles) || !profile.timingProfiles.length) return def;
  const match = profile.timingProfiles.find(tp => {
    const lo = (tp.minMl ?? 0);
    const hi = (tp.maxMl ?? 9999);
    return mlPerPlant >= lo && mlPerPlant <= hi;
  });
  if (!match) return def;
  return {
    pumpWarmupSec:      match.pumpWarmupSec      ?? def.pumpWarmupSec,
    compressionSec:     match.compressionSec     ?? def.compressionSec,
    afterBlowSec:       match.afterBlowSec       ?? def.afterBlowSec,
    routerOpenDelaySec: match.routerOpenDelaySec ?? def.routerOpenDelaySec,
    zoneBlowSec:        match.zoneBlowSec        ?? def.zoneBlowSec,
    rangeId:            match.id || 'range',
    rangeLabel:         match.label || `${match.minMl}-${match.maxMl} mL`,
  };
}

function computeCycle(tankId, zoneName, mlPerPlant) {
  const zone = state.zones.find(z => z.name === zoneName);
  const profile = activeProfileForPump(tankId);
  const plants = zone ? zone.plants : 25;
  const totalMl = mlPerPlant * plants;
  const inv = timeForVolume(profile, totalMl);
  const t = getTimingsForMl(profile, mlPerPlant);
  return {
    profile,
    tank: state.tanks.find(t => t.id === tankId),
    zone,
    plants,
    mlPerPlant,
    totalMl,
    pumpWarmupSec:      t.pumpWarmupSec,
    waterSec:           inv.sec,
    compressionSec:     t.compressionSec,
    afterBlowSec:       t.afterBlowSec,
    routerOpenDelaySec: t.routerOpenDelaySec,
    zoneBlowSec:        t.zoneBlowSec,
    rangeId:            t.rangeId,
    rangeLabel:         t.rangeLabel,
    region:             inv.region,
    totalSec:           t.pumpWarmupSec + inv.sec + t.compressionSec + t.afterBlowSec + t.zoneBlowSec,
  };
}

function generateInitialSubstrate() {
  const out = {};
  for (let t = 1; t <= 4; t++) {
    const points = [];
    for (let i = 1; i <= 8; i++) {
      points.push({ id: i,
        ec: 2.5 + (Math.random() - 0.5) * 0.6,
        temp: 21 + (Math.random() - 0.5) * 1.5,
        moisture: 55 + (Math.random() - 0.5) * 18,
      });
    }
    const history = points.map(p => {
      const h = { ec: [], temp: [], moisture: [] };
      for (let i = 0; i < 30; i++) {
        h.ec.push(p.ec + (Math.random() - 0.5) * 0.15);
        h.temp.push(p.temp + (Math.random() - 0.5) * 0.4);
        h.moisture.push(p.moisture + (Math.random() - 0.5) * 4);
      }
      return h;
    });
    out[t] = { points, history };
  }
  return out;
}
function advanceSubstrate() {
  if (!state.substrate) return;
  for (let t = 1; t <= 4; t++) {
    const tafel = state.substrate[t];
    if (!tafel) continue;
    tafel.points.forEach((p, i) => {
      p.ec       = clamp(p.ec       + (Math.random() - 0.5) * 0.08, 1.0, 4.5);
      p.temp     = clamp(p.temp     + (Math.random() - 0.5) * 0.15, 17, 28);
      p.moisture = clamp(p.moisture + (Math.random() - 0.5) * 2.5, 25, 90);
      const h = tafel.history[i];
      h.ec.push(p.ec); if (h.ec.length > 30) h.ec.shift();
      h.temp.push(p.temp); if (h.temp.length > 30) h.temp.shift();
      h.moisture.push(p.moisture); if (h.moisture.length > 30) h.moisture.shift();
    });
  }
}

function pickNextBatch() {
  const activeZones = state.zones.filter(z => z.active);
  if (!activeZones.length) return null;
  const z = activeZones[liveCounter % activeZones.length];
  liveCounter++;
  const tankId = ((liveCounter - 1) % 4) + 1;
  const mlPerPlant = [30, 30, 45, 60][liveCounter % 4];
  return { tankId, zone: z, mlPerPlant };
}
function simulateBatch() {
  if (state.systemMode !== 'live') return;
  const next = pickNextBatch();
  if (!next) return;
  const cycle = computeCycle(next.tankId, next.zone.name, next.mlPerPlant);
  if (!cycle.totalMl) return;
  const noisePct = (Math.random() - 0.5) * 0.07;
  const biasPct = { 1: 0.005, 2: -0.01, 3: 0.02, 4: -0.008 }[next.tankId] || 0;
  const anomaly = Math.random() < 0.05 ? (Math.random() - 0.5) * 0.18 : 0;
  const measuredMl = cycle.totalMl * (1 + biasPct + noisePct + anomaly);
  const deviationPct = (measuredMl - cycle.totalMl) / cycle.totalMl * 100;
  const evt = {
    ts: Date.now(),
    tank: next.tankId,
    zone: next.zone.name,
    table: next.zone.table,
    plants: next.zone.plants,
    mlPerPlant: next.mlPerPlant,
    targetMl: cycle.totalMl,
    openSec: +cycle.waterSec.toFixed(3),
    measuredMl: +measuredMl.toFixed(1),
    deviationPct: +deviationPct.toFixed(2),
    region: cycle.region,
  };
  state.batchEvents.unshift(evt);
  if (state.batchEvents.length > 200) state.batchEvents.length = 200;

  /* Componentslijtage tikken */
  const wear = state.componentWear;
  wear.pumps[next.tankId].runSec += cycle.pumpWarmupSec + cycle.waterSec;
  wear.pumps[next.tankId].runSecLifetime += cycle.pumpWarmupSec + cycle.waterSec;
  wear.pumps[next.tankId].batches += 1;
  wear.compressor.runSec += cycle.compressionSec + cycle.afterBlowSec;
  wear.compressor.runSecLifetime += cycle.compressionSec + cycle.afterBlowSec;
  const z = next.zone.name;
  if (!wear.valves[z]) wear.valves[z] = { opens: 0 };
  wear.valves[z].opens += 1;

  livePhase = {
    tank: next.tankId,
    zone: next.zone.name,
    mlPerPlant: next.mlPerPlant,
    plants: next.zone.plants,
    targetMl: cycle.totalMl,
    startedAt: Date.now(),
    plannedMs: cycle.totalSec * 1000,
    phases: [
      { id: 'pumpwarm', label: 'Pomp opdrukken', durMs: cycle.pumpWarmupSec * 1000 },
      { id: 'water',    label: 'Water',          durMs: cycle.waterSec * 1000 },
      { id: 'compress', label: 'Lucht duwt',     durMs: cycle.compressionSec * 1000 },
      { id: 'afterblow',label: 'Naspoelen',      durMs: cycle.afterBlowSec * 1000 },
      ...(cycle.zoneBlowSec > 0 ? [{ id: 'zoneblow', label: 'Zone leeg-blazen', durMs: cycle.zoneBlowSec * 1000 }] : []),
    ],
  };
  saveState();
  refreshLiveStrip();
  if (getRoute() === 'overview') refreshOverviewLive();
  if (getRoute() === 'charts') refreshChartsLive();
}

function startLiveEngine() {
  stopLiveEngine();
  batchInterval = setInterval(simulateBatch, 5000);
  subInterval   = setInterval(() => { advanceSubstrate(); if (getRoute() === 'sensors') refreshSensorsLive(); }, 7000);
  stripInterval = setInterval(refreshLiveStrip, 200);
  setTimeout(simulateBatch, 800);
}
function stopLiveEngine() {
  if (batchInterval) clearInterval(batchInterval);
  if (subInterval)   clearInterval(subInterval);
  if (stripInterval) clearInterval(stripInterval);
  batchInterval = subInterval = stripInterval = null;
}

function currentPhase() {
  if (!livePhase.startedAt || !livePhase.phases) return { id: 'idle', label: 'Klaar', remMs: 0 };
  const elapsed = Date.now() - livePhase.startedAt;
  if (elapsed >= livePhase.plannedMs) return { id: 'idle', label: 'Klaar', remMs: 0 };
  let acc = 0;
  for (const ph of livePhase.phases) {
    if (elapsed < acc + ph.durMs) {
      return { id: ph.id, label: ph.label, remMs: (acc + ph.durMs) - elapsed, totalRemMs: livePhase.plannedMs - elapsed };
    }
    acc += ph.durMs;
  }
  return { id: 'idle', label: 'Klaar', remMs: 0 };
}

/* ====================================================================
   5. UTILITY HELPERS (toast, modal, svg)
==================================================================== */
function toast(msg, kind = '') {
  const c = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 250); }, 2400);
}
function openModal(html, options = {}) {
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal ${options.wide ? 'modal-wide' : ''}">${html}</div>`;
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', (e) => {
    if (e.target === backdrop && !options.persistent) backdrop.remove();
  });
  return backdrop;
}
function svgEl(path, size = 16, stroke = 2) {
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
}
function fmtTime(ts) {
  const d = new Date(ts);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
}
function fmtTimeShort(ts) {
  const d = new Date(ts);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso); if (isNaN(d.getTime())) return iso;
  return `${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;
}
function fmtDuration(sec) {
  if (sec < 60) return `${sec.toFixed(0)}s`;
  if (sec < 3600) return `${Math.floor(sec/60)}m ${Math.round(sec%60)}s`;
  return `${Math.floor(sec/3600)}h ${Math.floor((sec%3600)/60)}m`;
}
function devClass(absPct) {
  const a = Math.abs(absPct);
  if (a <= 2) return 'ok';
  if (a <= 5) return 'near';
  if (a <= 10) return 'warn';
  return 'bad';
}

function refreshLiveStrip() {

  const strips = document.querySelectorAll('.live-strip-mini');
  if (!strips.length) return;
  const mode = state.systemMode;
  let html = '';
  if (mode === 'paused') {
    html = `
      <span class="status-dot warn"></span>
      <strong>Gepauzeerd</strong>
      <span class="muted" style="font-size: 12px;">— alle activiteit gestopt. Klik op het mode-knopje om door te gaan.</span>
    `;
  } else if (mode === 'dryrun') {
    html = `
      <span class="status-dot" style="background: var(--sky-500); margin-right: 8px;"></span>
      <strong>Test-modus</strong>
      <span class="muted" style="font-size: 12px;">— hardware staat uit, alles wordt gesimuleerd voor demo.</span>
    `;
  } else {
    const ph = currentPhase();
    if (ph.id === 'idle') {
      html = `
        <span class="live-strip-mini-dot"></span>
        <span class="live-strip-mini-label">Status</span>
        <span class="live-strip-mini-value">Wacht op volgende beurt…</span>
